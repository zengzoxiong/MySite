<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏导航</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 头部区域 -->
        <header class="header">
            <h1>📚 我的收藏导航</h1>
            <p class="subtitle">快速访问你收藏的网站</p>
        </header>

        <!-- 自建工具区 -->
        <section class="tools-section" aria-label="我的工具">
            <div class="tools-title">🧰 我的工具</div>
            <div class="tools-grid">
                <a class="tool-card" href="svg-editor.html" target="_blank" rel="noopener noreferrer"
                   title="在线 SVG 可视化编辑器：绘图、连线、模板、导出">
                    <span class="tool-icon">✏️</span>
                    <div class="tool-info">
                        <div class="tool-name">SVG 可视化编辑器</div>
                        <div class="tool-desc">在线绘制架构图 / 流程图，支持保存与导出</div>
                    </div>
                    <span class="tool-open">打开 ↗</span>
                </a>
                <!-- 后续自建工具在此追加 tool-card -->
            </div>
        </section>

        <!-- 搜索和筛选区域 -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 搜索链接..." autocomplete="off">
            </div>
            <div class="category-tags" id="categoryTags">
                <button class="tag active" data-category="all">全部</button>
            </div>
        </div>

        <!-- 链接卡片容器 -->
        <main class="links-grid" id="linksGrid">
            <!-- 卡片将通过 JavaScript 动态生成 -->
        </main>

        <!-- 空状态提示 -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <p>😅 没有找到匹配的链接</p>
        </div>

        <!-- 主题切换按钮 -->
        <button class="theme-toggle" id="themeToggle" title="切换主题">
            <span class="theme-icon">🌙</span>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
