<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏导航</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 移动端遮罩 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 左侧侧栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">Nav</span>
            <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="收缩侧栏">‹</button>
        </div>

        <div class="sidebar-search">
            <input type="text" id="searchInput" placeholder="搜索..." autocomplete="off">
        </div>

        <nav class="sidebar-nav">
            <div class="sidebar-section">
                <div class="sidebar-section-title">工具</div>
                <div class="sidebar-tools" id="sidebarTools">
                    <!-- JS 动态渲染 -->
                </div>
            </div>

            <div class="sidebar-divider"></div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">收藏</div>
                <div class="sidebar-categories" id="sidebarCategories">
                    <!-- JS 动态渲染 -->
                </div>
            </div>
        </nav>

        <div class="sidebar-footer">
            <button class="theme-toggle" id="themeToggle" title="切换主题">
                <span class="theme-icon">🌙</span>
                <span class="theme-label">主题</span>
            </button>
        </div>
    </aside>

    <!-- 移动端菜单按钮 -->
    <button class="mobile-menu-btn" id="mobileMenuBtn" title="打开菜单">☰</button>

    <!-- 右侧内容区 -->
    <main class="main-content" id="mainContent">
        <div class="links-grid" id="linksGrid"></div>
        <div class="empty-state" id="emptyState" style="display: none;">
            <p>没有找到匹配的内容</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
