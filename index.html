<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾光集</title>
    <meta name="description" content="拾光集：个人数字花园——在线工具导航、网站收藏、影视观看记录与实时仪表盘（时钟/天气/GitHub 数据/今日一言/待办清单）。">
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta property="og:title" content="拾光集">
    <meta property="og:description" content="拾光集：个人数字花园——工具导航、网站收藏、影视记录与实时仪表盘。">
    <meta property="og:type" content="website">
    <link rel="manifest" href="manifest.json">
    <script async src="https://busuanzi.cc/js/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><path d='M30 45h40v25a5 5 0 01-5 5H35a5 5 0 01-5-5V45z' fill='white' opacity='.9'/><path d='M42 45V35a8 8 0 0116 0v10' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/></svg>" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 移动端遮罩 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 左侧侧栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">拾光集</span>
            <div class="header-actions">
                <button class="home-btn" id="homeNav" title="回到首页">
                    <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                </button>
                <button class="settings-btn" id="settingsBtn" title="设置">
                    <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.61 3.61 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
                <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="收缩侧栏">‹</button>
            </div>
        </div>

        <div class="sidebar-search">
            <input type="text" id="searchInput" placeholder="搜索..." autocomplete="off" aria-label="搜索网站收藏、工具与影视">
        </div>

        <nav class="sidebar-nav">
            <div class="sidebar-section">
                <button class="sidebar-section-title" data-section="tools" title="展开/收起工具分类">在线工具<span class="section-chevron">›</span></button>
                <div class="section-body sidebar-tools" id="sidebarTools">
                    <!-- JS 动态渲染 -->
                </div>
            </div>

            <div class="sidebar-divider"></div>

            <div class="sidebar-section">
                <button class="sidebar-section-title" data-section="favorites" title="展开/收起收藏分类">网站收藏<span class="section-chevron">›</span></button>
                <div class="section-body sidebar-categories" id="sidebarCategories">
                    <!-- JS 动态渲染 -->
                </div>
            </div>

            <div class="sidebar-divider"></div>

            <div class="sidebar-section">
                <button class="sidebar-section-title" data-section="agentSkills" title="展开/收起 Agent Skills">Agent Skills<span class="section-chevron">›</span></button>
                <div class="section-body" id="sidebarAgentSkills">
                    <!-- JS 动态渲染 -->
                </div>
            </div>

            <div class="sidebar-divider"></div>

            <div class="sidebar-section">
                <button class="sidebar-section-title" data-section="media" title="展开/收起影视记录">影视收藏<span class="section-chevron">›</span></button>
                <div class="section-body sidebar-media" id="sidebarMedia">
                    <!-- JS 动态渲染 -->
                </div>
            </div>
        </nav>

    </aside>

    <!-- 移动端菜单按钮 -->
    <button class="mobile-menu-btn" id="mobileMenuBtn" title="打开菜单">☰</button>

    <!-- 右侧内容区 -->
    <main class="main-content" id="mainContent">
        <!-- 首页仪表盘：全屏沉浸式，无卡片 -->
        <section class="dashboard" id="dashboard">
            <!-- 中央主视觉：时钟 + 天气 -->
            <div class="hero">
                <div class="hero-clock" id="clockTime">--:--:--</div>
                <div class="hero-date" id="clockDate">&nbsp;</div>
                <div class="hero-weather" id="heroWeather" role="button" tabindex="0" aria-label="点击刷新西安天气">
                    <div class="weather-main">
                        <span class="weather-icon" id="weatherIcon">🌤️</span>
                        <span class="weather-temp" id="weatherTemp">--°C</span>
                        <span class="weather-desc" id="weatherDesc">天气获取中...</span>
                    </div>
                    <div class="weather-extra" id="weatherExtra"></div>
                </div>
            </div>

            <!-- 右上：GitHub 传送门 -->
            <a class="corner github-corner" href="https://github.com/zengzoxiong" target="_blank" rel="noopener noreferrer" title="前往我的 GitHub 主页">
                <svg class="github-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
                <span class="gh-name">zengzoxiong ↗</span>
                <span class="github-stats" id="githubStats">
                    <span><b id="ghRepos">–</b> 仓库</span>
                    <span><b id="ghFollowers">–</b> 粉丝</span>
                </span>
            </a>

            <!-- 右上：站点访问统计（不蒜子，加载失败自动隐藏） -->
            <div class="corner site-stat" id="siteStat">
                <span id="busuanzi_container_site_pv" style="display:none">
                    👁 本站访问 <span id="busuanzi_value_site_pv"></span> 次 · <span id="busuanzi_value_site_uv"></span> 位访客
                </span>
            </div>

            <!-- 左下：时光进度 -->
            <div class="corner progress-corner">
                <div class="section-label">时光进度</div>
                <div class="progress-item">
                    <div class="progress-head"><span>今年</span><span id="pctYear">0%</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="fillYear"></div></div>
                </div>
                <div class="progress-item">
                    <div class="progress-head"><span>本月</span><span id="pctMonth">0%</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="fillMonth"></div></div>
                </div>
                <div class="progress-item">
                    <div class="progress-head"><span>本周</span><span id="pctWeek">0%</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="fillWeek"></div></div>
                </div>
            </div>

            <!-- 底部中央：今日一言 -->
            <div class="corner quote-corner">
                <div class="quote-text" id="quoteText">获取中...</div>
                <div class="quote-foot">
                    <span class="quote-meta" id="quoteMeta"></span>
                    <button class="quote-refresh" id="quoteRefresh" title="换一句">↻</button>
                </div>
            </div>

            <!-- 右下：待办清单 -->
            <div class="corner todo-corner">
                <div class="section-label">待办清单<span class="todo-count" id="todoCount"></span></div>
                <form class="todo-form" id="todoForm">
                    <input type="text" id="todoInput" placeholder="添加待办，回车保存..." maxlength="60" autocomplete="off" aria-label="添加待办">
                </form>
                <ul class="todo-list" id="todoList"></ul>
            </div>
        </section>

        <div class="links-grid" id="linksGrid"></div>
        <div class="media-grid" id="mediaGrid" style="display: none;"></div>

        <!-- 设置弹层：iframe 独立页（挂在 body 下，避免被侧栏 transform/overflow 影响） -->
        <div class="settings-modal" id="settingsModal" hidden>
            <div class="settings-backdrop" id="settingsBackdrop"></div>
            <div class="settings-modal-box" role="dialog" aria-modal="true" aria-label="设置">
                <button class="settings-modal-close" id="settingsClose" title="关闭设置">✕</button>
                <iframe src="settings.html" title="设置"></iframe>
            </div>
        </div>

        <!-- 命令面板 Ctrl/Cmd+K -->
        <div class="cmdk" id="cmdk" hidden>
            <div class="cmdk-backdrop" id="cmdkBackdrop"></div>
            <div class="cmdk-box" role="dialog" aria-modal="true" aria-label="命令面板">
                <input type="text" id="cmdkInput" placeholder="输入命令或搜索内容，↑↓ 选择，Enter 执行，Esc 关闭..." autocomplete="off">
                <ul id="cmdkList" role="listbox"></ul>
            </div>
        </div>
        <div class="empty-state" id="emptyState" style="display: none;">
            <p>没有找到匹配的内容</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
