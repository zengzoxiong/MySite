<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汉诺塔 - 拾光集</title>
  <meta name="description" content="拾光集在线小游戏：汉诺塔，3~8 层盘子三柱搬运，大盘不压小盘，步数与理论最优 2^n-1 对比，纯本地运行，无需联网。">
  <link rel="icon" href="../../favicon.svg">
  <link rel="canonical" href="https://zengzoxiong.github.io/MySite/tools/hanoi/app.html">
  <link rel="stylesheet" href="../../assets/game-ui.css">
  <style>
    /* ===== 汉诺塔 · 游戏私有视觉（组件语言统一到 assets/game-ui.css） ===== */
    :root { --game-accent: #AF52DE; }   /* 本游戏个性色：紫 · 彩色圆盘 */

    /* 内容列沿用 600px：让 560px 棋盘保持原有观感，不被缺省 520px 收窄 */
    .g-wrap { --wrap-max: 600px; }

    /* 控件行：层数分段选择 + 重开（私有排布，外观由 g-* 组件承担） */
    .ctrl { display: flex; align-items: center; gap: 10px; }
    .ctrl .g-segment { flex: 1; min-width: 0; }

    /* ===== 棋盘（个性视觉保留）：三柱各占 1/3，盘用百分比定位，天然响应式 ===== */
    .board {
      --dh: 30px;   /* 盘高，由 JS 随层数与棋盘高度自适应 */
      position: relative;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      aspect-ratio: 1.55;
      background: #ede8f8;
      border-radius: 14px;
      overflow: hidden;
    }
    .peg { position: absolute; top: 0; bottom: 0; width: 33.333%; cursor: pointer; }
    .rod {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 20px;
      width: 10px;
      border-radius: 5px 5px 0 0;
      background: #cbc2e6;
      transition: background .15s;
    }
    .peg:hover .rod { background: #b3a4e0; }
    .base {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 86%;
      height: 20px;
      border-radius: 7px;
      background: #ddd7f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .base .tag { font-size: 10px; font-weight: 600; color: #7a6cc0; letter-spacing: 3px; }
    .base.target { background: var(--game-accent); }
    .base.target .tag { color: var(--game-on-accent); }

    /* 盘：left/width 用百分比、bottom 用 px，位置由 JS 按柱号与堆叠层计算 */
    .disc {
      position: absolute;
      height: var(--dh);
      border-radius: calc(var(--dh) / 2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .25);
      box-shadow: 0 2px 6px rgba(80, 60, 140, .25);
      pointer-events: none;   /* 点击穿透到柱子 */
      z-index: 1;
      transition: left .15s ease-in-out, bottom .15s ease-in-out;
    }
    .disc.no-anim { transition: none !important; }   /* resize 重摆时关过渡，防盘乱飞 */
    .disc.sel {
      outline: 3px solid #3b2a86;
      outline-offset: -3px;
      filter: brightness(.94);
      box-shadow: 0 6px 14px rgba(60, 40, 130, .4);
      transform: translateY(-4px);
    }
    .disc.deny { animation: shake .32s ease; }   /* 非法操作抖动提示 */
    @keyframes shake {
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    /* 通关弹层：圆角随棋盘；私有 z-index 30 压住移动中置顶的盘（z-index 20） */
    .board .g-overlay {
      border-radius: inherit;
      z-index: 30;
    }

    /* 纪录行：结算层里的新纪录 / 历史最佳（游戏私有展示状态） */
    .ov-record { margin: 0; color: var(--orange); font-size: 13px; font-weight: 700; }

    /* 步数超过理论最少时标红提醒（游戏私有状态，JS 里的类名字符串不动） */
    .g-stat-value.over { color: var(--red); }

    /* 提示行：限宽居中并预留一行高度，文案变化时布局不跳 */
    .hint {
      max-width: 560px;
      margin: 2px auto 0;
      min-height: 20px;
    }

    /* 深色模式：棋盘中性色转夜色，圆盘与几何玩法视觉不变 */
    @media (prefers-color-scheme: dark) {
      .board { background: #221c33; }
      .rod { background: #4b4166; }
      .peg:hover .rod { background: #5d5179; }
      .base { background: #2f2745; }
      .base .tag { color: #a99fd0; }
    }

    /* 移动端：六个层数档挤进一行（游戏特有微调） */
    @media (max-width: 560px) {
      .ctrl .g-segment button { padding-left: 6px; padding-right: 6px; font-size: 12px; }
    }
  </style>
</head>
<body class="g-page">
    <a class="g-back-chip" href="../../index.html" aria-label="返回拾光集主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>返回主页</a>

  <main class="g-wrap">
    <nav class="g-nav"><h1 class="g-nav-title">汉诺塔</h1></nav>
    <h1 class="g-nav-large">汉诺塔</h1>
    <p class="g-nav-sub">把起点柱的盘子全部搬到目标柱，大盘不能压小盘</p>

    <section class="g-hud">
      <div class="g-stat" id="movesStat"><span class="g-stat-label">步数</span><span class="g-stat-value g-num" id="moves">0</span></div>
      <div class="g-stat"><span class="g-stat-label">理论最少</span><span class="g-stat-value g-num" id="minMoves">15</span></div>
      <div class="g-stat"><span class="g-stat-label">本层最佳</span><span class="g-stat-value g-num" id="best">—</span></div>
    </section>

    <section class="ctrl">
      <div class="g-segment" id="seg" role="group" aria-label="选择盘子层数">
        <button type="button" data-n="3">3 层</button>
        <button type="button" data-n="4" class="on">4 层</button>
        <button type="button" data-n="5">5 层</button>
        <button type="button" data-n="6">6 层</button>
        <button type="button" data-n="7">7 层</button>
        <button type="button" data-n="8">8 层</button>
      </div>
      <button class="g-btn g-btn-gray" id="newBtn" type="button">重开</button>
    </section>

    <div class="g-stage">
      <div class="board" id="board">
        <div class="peg" data-i="0" aria-label="起点柱">
          <div class="rod"></div>
          <div class="base"><span class="tag">起点</span></div>
        </div>
        <div class="peg" data-i="1" aria-label="中转柱">
          <div class="rod"></div>
          <div class="base"><span class="tag">中转</span></div>
        </div>
        <div class="peg" data-i="2" aria-label="目标柱">
          <div class="rod"></div>
          <div class="base target"><span class="tag">目标</span></div>
        </div>
        <div class="g-overlay g-overlay-fade g-overlay-win" id="overlay" hidden>
          <p class="g-overlay-title" id="ovTitle">通关！</p>
          <p class="g-overlay-text" id="ovSub"></p>
          <p class="ov-record" id="ovRecord" hidden></p>
          <button class="g-alert-btn default" id="ovRestart" type="button">再来一局</button>
        </div>
      </div>
    </div>

    <p class="g-tips hint" id="hint"></p>
    <footer class="g-foot">拾光集 · 在线小游戏</footer>
  </main>

  <script>
  (() => {
  'use strict';
  /* ================= 汉诺塔主逻辑（零依赖，纯本地运行） ================= */

  // ---------- 常量 ----------
  const BASE_H = 20;      // 底座高度（px），盘子从底座上方开始堆叠
  const MIN_W = 11;       // 最小盘宽度（相对棋盘宽的百分比）
  const MAX_W = 28;       // 最大盘宽度
  const ANIM_MS = 150;    // 移动动画每段时长（提起 / 平移 / 落下各一段）
  const $ = id => document.getElementById(id);

  // ---------- DOM ----------
  const board = $('board');
  const movesEl = $('moves'), minEl = $('minMoves'), bestEl = $('best');
  const movesStat = $('movesStat');
  const hintEl = $('hint');
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovSub = $('ovSub'), ovRecord = $('ovRecord');
  const seg = $('seg');

  // ---------- 状态 ----------
  let n = 4;                // 当前层数（3~8）
  let pegs = [[], [], []];  // 三根柱的盘子栈：数字即盘号，越小盘越小，末位是柱顶
  let discs = {};           // 盘号 -> 对应 DOM 元素
  let moves = 0;            // 实际步数
  let sel = -1;             // 已拿起盘所在柱号，-1 表示未选中
  let lock = false;         // 移动动画期间锁输入
  let won = false;          // 本局是否已通关
  let dh = 30;              // 当前盘高（px），随层数与棋盘高度自适应
  let epoch = 0;            // 局代号：重开或换层后，旧动画回调直接作废

  // ---------- 工具 ----------
  const minMovesOf = k => (1 << k) - 1;   // 理论最少步数 2^n - 1（n ≤ 8，位运算安全）
  const topOf = i => pegs[i].length ? pegs[i][pegs[i].length - 1] : undefined;
  const bestKey = k => 'hanoiBest' + k;   // 每个层数独立记录最佳（最少）完成步数
  function loadBest(k) {
    try { return parseInt(localStorage.getItem(bestKey(k)), 10) || 0; }
    catch (e) { return 0; }               // 隐私模式下读取失败按无纪录处理
  }
  function saveBest(k, v) {
    try { localStorage.setItem(bestKey(k), String(v)); }
    catch (e) { /* 写入失败时静默忽略 */ }
  }

  // ---------- 几何：left/width 用百分比、bottom 用 px，天然响应式 ----------
  const pegCenter = i => (i * 2 + 1) / 6 * 100;   // 三柱中心：16.7% / 50% / 83.3%
  function discWidth(size) {                      // 盘宽随盘号线性插值
    return n === 1 ? MAX_W : MIN_W + (MAX_W - MIN_W) * (size - 1) / (n - 1);
  }
  function setLeft(el, peg, size) {
    const w = discWidth(size);
    el.style.left = (pegCenter(peg) - w / 2) + '%';
    el.style.width = w + '%';
  }
  function setBottom(el, level) {                 // level 0 为最底层
    el.style.bottom = (BASE_H + level * dh) + 'px';
  }
  function setBottomPx(el, px) {                  // 按像素直设 bottom，动画提起段用，不再按层号换算
    el.style.bottom = px + 'px';
  }
  function findPeg(size) {
    for (let i = 0; i < 3; i++) if (pegs[i].indexOf(size) !== -1) return i;
    return -1;
  }

  // ---------- 布局：按棋盘实际高度算盘高，重摆全部盘与柱杆 ----------
  function layout() {
    const bh = board.clientHeight;
    dh = Math.max(16, Math.min(34, (bh - BASE_H - 30) / (n + 1.2)));
    board.style.setProperty('--dh', dh.toFixed(2) + 'px');
    // 三柱水平就位：absolute 定位的水平偏移不会自动排开，必须显式指定 left
    board.querySelectorAll('.peg').forEach((peg, i) => { peg.style.left = (i * 100 / 3) + '%'; });
    board.querySelectorAll('.rod').forEach(rod => { rod.style.height = (n * dh + 26) + 'px'; });
    // 重摆所有盘：先关过渡再定位，避免窗口缩放时盘子飞舞
    for (const key of Object.keys(discs)) {
      const size = +key, el = discs[key], p = findPeg(size);
      el.classList.add('no-anim');
      setLeft(el, p, size);
      setBottom(el, pegs[p].indexOf(size));
      el.style.fontSize = Math.max(10, dh * 0.5) + 'px';
    }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      for (const el of Object.values(discs)) el.classList.remove('no-anim');
    }));
  }

  // ---------- 开局 ----------
  function newGame() {
    epoch++;
    for (const key of Object.keys(discs)) discs[key].remove();
    discs = {};
    pegs = [[], [], []];
    moves = 0; sel = -1; lock = false; won = false;
    hideOverlay();
    // 从最大盘到最小盘依次压入起点柱（盘号越大盘越大，放最底）
    for (let s = n; s >= 1; s--) {
      const el = document.createElement('div');
      el.className = 'disc';
      el.textContent = s;
      board.appendChild(el);
      discs[s] = el;
      pegs[0].push(s);
    }
    layout();
    updateHud();
    hintEl.textContent = '点击柱子拿起顶盘，再点目标柱放下；键盘 1 / 2 / 3 同样有效';
  }

  // ---------- HUD ----------
  function updateHud() {
    movesEl.textContent = moves;
    minEl.textContent = minMovesOf(n);
    const b = loadBest(n);
    bestEl.textContent = b ? b : '—';
    movesEl.classList.toggle('over', moves > minMovesOf(n));   // 超出理论最少就标红
  }
  function bumpMoves() {   // 步数跳动反馈：先移除类再强制回流，重启动画
    movesStat.classList.remove('g-bump');
    void movesStat.offsetWidth;
    movesStat.classList.add('g-bump');
  }

  // ---------- 交互：拿起 / 放下 ----------
  function handlePeg(i) {
    if (lock || won) return;
    if (sel === -1) {                        // 第一次点击：拿起该柱顶盘
      const t = topOf(i);
      if (t === undefined) { flashDeny(i); return; }   // 空柱无盘可拿
      sel = i;
      discs[t].classList.add('sel');
      hintEl.textContent = '已拿起 ' + t + ' 号盘：点目标柱放下，再点本柱取消（Esc 同效）';
      return;
    }
    if (sel === i) {                         // 点回原柱：放回并取消选中
      discs[topOf(i)].classList.remove('sel');
      sel = -1;
      hintEl.textContent = '已放回原柱，重新选择';
      return;
    }
    const size = topOf(sel);
    const target = topOf(i);
    if (target !== undefined && target < size) {   // 大盘压小盘：拒绝
      flashDeny(i);
      hintEl.textContent = target + ' 号盘在上面，' + size + ' 号盘压不下去，换根柱子试试';
      return;
    }
    // 合法移动：先更新数据，再播放 提起 → 平移 → 落下 三段动画
    const el = discs[size];
    el.classList.remove('sel');
    const from = sel;                // 记下起点柱（提起高度要用）
    pegs[from].pop();
    const toLevel = pegs[i].length;  // 目标柱现有盘数 = 落点层号
    pegs[i].push(size);
    sel = -1;
    lock = true;
    moves++;
    updateHud();
    bumpMoves();
    const ep = epoch;
    animateMove(el, size, from, i, toLevel).then(() => {
      if (ep !== epoch) return;      // 中途重开或换层，本局回调作废
      lock = false;
      hintEl.textContent = '点击柱子拿起顶盘，再点目标柱放下；键盘 1 / 2 / 3 同样有效';
      checkWin();
    });
  }

  // ---------- 移动动画：提起 → 平移 → 落下，定时器推进不依赖 transitionend ----------
  function animateMove(el, size, from, to, toLevel) {
    return new Promise(resolve => {
      const ep = epoch;
      const wait = ANIM_MS + 20;   // 动画时长加余量，reduced-motion 下也能按时序走完
      el.style.zIndex = 20;        // 移动中的盘置顶，横穿其他塔时不被遮挡
      // 第一段：提起，高过原柱塔顶（像素直设；setBottom 是层号换算，混用会把盘顶飞出棋盘）
      setBottomPx(el, BASE_H + pegs[from].length * dh + 14);
      setTimeout(() => {
        if (ep !== epoch) { resolve(); return; }
        // 第二段：平移到目标柱正上方
        setLeft(el, to, size);
        setTimeout(() => {
          if (ep !== epoch) { resolve(); return; }
          // 第三段：落到目标柱的堆叠位
          setBottom(el, toLevel);
          setTimeout(() => {
            if (ep === epoch) el.style.zIndex = 1;
            resolve();
          }, wait);
        }, wait);
      }, wait);
    });
  }

  // ---------- 非法操作：抖一下目标柱顶盘提示 ----------
  function flashDeny(i) {
    const t = topOf(i);
    if (t === undefined) return;
    const el = discs[t];
    el.classList.remove('deny');
    void el.offsetWidth;
    el.classList.add('deny');
    setTimeout(() => el.classList.remove('deny'), 360);
  }

  // ---------- 通关判定与结算 ----------
  function checkWin() {
    if (pegs[2].length !== n) return;
    won = true;
    const mn = minMovesOf(n);
    const prev = loadBest(n);
    const isNew = !prev || moves < prev;
    if (isNew) saveBest(n, moves);
    ovTitle.textContent = moves === mn ? '完美通关！' : '通关！';
    ovSub.textContent = n + ' 层用了 ' + moves + ' 步 · 理论最少 ' + mn + ' 步'
      + (moves === mn ? '，一步不差' : '，多走 ' + (moves - mn) + ' 步（效率 ' + Math.round(mn / moves * 100) + '%）');
    ovRecord.textContent = isNew ? '新纪录！' + n + ' 层最佳 ' + moves + ' 步'
      : n + ' 层历史最佳 ' + prev + ' 步';
    ovRecord.hidden = false;
    updateHud();
    showOverlay();
  }

  // ---------- 弹层显隐（同步强制回流后再加 open，保证过渡生效） ----------
  function showOverlay() {
    overlay.hidden = false;
    void overlay.offsetWidth;
    overlay.classList.add('open');
  }
  function hideOverlay() {
    overlay.classList.remove('open');
    overlay.hidden = true;
  }

  // ---------- 输入：点击三柱 ----------
  document.querySelectorAll('.peg').forEach(peg => {
    peg.addEventListener('click', () => handlePeg(+peg.dataset.i));
  });

  // ---------- 输入：键盘（忽略组合键，方向无关不用防滚动） ----------
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const PEG_KEYS = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
    if (e.code in PEG_KEYS) {
      e.preventDefault();
      handlePeg(PEG_KEYS[e.code]);
    } else if (e.code === 'Escape' && sel !== -1) {
      discs[topOf(sel)].classList.remove('sel');
      sel = -1;
      hintEl.textContent = '已放回原柱，重新选择';
    } else if (e.code === 'KeyR') {
      newGame();
    }
  });

  // ---------- 层数切换与按钮 ----------
  seg.addEventListener('click', e => {
    const btn = e.target.closest('button[data-n]');
    if (!btn) return;
    const k = +btn.dataset.n;
    if (k === n) return;
    n = k;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
    newGame();
  });
  $('newBtn').addEventListener('click', newGame);
  $('ovRestart').addEventListener('click', newGame);

  // ---------- 响应式：窗口变化时重算盘高并重摆 ----------
  window.addEventListener('resize', layout);

  // ---------- 启动 ----------
  newGame();
  })();
  </script>
  <aside class="g-rules" id="rulesPanel" role="complementary" aria-label="游戏规则">
    <div class="g-rules-scroll">
    <h2>游戏规则</h2>

      <h3>玩法</h3>
      <ul>
        <li>目标：把起点柱的全部盘子搬到最右边的目标柱</li>
        <li>每次只能移动一根柱子最顶端的盘，大盘不能压在小盘上</li>
        <li>步数越接近理论最少 2<sup>n</sup>-1（n 为层数）越好，正好达成即完美通关</li>
      </ul>
      <h3>操作</h3>
      <ul>
        <li>点击柱子或按 1 / 2 / 3：拿起顶盘、放下</li>
        <li>再点原柱或按 Esc：放回取消</li>
        <li>R：重开本局；上方 3~8 按钮切换层数</li>
      </ul>
    </div>
    <button class="g-rules-handle" id="rulesHandle" type="button">玩法</button>
  </aside>
  <script>
  (function () {
    var panel = document.getElementById('rulesPanel');
    var handle = document.getElementById('rulesHandle');
    var saved = null;
    try { saved = localStorage.getItem('gameRulesOpen'); } catch (e) { }
    var open = saved === null ? window.innerWidth >= 1100 : saved === '1';
    function apply() {
      panel.classList.toggle('closed', !open);
      handle.textContent = open ? '收起' : '玩法';
      handle.setAttribute('aria-label', open ? '收起游戏规则' : '展开游戏规则');
      document.body.classList.toggle('rules-open', open && window.innerWidth >= 1100);
    }
    handle.addEventListener('click', function () {
      open = !open;
      try { localStorage.setItem('gameRulesOpen', open ? '1' : '0'); } catch (e) { }
      apply();
    });
    window.addEventListener('resize', apply);
    apply();
  })();
  </script>
</body>
</html>
