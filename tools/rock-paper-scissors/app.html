<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="../../favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石头剪刀布 - 拾光集</title>
    <link rel="canonical" href="https://zengzoxiong.github.io/MySite/tools/rock-paper-scissors/app.html">
    <!-- 共享 UI 设计系统（Apple HIG），相对路径自 tools/rock-paper-scissors/ 出发 -->
    <link rel="stylesheet" href="../../assets/game-ui.css">
    <style>
        /* 游戏个性色：紫（保留原紫调） */
        :root {
            --game-accent: #AF52DE;
        }

        /* ---------- 游戏私有视觉：猜拳战场与手势元素（保留个性，外观统一走共享令牌） ---------- */

        .battle-ground {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 28px 0;
            min-height: 180px;
        }

        .player-choice, .computer-choice {
            text-align: center;
            flex: 1;
        }

        .choice-display {
            font-size: 80px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounce 0.5s ease-out;
        }

        @keyframes bounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .shaking {
            animation: shake 0.3s ease-in-out infinite;
        }

        .vs {
            font-size: 32px;
            font-weight: 700;
            color: var(--game-accent);
            padding: 0 12px;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 24px 0;
        }

        /* 手势键：游戏个性元素（大 emoji 键帽），交互语言对齐 g-btn（按压缩放 / 焦点圈 / 禁用态） */
        .choice-btn {
            appearance: none;
            -webkit-appearance: none;
            width: 100px;
            height: 100px;
            margin: 0;
            padding: 0;
            border: 2px solid var(--separator);
            background: var(--card);
            border-radius: var(--radius-lg);
            font-family: inherit;
            font-size: 48px;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--dur-press) var(--ease-spring),
                        border-color var(--dur-press) var(--ease-out),
                        background-color var(--dur-press) var(--ease-out),
                        box-shadow var(--dur-press) var(--ease-out),
                        opacity var(--dur-press) var(--ease-out);
        }

        .choice-btn:hover {
            border-color: var(--game-accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-float);
        }

        .choice-btn:active:not(:disabled) {
            transform: scale(.96);
            opacity: .85;
        }

        .choice-btn:focus-visible {
            outline: 2px solid var(--game-accent);
            outline-offset: 2px;
        }

        .choice-btn:disabled {
            opacity: .35;
            cursor: default;
        }

        .choice-btn.selected {
            border-color: var(--game-accent);
            background: var(--fill);
            background: color-mix(in srgb, var(--game-accent) 16%, transparent);
        }

        /* 单手结果横幅（回合内联提示）：语义色沿用徽标系令牌，深浅色自适应 */
        .result-message {
            text-align: center;
            padding: 14px 16px;
            border-radius: var(--radius);
            font-size: 20px;
            font-weight: 700;
            margin: 16px 0;
            display: none;
        }

        .result-message.show {
            display: block;
            animation: g-pop var(--dur-spring) var(--ease-spring);
        }

        .result-message.win {
            background: rgba(52, 199, 89, .16);
            background: color-mix(in srgb, var(--green) 16%, transparent);
            color: var(--green);
        }

        .result-message.lose {
            background: rgba(255, 59, 48, .16);
            background: color-mix(in srgb, var(--red) 16%, transparent);
            color: var(--red);
        }

        .result-message.draw {
            background: rgba(255, 149, 0, .16);
            background: color-mix(in srgb, var(--orange) 16%, transparent);
            color: var(--orange);
        }

        /* 按钮行：共享 .g-btn-row 之上补充卡片内留白与居中 */
        .btn-row {
            margin: 20px 0 0;
            justify-content: center;
        }

        /* 对战记录：卡片内嵌的浅色分组块 */
        .history {
            margin-top: 20px;
            padding: 14px 16px;
            background: var(--fill-secondary);
            border-radius: var(--radius);
        }

        .history-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .history-item {
            padding: 5px 10px;
            background: var(--card);
            border-radius: var(--radius-sm);
            font-size: 13px;
        }

        .history-item.win { color: var(--green); }
        .history-item.lose { color: var(--red); }
        .history-item.draw { color: var(--orange); }

        /* 右上角「说明」浮钮：复用 g-back-chip 外观，仅改定位 */
        .tool-doc-link {
            left: auto;
            right: 12px;
        }

        /* 窄屏：手势键与战场留出安全间距 */
        @media (max-width: 420px) {
            .choices { gap: 12px; }
            .choice-btn {
                width: 84px;
                height: 84px;
                font-size: 40px;
            }
            .battle-ground {
                margin: 20px 0;
                min-height: 150px;
            }
            .choice-display {
                font-size: 64px;
                height: 96px;
            }
            .tool-doc-link { right: 8px; }
        }
    </style>
</head>
<body class="g-page">
    <a class="g-back-chip" href="../../index.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>返回主页</a>
    <a class="g-back-chip tool-doc-link" href="index.html">说明</a>
    <main class="g-wrap">
        <nav class="g-nav"><h1 class="g-nav-title">石头剪刀布</h1></nav>
        <h1 class="g-nav-large">✌️ 石头剪刀布</h1>
        <p class="g-nav-sub">经典猜拳游戏，看看谁更厉害</p>

        <div class="g-hud">
            <div class="g-stat">
                <span class="g-stat-label">玩家</span>
                <span class="g-stat-value g-num" id="playerScore">0</span>
            </div>
            <div class="g-stat">
                <span class="g-stat-label">平局</span>
                <span class="g-stat-value g-num" id="drawScore">0</span>
            </div>
            <div class="g-stat">
                <span class="g-stat-label">电脑</span>
                <span class="g-stat-value g-num" id="computerScore">0</span>
            </div>
        </div>
        <span class="g-ai-note">AI 代玩成绩不计最高分</span>

        <div class="g-card">
            <div class="battle-ground">
                <div class="player-choice">
                    <div class="choice-display" id="playerDisplay">❓</div>
                    <p class="g-tips">你</p>
                </div>
                <div class="vs">VS</div>
                <div class="computer-choice">
                    <div class="choice-display" id="computerDisplay">❓</div>
                    <p class="g-tips">电脑</p>
                </div>
            </div>

            <div class="result-message" id="resultMessage"></div>

            <div class="choices">
                <button class="choice-btn" data-choice="rock" title="石头">✊</button>
                <button class="choice-btn" data-choice="scissors" title="剪刀">✌️</button>
                <button class="choice-btn" data-choice="paper" title="布">✋</button>
            </div>

            <div class="g-btn-row btn-row">
                <div class="g-ai-group">
                    <button class="g-btn g-ai-btn" id="aiBtn" aria-pressed="false">AI 代玩</button>
                    <span class="g-ai-tag" id="aiTag" hidden>AI 代玩中 · 点击停止</span>
                </div>
                <button class="g-btn g-btn-gray" id="resetBtn">重新开始</button>
            </div>

            <div class="history" id="history" style="display: none;">
                <h3 class="g-card-title">对战记录</h3>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>

        <footer class="g-foot">拾光集 · 在线小游戏</footer>
    </main>

    <script>
        const choices = {
            rock: { emoji: '✊', name: '石头' },
            scissors: { emoji: '✌️', name: '剪刀' },
            paper: { emoji: '✋', name: '布' }
        };

        /* ================= 纯函数核心（与渲染无关，与 ai-sim.mjs 保持一致） ================= */
        const CHOICE_KEYS = ['rock', 'scissors', 'paper'];
        const winRules = {
            rock: 'scissors',
            scissors: 'paper',
            paper: 'rock'
        };

        // 判定单手胜负：win 玩家胜 / lose 玩家负 / draw 平局
        function judgeRound(player, computer) {
            if (player === computer) return 'draw';
            return winRules[player] === computer ? 'win' : 'lose';
        }

        // 新建对局状态
        function createState() {
            return { playerScore: 0, computerScore: 0, drawScore: 0, rounds: [] };
        }

        // 单步推进：记录一手对战并累计比分，返回本手结果
        function applyRound(state, player, computer) {
            const result = judgeRound(player, computer);
            if (result === 'win') state.playerScore++;
            else if (result === 'lose') state.computerScore++;
            else state.drawScore++;
            state.rounds.push({ player: player, computer: computer, result: result });
            return result;
        }

        // 重置对局状态
        function resetState(state) {
            state.playerScore = 0;
            state.computerScore = 0;
            state.drawScore = 0;
            state.rounds = [];
        }

        // 均匀随机出招（rng 为 [0,1) 随机源）；电脑出招即用此函数
        function randomChoice(rng) {
            return CHOICE_KEYS[Math.floor(rng() * CHOICE_KEYS.length)];
        }

        /* ================= AI 决策（与渲染无关，与 ai-sim.mjs 保持一致） =================
         * 六种对手模式在线比拼预测准确率，取胜率最高的模式并出其最优响应；
         * 各模式都预测不准（对手近似随机）时随机出招 */
        const AI_CFG = {
            decay: 0.97,  // 预测得分的历史衰减，越近的对战越重要
            minRounds: 1, // 少于此手数不做预测，随机出招
            gate: 0.42    // 最佳模式的预测准确率下限，低于则判定对手无规律、随机出招
        };

        // 克制 move 的出招（beaterOf('rock') === 'paper'）
        function beaterOf(move) {
            for (const k of CHOICE_KEYS) if (winRules[k] === move) return k;
            return CHOICE_KEYS[0];
        }

        // 被 move 克制的出招（loserOf('rock') === 'scissors'）
        function loserOf(move) {
            return winRules[move];
        }

        // AI 决策：六种对手模式在线比拼预测准确率，取胜率最高的模式并出其最优响应。
        // 模式：维持（重复自己上一手）/ 左旋（接自己上一手的败手）/ 右旋（接自己上一手的胜手）
        //      / 反制（克制我方上一手）/ 镜像（模仿我方上一手）/ 频率（边际众数）；
        // 各模式都预测不准（对手近似随机）时随机出招。
        function aiChoose(rounds, rng) {
            const n = rounds.length;
            if (n < AI_CFG.minRounds) return randomChoice(rng);

            // 各模式对「对手下一手」的衰减预测正确量；freq 同时是衰减边际频率
            const scores = { stay: 0, rotL: 0, rotW: 0, beatM: 0, mirror: 0, freq: 0 };
            const freq = { rock: 0, scissors: 0, paper: 0 };
            let total = 0;
            for (let i = 0; i < n; i++) {
                if (i > 0) {
                    // 用 0..i-1 的历史给第 i 手打分，越近的对战权重越高
                    const w = Math.pow(AI_CFG.decay, n - 1 - i);
                    total += w;
                    const oppPrev = rounds[i - 1].computer;
                    const myPrev = rounds[i - 1].player;
                    const actual = rounds[i].computer;
                    if (actual === oppPrev) scores.stay += w;
                    if (actual === loserOf(oppPrev)) scores.rotL += w;
                    if (actual === beaterOf(oppPrev)) scores.rotW += w;
                    if (actual === beaterOf(myPrev)) scores.beatM += w;
                    if (actual === myPrev) scores.mirror += w;
                    let mode = CHOICE_KEYS[0];
                    for (const k of CHOICE_KEYS) if (freq[k] > freq[mode]) mode = k;
                    if (actual === mode) scores.freq += w;
                }
                // 衰减推进边际频率，保证 freq 始终是「第 i 手之前」的加权频率
                for (const k of CHOICE_KEYS) freq[k] *= AI_CFG.decay;
                freq[rounds[i].computer] += 1;
            }

            const last = rounds[n - 1];
            let freqMode = CHOICE_KEYS[0];
            for (const k of CHOICE_KEYS) if (freq[k] > freq[freqMode]) freqMode = k;
            // 各模式对「对手下一手」的预测
            const preds = {
                stay: last.computer,
                rotL: loserOf(last.computer),
                rotW: beaterOf(last.computer),
                beatM: beaterOf(last.player),
                mirror: last.player,
                freq: freqMode
            };

            let best = 'stay';
            for (const k of Object.keys(scores)) if (scores[k] > scores[best]) best = k;
            // 各模式准确率都不如随机 ⇒ 对手无规律，随机出招
            if (total > 0 && scores[best] / total < AI_CFG.gate) return randomChoice(rng);
            return beaterOf(preds[best]);
        }

        /* ================= 渲染层（DOM 操作） ================= */
        let state = createState();
        let roundBusy = false;   // 是否有对战动画进行中
        let aiOn = false;        // AI 代玩开关
        let aiTimer = null;      // AI 续局定时器

        const playerDisplay = document.getElementById('playerDisplay');
        const computerDisplay = document.getElementById('computerDisplay');
        const resultMessage = document.getElementById('resultMessage');
        const playerScoreEl = document.getElementById('playerScore');
        const computerScoreEl = document.getElementById('computerScore');
        const drawScoreEl = document.getElementById('drawScore');
        const resetBtn = document.getElementById('resetBtn');
        const aiBtn = document.getElementById('aiBtn');
        const aiTag = document.getElementById('aiTag');
        const choiceBtns = document.querySelectorAll('.choice-btn');
        const historyEl = document.getElementById('history');
        const historyList = document.getElementById('historyList');

        function renderScores() {
            playerScoreEl.textContent = state.playerScore;
            computerScoreEl.textContent = state.computerScore;
            drawScoreEl.textContent = state.drawScore;
        }

        function play(playerChoice) {
            if (roundBusy) return;
            roundBusy = true;

            // 清除之前的结果
            resultMessage.classList.remove('show');

            // 摇晃动画
            playerDisplay.classList.add('shaking');
            computerDisplay.classList.add('shaking');
            playerDisplay.textContent = '✊';
            computerDisplay.textContent = '✊';

            // 禁用按钮
            choiceBtns.forEach(btn => btn.disabled = true);

            setTimeout(() => {
                const computerChoice = randomChoice(Math.random);
                const result = applyRound(state, playerChoice, computerChoice);

                // 停止摇晃
                playerDisplay.classList.remove('shaking');
                computerDisplay.classList.remove('shaking');

                // 显示选择
                playerDisplay.textContent = choices[playerChoice].emoji;
                computerDisplay.textContent = choices[computerChoice].emoji;

                // 更新结果提示
                if (result === 'win') {
                    resultMessage.textContent = '🎉 你赢了！';
                    resultMessage.className = 'result-message win show';
                } else if (result === 'lose') {
                    resultMessage.textContent = '😢 你输了！';
                    resultMessage.className = 'result-message lose show';
                } else {
                    resultMessage.textContent = '🤝 平局！';
                    resultMessage.className = 'result-message draw show';
                }

                renderScores();
                updateHistory();

                // 恢复按钮；AI 代玩中则自动续局
                roundBusy = false;
                if (!aiOn) choiceBtns.forEach(btn => btn.disabled = false);
                if (aiOn) scheduleAiRound();
            }, 1000);
        }

        function updateHistory() {
            const recent = state.rounds.slice(-10).reverse();
            if (recent.length === 0) {
                historyEl.style.display = 'none';
                return;
            }

            historyEl.style.display = 'block';
            historyList.innerHTML = recent.map(item => {
                const resultText = item.result === 'win' ? '胜' : item.result === 'lose' ? '负' : '平';
                return `<span class="history-item ${item.result}">${choices[item.player].emoji} vs ${choices[item.computer].emoji} = ${resultText}</span>`;
            }).join('');
        }

        function reset() {
            resetState(state);
            renderScores();

            playerDisplay.textContent = '❓';
            computerDisplay.textContent = '❓';
            resultMessage.classList.remove('show');
            updateHistory();
            if (aiOn) scheduleAiRound();
        }

        /* ================= AI 代玩控制 ================= */
        function scheduleAiRound() {
            if (!aiOn || aiTimer !== null || roundBusy) return;
            aiTimer = setTimeout(() => {
                aiTimer = null;
                if (aiOn && !roundBusy) play(aiChoose(state.rounds, Math.random));
            }, 650);
        }

        function setAi(on) {
            aiOn = on;
            aiBtn.textContent = aiOn ? '停止代玩' : 'AI 代玩';
            aiBtn.classList.toggle('is-running', aiOn);
            aiBtn.setAttribute('aria-pressed', String(aiOn));
            aiTag.hidden = !aiOn;
            choiceBtns.forEach(btn => btn.disabled = aiOn || roundBusy);
            if (aiOn) {
                scheduleAiRound();
            } else if (aiTimer !== null) {
                clearTimeout(aiTimer);
                aiTimer = null;
            }
        }

        choiceBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (aiOn) return;
                play(btn.dataset.choice);
            });
        });

        resetBtn.addEventListener('click', reset);
        aiBtn.addEventListener('click', () => setAi(!aiOn));
    </script>
</body>
</html>
