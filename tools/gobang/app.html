/* ===== 五子棋 · 游戏私有视觉与私有状态修饰类 =====
   外围组件（导航标题栏 / 计分 / 按钮 / 规则栏 / 返回钮）统一使用
   assets/game-ui.css 的 g-* 组件类；本块只保留棋盘个性视觉
   （木质棋盘底、黑白棋子圆点）与少量私有布局微调。 */
:root {
  /* 个性色：灰 #8E8E93（黑白棋）。灰个性色页必须修正对比度（设计规范 §7.1） */
  --game-accent: #8E8E93;
  --game-on-accent: #1C1C1E;      /* 实心按钮深色字：对 #8E8E93 5.22:1 */
  --game-accent-text: #5C5C60;    /* 强调色作文字：对 #F2F2F7 5.97:1 */
}
@media (prefers-color-scheme: dark) {
  :root {
    /* 深色复位：黑底上实心字转白，强调文字直接用个性色 */
    --game-on-accent: #FFFFFF;
    --game-accent-text: var(--game-accent);
  }
}

/* 棋盘画布：木纹底与描边为游戏私有视觉，深浅色模式均保留 */
canvas {
  background: #e9c98f;
  box-shadow: inset 0 0 0 1px rgba(120, 80, 30, .18);
  touch-action: manipulation;   /* 保留原触控意图：点按落子，不锁页面滚动 */
}

/* 状态行：当前行棋方石色圆点 + 文案（黑白石面为游戏私有视觉） */
.status {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 20px;
  color: var(--text-secondary);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.status .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex: none;
  border: 1px solid var(--separator);
}
.status .dot.black { background: radial-gradient(circle at 35% 30%, #6b6b6b, #111); }
.status .dot.white { background: radial-gradient(circle at 35% 30%, #fff, #cfcfcf); }

/* 规则栏展开让位的过渡（让位宽度由 game-ui.css 的 .g-page.rules-open 提供） */
body { transition: padding-right .28s cubic-bezier(.22, .9, .3, 1); }

<script>
(() => {
'use strict';

// ================= 常量：15 路标准棋盘 =================
const N = 15;                                    // 棋盘路数
const SIZE = 520;                                // 画布逻辑尺寸（正方形）
const PAD = 26;                                  // 棋盘四边留白
const CELL = (SIZE - PAD * 2) / (N - 1);         // 相邻交叉点间距
const STARS = [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]];  // 星位（0 起下标）

const cv = document.getElementById('board');
const ctx = cv.getContext('2d');
const statusText = document.getElementById('statusText');
const turnDot = document.getElementById('turnDot');
const blackWinEl = document.getElementById('blackWin');
const whiteWinEl = document.getElementById('whiteWin');
const undoBtn = document.getElementById('undoBtn');
const restartBtn = document.getElementById('restartBtn');

// 高分屏适配：画布按 dpr 放大，坐标仍用逻辑尺寸
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = SIZE * dpr;
cv.height = SIZE * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

// ================= 计分存取（localStorage，带 slug 前缀） =================
let score = { black: 0, white: 0 };
try {
  const raw = localStorage.getItem('gobang-score');
  if (raw) {
    const obj = JSON.parse(raw);
    if (typeof obj.black === 'number') score.black = obj.black;
    if (typeof obj.white === 'number') score.white = obj.white;
  }
} catch (e) { /* 隐私模式等读取失败时用默认值 */ }
function saveScore() {
  try { localStorage.setItem('gobang-score', JSON.stringify(score)); } catch (e) {}
}
function updateHud() {
  blackWinEl.textContent = score.black;
  whiteWinEl.textContent = score.white;
}
updateHud();

// ================= 对局核心：纯函数（与渲染无关） =================
/* 游戏规则与 AI 决策全部收敛在 aiCoreGobang 工厂内：状态是纯数据棋盘，
   单步推进 step() 不触碰 DOM；同一份源码三处复用——页面主线程（落子/判定）、
   Web Worker（AI 决策，源码经 toString 注入）、ai-sim.mjs（按
   AI_CORE_BEGIN / AI_CORE_END 标记提取后跑批量模拟），天然保持一致。 */
/* ===== AI_CORE_BEGIN（ai-sim.mjs 依赖此标记提取同一份逻辑，两端必须同步修改）===== */
function aiCoreGobang() {
  'use strict';
  const N = 15;                 // 棋盘路数
  const FIVE = 10000000;        // 五连分值（胜利）
  const DEF = 1.15;             // 防守加权：对方的窗口威胁略放大
  // 长度 5 的窗口内含 i 颗同色子（且无对方子）时的分值；
  // 重叠窗口的多重计数天然区分活/眠形状（活三比眠三覆盖更多窗口）
  const W = [0, 2, 30, 300, 30000, FIVE];
  const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];

  function inBoard(x, y) { return x >= 0 && x < N && y >= 0 && y < N; }

  function createBoard() {
    return Array.from({ length: N }, () => new Array(N).fill(0));
  }
  function cloneBoard(b) {
    return b.map((r) => r.slice());
  }

  // 返回获胜的连续五子坐标（不足五子返回 null），起点终点在首尾便于画线
  function checkWin(b, x, y, p) {
    for (const [dx, dy] of DIRS) {
      const head = [{ x, y }], tail = [];
      let nx = x + dx, ny = y + dy;
      while (inBoard(nx, ny) && b[ny][nx] === p) {
        head.push({ x: nx, y: ny });
        nx += dx; ny += dy;
      }
      nx = x - dx; ny = y - dy;
      while (inBoard(nx, ny) && b[ny][nx] === p) {
        tail.push({ x: nx, y: ny });
        nx -= dx; ny -= dy;
      }
      const line = tail.reverse().concat(head);
      if (line.length >= 5) return line;
    }
    return null;
  }

  // 只判是否成五（搜索热路径用，省去坐标收集）
  function isFive(b, x, y, p) {
    for (const [dx, dy] of DIRS) {
      let n = 1;
      for (let s = 1; s < 5; s++) {
        const nx = x + dx * s, ny = y + dy * s;
        if (!inBoard(nx, ny) || b[ny][nx] !== p) break;
        n++;
      }
      for (let s = 1; s < 5; s++) {
        const nx = x - dx * s, ny = y - dy * s;
        if (!inBoard(nx, ny) || b[ny][nx] !== p) break;
        n++;
      }
      if (n >= 5) return true;
    }
    return false;
  }

  function isFull(b) {
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) if (!b[y][x]) return false;
    }
    return true;
  }

  // 单步推进（纯函数）：在 (x,y) 落 p 子，返回新棋盘与结果，不修改传入棋盘
  function step(b, x, y, p) {
    const nb = cloneBoard(b);
    nb[y][x] = p;
    const win = checkWin(nb, x, y, p);
    return { board: nb, win: win, full: !win && isFull(nb) };
  }

  /* ---------- 评估：长度 5 窗口计数（活三冲四启发） ---------- */
  const WINDOWS = [];                    // 全部长度 5 的直线窗口
  const WINDOWS_BY_CELL = new Array(N * N);  // 每个交叉点覆盖的窗口下标
  (function () {
    for (let i = 0; i < N * N; i++) WINDOWS_BY_CELL[i] = [];
    for (const [dx, dy] of DIRS) {
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          if (!inBoard(x + dx * 4, y + dy * 4)) continue;
          const cells = [];
          for (let k = 0; k < 5; k++) cells.push((y + dy * k) * N + (x + dx * k));
          const wi = WINDOWS.length;
          WINDOWS.push(cells);
          for (const id of cells) WINDOWS_BY_CELL[id].push(wi);
        }
      }
    }
  })();

  // 局面评估：p 的窗口总分减去对方（防守加权）的窗口总分
  function evaluate(b, p) {
    const q = 3 - p;
    let sc = 0;
    for (const cells of WINDOWS) {
      let mine = 0, opp = 0;
      for (const id of cells) {
        const v = b[(id / N) | 0][id % N];
        if (v === p) mine++;
        else if (v === q) opp++;
      }
      if (opp === 0) sc += W[mine];
      else if (mine === 0) sc -= W[opp] * DEF;
    }
    return sc;
  }

  // 落子增益：假设在 (x,y) 落 p，通过该点的窗口分值增量（候选排序用）
  function cellGain(b, x, y, p) {
    const q = 3 - p;
    let g = 0;
    for (const wi of WINDOWS_BY_CELL[y * N + x]) {
      let mine = 0, opp = 0;
      for (const id of WINDOWS[wi]) {
        const v = b[(id / N) | 0][id % N];
        if (v === p) mine++;
        else if (v === q) opp++;
      }
      if (opp === 0) g += W[mine + 1] - W[mine];
    }
    return g;
  }

  // 候选点：已有棋子周围 2 邻域内的空位；空枰返回天元
  function genCandidates(b) {
    let any = false;
    const seen = new Uint8Array(N * N);
    const list = [];
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (!b[y][x]) continue;
        any = true;
        for (let dy = -2; dy <= 2; dy++) {
          const ny = y + dy;
          if (ny < 0 || ny >= N) continue;
          for (let dx = -2; dx <= 2; dx++) {
            const nx = x + dx;
            if (nx < 0 || nx >= N) continue;
            const id = ny * N + nx;
            if (b[ny][nx] || seen[id]) continue;
            seen[id] = 1;
            list.push({ x: nx, y: ny });
          }
        }
      }
    }
    return any ? list : [{ x: 7, y: 7 }];
  }

  // 候选排序：己方落子收益 + 对手在此落子的收益（防守略优先）
  function orderedCandidates(b, p) {
    const list = genCandidates(b);
    for (const c of list) {
      c.s = cellGain(b, c.x, c.y, p) + cellGain(b, c.x, c.y, 3 - p) * 1.1;
    }
    list.sort((a, c) => c.s - a.s);
    return list;
  }

  /* ---------- αβ 剪枝极小极大（negamax 形式） ---------- */
  // 返回 side 行棋视角的分值；depth 为剩余搜索层数（含当前层）
  function search(b, side, depth, alpha, beta, ply) {
    const list = orderedCandidates(b, side);
    const limit = Math.min(list.length, 12);   // 只搜排序后的头部候选，控制宽度
    let best = -Infinity;
    for (let i = 0; i < limit; i++) {
      const c = list[i];
      b[c.y][c.x] = side;
      let sc;
      if (isFive(b, c.x, c.y, side)) {
        sc = FIVE - ply;                        // 越早成五越好
      } else if (depth <= 1) {
        sc = evaluate(b, side);
      } else {
        sc = -search(b, 3 - side, depth - 1, -beta, -alpha, ply + 1);
      }
      b[c.y][c.x] = 0;
      if (sc > best) best = sc;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;                 // αβ 剪枝
    }
    return best === -Infinity ? evaluate(b, side) : best;
  }

  /* AI 决策入口：返回 {x,y} 或 null。depthOverride 供模拟脚本固定深度，
     默认深度 3（候选不多时加深到 4）；同分候选随机取一，演示对局不重复 */
  function bestMove(b, p, depthOverride) {
    const q = 3 - p;
    const list = orderedCandidates(b, p);
    if (!list.length) return null;

    // 1) 一步成五 → 直接下
    for (const c of list) {
      b[c.y][c.x] = p;
      const w = isFive(b, c.x, c.y, p);
      b[c.y][c.x] = 0;
      if (w) return c;
    }
    // 2) 对方一步成五 → 必须挡
    for (const c of list) {
      b[c.y][c.x] = q;
      const w = isFive(b, c.x, c.y, q);
      b[c.y][c.x] = 0;
      if (w) return c;
    }

    const depth = depthOverride || (list.length <= 8 ? 4 : 3);
    const limit = Math.min(list.length, 12);
    let bestScore = -Infinity, alpha = -Infinity;
    const picks = [];
    for (let i = 0; i < limit; i++) {
      const c = list[i];
      b[c.y][c.x] = p;
      const sc = -search(b, q, depth - 1, -Infinity, -alpha, 2);
      b[c.y][c.x] = 0;
      if (sc > bestScore) {
        bestScore = sc;
        picks.length = 0;
        picks.push(c);
        if (bestScore > alpha) alpha = bestScore;
      } else if (sc === bestScore) {
        picks.push(c);
      }
    }
    return picks[Math.floor(Math.random() * picks.length)] || list[0];
  }

  return {
    N: N,
    createBoard: createBoard,
    cloneBoard: cloneBoard,
    checkWin: checkWin,
    isFive: isFive,
    isFull: isFull,
    step: step,
    evaluate: evaluate,
    genCandidates: genCandidates,
    bestMove: bestMove
  };
}
/* ===== AI_CORE_END ===== */
const core = aiCoreGobang();   // 主线程实例：落子判定与 AI 共用同一份纯函数

// ================= 对局状态 =================
let board = [];      // 0 空 / 1 黑 / 2 白
let moves = [];      // 落子顺序 [{x,y,p}]
let current = 1;     // 当前行棋方
let over = false;    // 是否已分出胜负或和棋
let winCells = null; // 获胜五子坐标列表
let winRecorded = false; // 本局胜负是否已计分（悔棋时要退还）
let hover = null;    // 鼠标悬停的空位（半透明预览）

function reset() {
  if (window.GameSFX) GameSFX.unlock();
  board = core.createBoard();   // 纯函数创建初始状态
  moves = [];
  current = 1;
  over = false;
  winCells = null;
  winRecorded = false;
  hover = null;
  statusText.textContent = '黑棋先行，点击棋盘交叉点落子';
  turnDot.className = 'dot black';
  draw();
}

// ================= 绘制 =================
function draw() {
  // 棋盘底色
  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.fillStyle = '#e9c98f';
  ctx.fillRect(0, 0, SIZE, SIZE);

  // 网格线：中间细、边框略粗
  ctx.strokeStyle = '#8a6234';
  for (let i = 0; i < N; i++) {
    const p = PAD + i * CELL;
    ctx.lineWidth = (i === 0 || i === N - 1) ? 1.8 : 1;
    ctx.beginPath();
    ctx.moveTo(PAD, p); ctx.lineTo(PAD + (N - 1) * CELL, p);
    ctx.moveTo(p, PAD); ctx.lineTo(p, PAD + (N - 1) * CELL);
    ctx.stroke();
  }

  // 星位
  ctx.fillStyle = '#7a5227';
  for (const [sx, sy] of STARS) {
    ctx.beginPath();
    ctx.arc(PAD + sx * CELL, PAD + sy * CELL, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // 悬停预览（未结束且该位为空时）
  if (!over && hover && board[hover.y][hover.x] === 0) {
    drawStone(hover.x, hover.y, current, 0.32, false, false);
  }

  // 棋子
  for (const m of moves) {
    const isLast = (m === moves[moves.length - 1]);
    const isWin = !!(winCells && winCells.some(c => c.x === m.x && c.y === m.y));
    drawStone(m.x, m.y, m.p, 1, isLast, isWin);
  }

  // 获胜连线
  if (winCells && winCells.length >= 2) {
    const a = winCells[0], b = winCells[winCells.length - 1];
    ctx.save();
    ctx.strokeStyle = 'rgba(229,72,77,.4)';
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(PAD + a.x * CELL, PAD + a.y * CELL);
    ctx.lineTo(PAD + b.x * CELL, PAD + b.y * CELL);
    ctx.stroke();
    ctx.restore();
  }
}

// 画一枚棋子：p 为 1 黑 / 2 白，alpha 用于悬停预览
function drawStone(x, y, p, alpha, isLast, isWin) {
  const cx = PAD + x * CELL, cy = PAD + y * CELL, r = CELL * 0.44;
  ctx.save();
  ctx.globalAlpha = alpha;
  const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.12, cx, cy, r);
  if (p === 1) {
    g.addColorStop(0, '#707070');
    g.addColorStop(0.35, '#2c2c2c');
    g.addColorStop(1, '#0c0c0c');
  } else {
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.7, '#f1f1f1');
    g.addColorStop(1, '#c6c6c6');
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  if (p === 2) {
    ctx.strokeStyle = 'rgba(0,0,0,.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();

  // 最新一手：红色圆环
  if (isLast) {
    ctx.save();
    ctx.strokeStyle = '#e5484d';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 2.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  // 获胜五子：加亮红色描边
  if (isWin) {
    ctx.save();
    ctx.strokeStyle = 'rgba(229,72,77,.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 1.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// ================= 胜负判定（横竖两种斜向，共四向） =================
function inBoard(x, y) { return x >= 0 && x < N && y >= 0 && y < N; }

// 返回获胜的连续五子坐标（不足五子返回 null），判定逻辑收敛在纯函数核心里
function checkWin(x, y, p) { return core.checkWin(board, x, y, p); }

// ================= 落子 / 悔棋 =================
function place(x, y) {
  if (over || board[y][x] !== 0) return;
  const res = core.step(board, x, y, current);   // 纯函数单步推进
  board = res.board;
  moves.push({ x, y, p: current });
  hover = null;

  if (res.win) {
    if (window.GameSFX) GameSFX.win();
    winCells = res.win;
    over = true;
    if (aiRunning) {
      statusText.textContent = (current === 1 ? '黑棋' : '白棋') + '五子连珠，AI 演示局不计比分';
    } else {
      winRecorded = true;
      if (current === 1) score.black += 1; else score.white += 1;
      saveScore();
      updateHud();
      statusText.textContent = (current === 1 ? '黑棋' : '白棋') + '五子连珠，本局获胜';
    }
  } else if (res.full) {
    over = true;
    statusText.textContent = '棋盘落满，本局和棋';
  } else {
    if (window.GameSFX) GameSFX.click();
    current = 3 - current;
    statusText.textContent = '轮到' + (current === 1 ? '黑棋' : '白棋') + '落子';
    turnDot.className = 'dot ' + (current === 1 ? 'black' : 'white');
  }
  draw();
}

function undo() {
  if (!moves.length) return;
  const last = moves.pop();
  board[last.y][last.x] = 0;
  // 若上一手导致了胜负，悔棋时退还计分并恢复对局
  if (winRecorded) {
    if (last.p === 1) score.black = Math.max(0, score.black - 1);
    else score.white = Math.max(0, score.white - 1);
    winRecorded = false;
    saveScore();
    updateHud();
  }
  over = false;
  winCells = null;
  current = last.p;
  statusText.textContent = '已悔棋，轮到' + (current === 1 ? '黑棋' : '白棋') + '落子';
  turnDot.className = 'dot ' + (current === 1 ? 'black' : 'white');
  draw();
}

// ================= 事件 =================
// 把画布坐标换算成交叉点下标（画布可被 CSS 缩放，需按显示尺寸折算）
function pointToCell(clientX, clientY) {
  const rect = cv.getBoundingClientRect();
  const px = (clientX - rect.left) * SIZE / rect.width;
  const py = (clientY - rect.top) * SIZE / rect.height;
  const x = Math.round((px - PAD) / CELL);
  const y = Math.round((py - PAD) / CELL);
  if (!inBoard(x, y)) return null;
  // 点得太偏不算落子，避免点到格线外也上子
  const dx = px - (PAD + x * CELL), dy = py - (PAD + y * CELL);
  if (Math.sqrt(dx * dx + dy * dy) > CELL * 0.62) return null;
  return { x, y };
}

cv.addEventListener('click', (e) => {
  if (aiRunning) return;                       // AI 代玩期间屏蔽手动落子
  const cell = pointToCell(e.clientX, e.clientY);
  if (cell) place(cell.x, cell.y);
});

cv.addEventListener('mousemove', (e) => {
  if (aiRunning) return;
  const cell = pointToCell(e.clientX, e.clientY);
  const next = (cell && board[cell.y][cell.x] === 0 && !over) ? cell : null;
  if (JSON.stringify(next) !== JSON.stringify(hover)) {
    hover = next;
    draw();
  }
});
cv.addEventListener('mouseleave', () => {
  if (hover) { hover = null; draw(); }
});

// ================= AI 代玩：αβ 剪枝极小极大自动对弈演示 =================
/* AI 先后接管黑白双方自动落子，随时可停；决策与渲染完全无关，
   热路径放在 Web Worker 里算，个别禁用 Worker 的环境降级为主线程计算 */
const aiBtn = document.getElementById('aiBtn');
let aiRunning = false;
let aiTimer = 0;
let aiReqId = 0;
let aiBusy = false;
const AI_MOVE_MS = 620;      // 每步落子间隔，方便观看
const AI_ROUND_MS = 1500;    // 一局结束后的停留，再自动开下一局

const AI_WORKER_SRC =
  'const core = (' + aiCoreGobang.toString() + ')();\n' +
  'onmessage = function (e) {\n' +
  '  postMessage({ id: e.data.id, mv: core.bestMove(e.data.board, e.data.p) });\n' +
  '};';
let aiWorker = null;
try {
  aiWorker = new Worker(URL.createObjectURL(new Blob([AI_WORKER_SRC], { type: 'application/javascript' })));
} catch (e) { /* 个别环境禁用 Worker：降级为主线程计算（见 requestAiMove） */ }

if (aiWorker) {
  aiWorker.onmessage = (e) => {
    aiBusy = false;
    if (!aiRunning || e.data.id !== aiReqId) return;   // 过期回答直接丢弃
    if (e.data.mv) place(e.data.mv.x, e.data.mv.y);
    aiTimer = setTimeout(aiTick, AI_MOVE_MS);
  };
}

function requestAiMove() {
  if (aiBusy) return;
  aiBusy = true;
  if (!aiWorker) {
    setTimeout(() => {
      aiBusy = false;
      if (!aiRunning || over) return;
      const mv = core.bestMove(core.cloneBoard(board), current);
      if (mv) place(mv.x, mv.y);
      aiTimer = setTimeout(aiTick, AI_MOVE_MS);
    }, 30);
    return;
  }
  aiReqId++;
  aiWorker.postMessage({ id: aiReqId, board: core.cloneBoard(board), p: current });
}

// AI 步进状态机：思考落子 → 停顿 → 下一回合；终局停留片刻自动开下一局
function aiTick() {
  if (!aiRunning) return;
  if (over) {
    aiTimer = setTimeout(() => {
      if (!aiRunning) return;
      if (over) reset();                    // 期间被手动开局则顺势继续
      aiTimer = setTimeout(aiTick, 400);
    }, AI_ROUND_MS);
    return;
  }
  requestAiMove();
}

function stopAi(msg) {
  if (!aiRunning) return;
  aiRunning = false;
  clearTimeout(aiTimer);
  aiReqId++;                                // 作废在途的 Worker 结果
  aiBusy = false;
  aiBtn.classList.remove('is-running');
  statusText.textContent = msg || 'AI 已停止，可继续手动游玩';
}

aiBtn.addEventListener('click', () => {
  if (aiRunning) { stopAi(); return; }
  if (over) reset();
  aiRunning = true;
  aiBtn.classList.add('is-running');
  statusText.textContent = 'AI 自动对弈中，点击「停止代玩」可随时停下';
  aiTick();
});

undoBtn.addEventListener('click', () => {
  if (aiRunning) return;                     // AI 代玩期间屏蔽悔棋
  undo();
});
restartBtn.addEventListener('click', () => { stopAi(); reset(); });   // 重新开局会先停掉 AI

// ================= 启动 =================
reset();
})();
</script>
  <div class="g-alert-mask g-alert-rules open" id="rulesModal" role="dialog" aria-modal="true" aria-label="游戏规则" hidden>
    <div class="g-alert">
      <div class="g-alert-body">
    <h2>游戏规则</h2>
    
      <h3>玩法</h3>
      <ul>
        <li>黑先白后轮流落子，先把五颗子连成一线（横竖斜皆可）获胜</li>
        <li>棋盘 15×15，最新一手带红圈标记，获胜连线会高亮</li>
        <li>局数比分自动累计，悔棋会退还相应计分</li>
      </ul>
      <h3>操作</h3>
      <ul>
        <li>点击 / 触屏点按交叉点落子</li>
        <li>悔棋：退一步　重新开局：清空棋盘</li>
        <li>点「AI 代玩」可自动对弈演示（AI 托管黑白双方），比分不累计，随时可停</li>
      </ul>
      </div>
      <div class="g-alert-actions">
        <button class="g-alert-btn default" id="rulesClose" type="button">好的</button>
      </div>
    </div>
  </div>
<script>
  /* 左上角工具栏：规则弹窗 + 全局音效开关；字体与主站「界面字体」联动（appearance.js 单源） */
  (function () {
    var mask = document.getElementById('rulesModal');
    var rulesBtn = document.getElementById('rulesBtn');
    var closeBtn = document.getElementById('rulesClose');
    var lastFocus = null;
    function openRules() {
      if (!mask || !mask.hidden) return;
      lastFocus = document.activeElement;
      mask.hidden = false;                  // mask 常驻 .open（g-alert open 态），只切 hidden
      if (closeBtn) closeBtn.focus();
    }
    function closeRules() {
      if (!mask || mask.hidden) return;
      mask.hidden = true;
      if (lastFocus && lastFocus.focus) lastFocus.focus();
      lastFocus = null;
    }
    if (rulesBtn) rulesBtn.addEventListener('click', openRules);
    if (closeBtn) closeBtn.addEventListener('click', closeRules);
    if (mask) mask.addEventListener('click', function (e) { if (e.target === mask) closeRules(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && mask && !mask.hidden) { e.stopPropagation(); closeRules(); }
    });

    var sfxBtn = document.getElementById('sfxBtn');
    var SFX_KEY = 'gameSfxMuted';
    function sfxMuted() { try { return localStorage.getItem(SFX_KEY) === '1'; } catch (e) { return false; } }
    function paintSfx() {
      if (!sfxBtn) return;
      var muted = sfxMuted();
      sfxBtn.classList.toggle('is-muted', muted);
      sfxBtn.setAttribute('aria-pressed', String(muted));
      sfxBtn.setAttribute('aria-label', muted ? '开启音效' : '静音');
      var on = sfxBtn.querySelector('.sfx-on'), off = sfxBtn.querySelector('.sfx-off');
      if (on) on.toggleAttribute('hidden', muted);      // SVGElement.hidden 非反射属性，必须 toggleAttribute
      if (off) off.toggleAttribute('hidden', !muted);
    }
    if (sfxBtn) sfxBtn.addEventListener('click', function () {
      try { localStorage.setItem(SFX_KEY, sfxMuted() ? '0' : '1'); } catch (e) {}
      paintSfx();
    });
    window.addEventListener('storage', function (e) { if (e.key === SFX_KEY) paintSfx(); });
    paintSfx();

    try { if (window.SiteAppearance) SiteAppearance.applySiteFontFromStorage(); } catch (e) {}
    window.addEventListener('storage', function (e) {
      if (e.key === 'fontFamily' && window.SiteAppearance) SiteAppearance.applySiteFontFromStorage();
    });
  })();
  </script>
</body>
