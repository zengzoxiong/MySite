<style>
/* 叠叠高 · 页面私有样式
   字体栈 / 颜色令牌 / 按钮 / 弹窗 / 规则栏等组件外观统一由 assets/game-ui.css 提供，
   见 docs/game-ui-design.md。游戏个性视觉（天空画布、方块塔身、坠落碎片、飘字）保留在 canvas 绘制内。 */
:root { --game-accent: #5AC8FA; }   /* 个性色：叠层青（§7 分配表） */

/* ===== 游戏私有视觉 ===== */
/* 竖版画布台面：限宽居中；触控防护与画布圆角由 .g-stage 提供 */
#stage { max-width: 480px; margin: 0 auto; }

/* 覆盖层内容排版：开始 / 暂停 / 结算文案由脚本 innerHTML 生成，
   生成结构不动，用选择器映射到 g-* 组件语言（标题 / 说明 / 大数字 / 按钮） */
#ov { cursor: pointer; }   /* 点击画面开始 / 继续 */
#ov h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
}
#ov p {
  margin: 0;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.8;
}
#ov .big {
  font-family: var(--font-display);
  font-size: 46px;
  font-weight: 800;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
  color: var(--game-accent);
}
/* 覆盖层按钮：等价 .g-btn 实心主按钮（开始游戏 / 再来一局） */
#ov button {
  appearance: none;
  -webkit-appearance: none;
  min-height: var(--touch-min);
  padding: 10px 20px;
  border: 0;
  border-radius: var(--radius);
  background: var(--game-accent);
  color: var(--game-on-accent);
  font-family: inherit;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.2;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform var(--dur-press) var(--ease-spring),
              opacity var(--dur-press) var(--ease-out);
}
#ov button:active { transform: scale(.96); opacity: .85; }
#ov button:focus-visible { outline: 2px solid var(--game-accent); outline-offset: 2px; }

/* 窄屏：标题与 HUD 工具条分行排布 */
@media (max-width: 560px) {
  .g-nav { flex-wrap: wrap; }
}

/* 规则栏展开时主体让位的过渡动画（让位量由共享样式表 .g-page.rules-open 控制） */
body.g-page { transition: padding-right .28s cubic-bezier(.22, .9, .3, 1); }
</style>

<body class="g-page">
    <nav class="g-tool-grid" aria-label="游戏工具栏"><a class="g-tool-btn" href="../../index.html" aria-label="返回拾光集主页" title="返回主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H10"/></svg></a><button class="g-tool-btn" id="rulesBtn" type="button" aria-label="游戏规则" title="游戏规则"><svg class="g-q" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4.5"/><path d="M12 17.5h.01"/></svg></button><button class="g-tool-btn g-tool-ai" id="aiBtn" type="button" aria-pressed="false" title="AI 代玩">AI</button><button class="g-tool-btn" id="sfxBtn" type="button" aria-pressed="false" aria-label="静音" title="音效开关"><svg class="sfx-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 8.5H3v7h3.5L11 19V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.6 6a9 9 0 0 1 0 12"/></svg><svg class="sfx-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M11 5 6.5 8.5H3v7h3.5L11 19V5Z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg></button></nav>

<main class="g-wrap g-card">
  <header class="g-nav">
    <h1 class="g-nav-title">叠叠高</h1>
    <div class="g-hud-bar">
      <span class="g-stat-inline">分数 <b id="score">0</b></span>

  </div>
  <footer class="g-foot">拾光集 · 在线小游戏</footer>
</main>
<script>
(function () {
'use strict';

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var stage = document.getElementById('stage');
var ov = document.getElementById('ov');
var elScore = document.getElementById('score');
var elLayer = document.getElementById('layer');
var elBest = document.getElementById('best');
var aiBtn = document.getElementById('aiBtn');
var aiBadge = document.getElementById('aiBadge');

// ===== TOWER_CORE_START =====
// 与渲染无关的纯逻辑核心：游戏状态、单步推进、放置判定、AI 决策。
// ai-sim.mjs 会提取本标记段在 node 中运行，
// 因此本段内禁止引用 DOM / Canvas / window 等浏览器对象。
function createTowerCore(rand) {
  var W = 420;             // 逻辑宽度（移动块边界判定用）
  var BH = 26;             // 单块高度
  var INIT_W = 150;        // 初始方块宽度
  var BASE_Y = 560;        // 基座顶面纵坐标
  var PERFECT_TOL = 6;     // 完全对齐的判定容差（像素）
  var REGROW = 12;         // 完全对齐时宽度回涨量

  /* 生成下一块移动块：从屏幕一侧外进入，宽度继承塔顶 */
  function spawnMoving(st) {
    var top = st.stack[st.stack.length - 1];
    var li = st.stack.length;   // 本块作为第 li 个玩家层
    var dir = rand() < 0.5 ? 1 : -1;
    st.moving = {
      x: dir === 1 ? -top.w - 10 : W + 10,   // 从屏幕一侧外进入
      w: top.w,                              // 宽度继承塔顶
      dir: dir,
      hue: (205 + li * 14) % 360,            // 逐层轮换色相
      y: BASE_Y - (st.stack.length + 1) * BH
    };
  }

  /* 新建一局核心状态（第 0 块为基块，不计玩家层数） */
  function createState() {
    var st = {
      stack: [{ x: (W - INIT_W) / 2, w: INIT_W, hue: 205 }],
      moving: null,
      score: 0,
      combo: 0,
      bonus: 0,
      over: false
    };
    spawnMoving(st);
    return st;
  }

  /* 塔越高移动越快 */
  function speedFor(st) {
    return Math.min(430, 185 + (st.stack.length - 1) * 6.5);
  }

  /* 单步推进：移动块往返平移，触边折返（与页面逐帧更新一致） */
  function step(st, dt) {
    if (st.over || !st.moving) return st;
    var mv = st.moving;
    mv.x += mv.dir * speedFor(st) * dt;
    var l = -26, r = W - mv.w + 26;
    if (mv.x < l) { mv.x = l; mv.dir = 1; }
    if (mv.x > r) { mv.x = r; mv.dir = -1; }
    return st;
  }

  /* 放下移动块：规则判定全部在此，返回事件供渲染层生成碎片 / 飘字 */
  function drop(st) {
    if (st.over || !st.moving) return null;
    var top = st.stack[st.stack.length - 1];
    var mv = st.moving;
    var left = Math.max(mv.x, top.x);
    var right = Math.min(mv.x + mv.w, top.x + top.w);
    var overlap = right - left;
    var ev = { missed: false, perfect: false, combo: 0, x: mv.x, w: mv.w, y: mv.y, hue: mv.hue, dir: mv.dir, cuts: [] };

    if (overlap <= 2) {
      /* 完全悬空：整块坠落，游戏结束 */
      ev.missed = true;
      st.moving = null;
      st.over = true;
      return ev;
    }

    var perfect = Math.abs(mv.x - top.x) <= PERFECT_TOL && Math.abs(mv.w - top.w) <= PERFECT_TOL;
    if (perfect) {
      /* 完全对齐：宽度回涨一点并加分（连击越多奖励越高） */
      st.combo += 1;
      st.bonus += st.combo;
      var newW = Math.min(INIT_W, top.w + REGROW);
      var newX = top.x + top.w / 2 - newW / 2;   // 以塔顶中心对称回涨
      st.stack.push({ x: newX, w: newW, hue: mv.hue });
      ev.perfect = true;
      ev.combo = st.combo;
    } else {
      st.combo = 0;
      st.stack.push({ x: left, w: overlap, hue: mv.hue });
      /* 悬空部分标记为坠落碎片事件 */
      if (mv.x < left - 0.5) ev.cuts.push({ x: mv.x, w: left - mv.x, vx: -70 });
      if (mv.x + mv.w > right + 0.5) ev.cuts.push({ x: right, w: mv.x + mv.w - right, vx: 70 });
    }

    st.score = st.stack.length - 1 + st.bonus;   // 层数 + 完美奖励
    spawnMoving(st);
    return ev;
  }

  /* ---------- AI 决策（与渲染无关） ----------
     思路：按当前移动块与塔顶的水平偏差计算对准时机——
     预测本帧移动后的新偏差，若「立即放下」比「再走一帧」更接近
     对齐位则点击；误差不超过半帧位移，可稳定打出完美对齐回涨宽度。 */
  function decide(st, dt) {
    if (st.over || !st.moving) return false;
    var top = st.stack[st.stack.length - 1];
    var mv = st.moving;
    var nextX = mv.x + mv.dir * speedFor(st) * dt;
    var l = -26, r = W - mv.w + 26;
    if (nextX < l) nextX = l;
    if (nextX > r) nextX = r;
    return Math.abs(mv.x - top.x) <= Math.abs(nextX - top.x);
  }

  return {
    W: W, BH: BH, INIT_W: INIT_W, BASE_Y: BASE_Y, PERFECT_TOL: PERFECT_TOL, REGROW: REGROW,
    createState: createState, spawnMoving: spawnMoving, speedFor: speedFor,
    step: step, drop: drop, decide: decide
  };
}
// ===== TOWER_CORE_END =====

/* 页面侧核心实例：状态 / 推进 / 放置 / AI 决策全部来自纯逻辑核心 */
var core = createTowerCore(Math.random);
var W = core.W;            // 逻辑分辨率
var H = 640;
var BH = core.BH;
var INIT_W = core.INIT_W;
var BASE_Y = core.BASE_Y;

/* 高分屏适配 */
(function fit() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr;
  cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
})();

/* ================= 最高纪录（带 slug 前缀，读写均包 try/catch） ================= */
var BEST_KEY = 'stack-tower_best';
var best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }

/* ================= 游戏流程状态（渲染层） ================= */
var state = 'ready';   // ready | playing | dying | over | paused
var G = null;          // 核心游戏状态（塔身 / 移动块 / 分数 / 连击），由纯逻辑核心推进
var debris = [];       // 被切掉的坠落碎片
var texts = [];        // 飘字提示
var cam = 0;           // 相机下移量（塔高时视野跟随）
var dieT = 0, overGuard = 0;
var aiOn = false, aiTimer = null;   // AI 代玩开关与自动续局定时器

function resetGame() {
  G = core.createState();
  debris = []; texts = [];
  cam = 0;
  dieT = 0;
  syncHud();
}

/* ================= HUD 与覆盖层 ================= */
function syncHud() {
  elScore.textContent = G.score;
  elLayer.textContent = G.stack.length - 1;
  elBest.textContent = best;
}
function showOverlay(html) { ov.innerHTML = html; ov.hidden = false; }
function hideOverlay() { ov.hidden = true; }

function showStart() {
  showOverlay(
    '<h2>叠叠高</h2>' +
    '<p>方块左右往返移动，点击或按空格放下<br>对齐部分保留、悬空部分切掉<br>完全对齐可回涨宽度并获得连击加分</p>' +
    '<button type="button">开始游戏</button>' +
    '<p>点击画面 / 空格键 放下方块<br>也可点击「AI 代玩」由 AI 自动对准堆叠</p>'
  );
}
function showPause() {
  showOverlay('<h2>已暂停</h2><p>点击画面或按空格继续</p>');
}
function showOver() {
  state = 'over';
  if (window.GameSFX) GameSFX.lose();
  overGuard = 0.6;
  var isNew = !aiOn && G.score > best;   // AI 代玩成绩不计入最高纪录
  if (isNew) {
    best = G.score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }
  syncHud();
  showOverlay(
    '<h2>' + (isNew ? '新纪录！' : '游戏结束') + '</h2>' +
    '<div class="big">' + G.score + '</div>' +
    '<p>共叠 ' + (G.stack.length - 1) + ' 层 · 完美奖励 ' + G.bonus + ' 分 · 最高纪录 ' + best + '</p>' +
    (aiOn ? '<p>AI 代玩中，即将自动开始下一局</p>' : '') +
    '<button type="button">再来一局</button>'
  );
  if (aiOn) {
    aiTimer = setTimeout(function () {
      aiTimer = null;
      if (aiOn && state === 'over') startGame();
    }, 900);
  }
}

/* ================= 流程控制 ================= */
function startGame() {
  resetGame();
  state = 'playing';
  hideOverlay();
  if (window.GameSFX) GameSFX.unlock();
}
function resumeGame() {
  state = 'playing';
  hideOverlay();
}
function doDrop() {
  if (state !== 'playing' || !G.moving) return;
  var ev = core.drop(G);
  if (!ev) return;
  if (ev.missed) {
    /* 完全悬空：整块坠落，进入结束动画 */
    debris.push({ x: ev.x, w: ev.w, y: ev.y, vx: ev.dir * 40, vy: -60, hue: ev.hue });
    state = 'dying';
    dieT = 0;
    return;
  }
  if (ev.perfect) {
    if (window.GameSFX) GameSFX.combo();   // 完全对齐连击
    var top = G.stack[G.stack.length - 1];
    texts.push({ s: '完美 +' + ev.combo, x: top.x + top.w / 2, y: ev.y - 8, life: 1.1, max: 1.1 });
  } else {
    if (window.GameSFX) GameSFX.score();   // 普通放置
    for (var i = 0; i < ev.cuts.length; i++) {
      debris.push({ x: ev.cuts[i].x, w: ev.cuts[i].w, y: ev.y, vx: ev.cuts[i].vx, vy: -40, hue: ev.hue });
    }
  }
  syncHud();
}
function act() {
  if (state === 'ready') startGame();
  else if (state === 'playing') { if (!aiOn) doDrop(); }   // AI 代玩时不抢控制权
  else if (state === 'paused') resumeGame();
  else if (state === 'over' && overGuard <= 0) startGame();
}

/* ================= 更新 ================= */
function update(dt) {
  /* 碎片坠落 */
  for (var i = debris.length - 1; i >= 0; i--) {
    var d = debris[i];
    d.vy += 1500 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    if (d.y > H + 80) debris.splice(i, 1);
  }
  /* 飘字上浮渐隐 */
  for (var ti = texts.length - 1; ti >= 0; ti--) {
    var tx = texts[ti];
    tx.life -= dt;
    tx.y -= 34 * dt;
    if (tx.life <= 0) texts.splice(ti, 1);
  }
  /* 相机跟随：工作区（下一块放置位）不高于期望线 */
  var workY = BASE_Y - (G.stack.length + 1) * BH;
  var targetCam = Math.max(0, 210 - workY);
  cam += (targetCam - cam) * Math.min(1, dt * 6);

  if (state === 'playing') {
    if (aiOn && core.decide(G, dt)) doDrop();   // AI 决策：到对准时机即放下
    else core.step(G, dt);
  } else if (state === 'dying') {
    dieT += dt;
    if (dieT > 0.75) showOver();
  }
}

/* ================= 绘制 ================= */
function drawBlock(x, y, w, h, hue, isBase) {
  if (w <= 0) return;
  var sat = isBase ? 14 : 60;
  var l = isBase ? 40 : 58;
  ctx.fillStyle = 'hsl(' + hue + ',' + sat + '%,' + l + '%)';
  ctx.fillRect(x, y, w, h);
  /* 顶部亮面 */
  ctx.fillStyle = 'hsl(' + hue + ',' + sat + '%,' + (l + 14) + '%)';
  ctx.fillRect(x, y, w, Math.min(5, h * 0.25));
  /* 底部暗面 */
  ctx.fillStyle = 'hsl(' + hue + ',' + sat + '%,' + (l - 12) + '%)';
  ctx.fillRect(x, y + h - 4, w, 4);
  /* 描边 */
  ctx.strokeStyle = 'hsl(' + hue + ',' + sat + '%,' + (l - 22) + '%)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}
function cloud(x, y) {
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath();
  ctx.arc(x, y, 14, 0, Math.PI * 2);
  ctx.arc(x + 14, y + 4, 10, 0, Math.PI * 2);
  ctx.arc(x - 14, y + 5, 9, 0, Math.PI * 2);
  ctx.fill();
}
function sun(x, y, r) {
  ctx.fillStyle = 'rgba(255,214,112,.25)';
  ctx.beginPath();
  ctx.arc(x, y, r + 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,214,112,.85)';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}
function draw() {
  /* 背景：淡色天空 */
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#dceefb');
  bg.addColorStop(1, '#f6f9f4');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  sun(W - 74, 84, 26);
  cloud(W * 0.2, 96);
  cloud(W * 0.75, 170);
  cloud(W * 0.42, 40);

  ctx.save();
  ctx.translate(0, cam);

  /* 基座（向下延伸出画面） */
  drawBlock((W - INIT_W) / 2, BASE_Y, INIT_W, H - BASE_Y + 20, 210, true);
  /* 塔身（只画可视范围内的层） */
  for (var i = 0; i < G.stack.length; i++) {
    var b = G.stack[i];
    var y = BASE_Y - (i + 1) * BH;
    if (y + BH < -40 || y > H + 40) continue;
    drawBlock(b.x, y, b.w, BH, b.hue, false);
  }
  /* 坠落碎片 */
  for (var d = 0; d < debris.length; d++) {
    drawBlock(debris[d].x, debris[d].y, debris[d].w, BH, debris[d].hue, false);
  }
  /* 当前移动块 */
  if (G.moving && (state === 'playing' || state === 'paused' || state === 'ready')) {
    drawBlock(G.moving.x, G.moving.y, G.moving.w, BH, G.moving.hue, false);
  }
  /* 飘字 */
  ctx.textAlign = 'center';
  ctx.font = '700 20px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  for (var t2 = 0; t2 < texts.length; t2++) {
    ctx.globalAlpha = Math.max(0, texts[t2].life / texts[t2].max);
    ctx.fillStyle = '#1a73e8';
    ctx.fillText(texts[t2].s, texts[t2].x, texts[t2].y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ================= 主循环 ================= */
var lastFrame = performance.now();
function loop(now) {
  var dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  if (overGuard > 0) overGuard -= dt;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ================= 输入（指针 + 键盘，兼容无 PointerEvent 的环境） ================= */
function onTap(el, fn) {
  if (window.PointerEvent) el.addEventListener('pointerdown', fn);
  else {
    el.addEventListener('touchstart', function (e) { e.preventDefault(); fn(e.touches[0]); }, { passive: false });
    el.addEventListener('mousedown', fn);
  }
}
onTap(stage, function () { act(); });
window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
    e.preventDefault();
    if (!e.repeat) act();
  }
});

/* ================= AI 代玩控制（随时可停，成绩不计最高分） ================= */
function setAi(on) {
  aiOn = on;
  aiBtn.classList.toggle('is-running', on);
  aiBtn.setAttribute('aria-pressed', String(on));
  aiBadge.hidden = !on;
  if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
  if (on) {
    if (state === 'ready' || state === 'over') startGame();   // 待机 / 结束状态直接开新局
    else if (state === 'paused') resumeGame();                // 暂停中则继续
  }
}
aiBtn.addEventListener('click', function () { setAi(!aiOn); });

/* 切后台自动暂停；回到前台重置时间基准，避免 delta 时间跳变 */
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    if (state === 'playing') { state = 'paused'; showPause(); }
  } else {
    lastFrame = performance.now();
    if (aiOn && state === 'paused') resumeGame();   // AI 代玩：回前台自动继续
  }
});

/* ================= 启动 ================= */
resetGame();
showStart();
requestAnimationFrame(loop);
})();
</script>
  <div class="g-alert-mask g-alert-rules open" id="rulesModal" role="dialog" aria-modal="true" aria-label="游戏规则" hidden>
    <div class="g-alert">
      <div class="g-alert-body">
    <h2>游戏规则</h2>

      <h3>玩法</h3>
      <ul>
        <li>方块左右往返移动，看准时机放下，与下方对齐的部分保留</li>
        <li>悬空部分会被切掉，完全对齐可回涨宽度并连击加分</li>
        <li>塔越高移动越快，宽度归零即结束</li>
      </ul>
      <h3>操作</h3>
      <ul>
        <li>点击 / 空格 / ↑ / 回车：放下方块</li>
      </ul>
      <h3>AI 代玩</h3>
      <ul>
        <li>点击「AI 代玩」按钮，AI 按对准时机自动放下方块并自动续局</li>
        <li>再次点击随时停止；AI 成绩不计入最高纪录</li>
      </ul>
      </div>
      <div class="g-alert-actions">
        <button class="g-alert-btn default" id="rulesClose" type="button">好的</button>
      </div>
    </div>
  </div>
<script>
  /* 左上角工具栏：规则弹窗 + 全局音效开关；字体与主站「界面字体」联动（appearance.js 单源） */
  (function () {
    var mask = document.getElementById('rulesModal');
    var rulesBtn = document.getElementById('rulesBtn');
    var closeBtn = document.getElementById('rulesClose');
    var lastFocus = null;
    function openRules() {
      if (!mask || !mask.hidden) return;
      lastFocus = document.activeElement;
      mask.hidden = false;                  // mask 常驻 .open（g-alert open 态），只切 hidden
      if (closeBtn) closeBtn.focus();
    }
    function closeRules() {
      if (!mask || mask.hidden) return;
      mask.hidden = true;
      if (lastFocus && lastFocus.focus) lastFocus.focus();
      lastFocus = null;
    }
    if (rulesBtn) rulesBtn.addEventListener('click', openRules);
    if (closeBtn) closeBtn.addEventListener('click', closeRules);
    if (mask) mask.addEventListener('click', function (e) { if (e.target === mask) closeRules(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && mask && !mask.hidden) { e.stopPropagation(); closeRules(); }
    });

    var sfxBtn = document.getElementById('sfxBtn');
    var SFX_KEY = 'gameSfxMuted';
    function sfxMuted() { try { return localStorage.getItem(SFX_KEY) === '1'; } catch (e) { return false; } }
    function paintSfx() {
      if (!sfxBtn) return;
      var muted = sfxMuted();
      sfxBtn.classList.toggle('is-muted', muted);
      sfxBtn.setAttribute('aria-pressed', String(muted));
      sfxBtn.setAttribute('aria-label', muted ? '开启音效' : '静音');
      var on = sfxBtn.querySelector('.sfx-on'), off = sfxBtn.querySelector('.sfx-off');
      if (on) on.toggleAttribute('hidden', muted);      // SVGElement.hidden 非反射属性，必须 toggleAttribute
      if (off) off.toggleAttribute('hidden', !muted);
    }
    if (sfxBtn) sfxBtn.addEventListener('click', function () {
      try { localStorage.setItem(SFX_KEY, sfxMuted() ? '0' : '1'); } catch (e) {}
      paintSfx();
    });
    window.addEventListener('storage', function (e) { if (e.key === SFX_KEY) paintSfx(); });
    paintSfx();

    try { if (window.SiteAppearance) SiteAppearance.applySiteFontFromStorage(); } catch (e) {}
    window.addEventListener('storage', function (e) {
      if (e.key === 'fontFamily' && window.SiteAppearance) SiteAppearance.applySiteFontFromStorage();
    });
  })();
  </script>
