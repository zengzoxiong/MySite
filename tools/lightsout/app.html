<!DOCTYPE html>

<style>
    /* ===== 点灯谜题 · 游戏私有样式（组件基线由 ../../assets/game-ui.css 提供） ===== */

    /* 个性色：黄（灯光）。黄/灰个性色页按规范 §7.1 覆盖两个令牌并带深色复位 */
    :root {
      --game-accent: #FFCC00;
      --game-on-accent: #1C1C1E;       /* 实心底上的字改深：#1C1C1E 压 #FFCC00 达 11.25:1 */
      --game-accent-text: #8A6100;     /* 强调色作文字用深琥珀，对 #F2F2F7 达 4.96:1 */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --game-on-accent: #FFFFFF;
        --game-accent-text: var(--game-accent);
      }
    }

    /* 灯箱：深蓝灰内衬底板，亮灯的光晕在深底上才好看（游戏个性视觉，深浅色一致） */
    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
      padding: 14px;
      background: #2b3140;
      border-radius: 16px;
      box-shadow: inset 0 2px 12px rgba(0, 0, 0, .4);
      transition: box-shadow .4s;
    }
    .board.cleared { box-shadow: inset 0 2px 12px rgba(0, 0, 0, .4), 0 0 26px rgba(255, 183, 46, .4); }

    .cell {
      position: relative;
      aspect-ratio: 1;
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: #394154;
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, .45), inset 0 -1px 2px rgba(255, 255, 255, .05);
      cursor: pointer;
      transition: background .16s, box-shadow .16s;
      touch-action: manipulation;
    }
    .cell.on {
      background: radial-gradient(circle at 35% 30%, #ffe48e, #ffb62e 62%, #ef9d0c);
      box-shadow: 0 0 16px rgba(255, 182, 46, .55), 0 0 4px rgba(255, 224, 130, .9), inset 0 -3px 6px rgba(176, 88, 0, .4);
    }
    /* 玻璃高光点：亮灯明显、灭灯几乎不可见 */
    .cell::after {
      content: "";
      position: absolute;
      left: 24%; top: 17%;
      width: 20%; height: 20%;
      border-radius: 50%;
      background: #fff;
      opacity: .08;
      filter: blur(1px);
      transition: opacity .16s;
      pointer-events: none;
    }
    .cell.on::after { opacity: .85; }
    .cell:active { transform: scale(.92); }
    .cell.pop { animation: pop .22s ease; }
    @keyframes pop { 45% { transform: scale(1.12); } }
    .cell:focus-visible { outline: 2px solid #ffc93c; outline-offset: 2px; }

    /* 结算层按钮排布（按钮本体统一用 .g-alert-btn，规范 §5 第 8 条） */
    .ov-btns { display: flex; gap: 10px; margin-top: 8px; width: 100%; max-width: 250px; }
    .ov-btns .g-alert-btn { flex: 1; }

    /* 黄色个性色下胜利标题改用深琥珀强调文字色，浅色底对比度达标（规范 §7.1） */
    .g-overlay-win .g-overlay-title { color: var(--game-accent-text); }
</style>
</head>
<body class="g-page">
    <nav class="g-tool-grid" aria-label="游戏工具栏"><a class="g-tool-btn" href="../../index.html" aria-label="返回拾光集主页" title="返回主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H10"/></svg></a><button class="g-tool-btn" id="rulesBtn" type="button" aria-label="游戏规则" title="游戏规则"><svg class="g-q" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4.5"/><path d="M12 17.5h.01"/></svg></button><button class="g-tool-btn g-tool-ai" type="button" disabled aria-label="本游戏未支持 AI 代玩" title="AI 代玩（本游戏未支持）">AI</button><button class="g-tool-btn" id="sfxBtn" type="button" aria-pressed="false" aria-label="静音" title="音效开关"><svg class="sfx-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 8.5H3v7h3.5L11 19V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.6 6a9 9 0 0 1 0 12"/></svg><svg class="sfx-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M11 5 6.5 8.5H3v7h3.5L11 19V5Z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg></button></nav>

  <main class="g-wrap">
    <h1 class="g-nav-large">点灯谜题</h1>
    <p class="g-nav-sub">LIGHTS OUT · 熄灭整块 5×5 灯阵</p>

    <section class="g-hud">
      <div class="g-stat" id="movesStat"><span class="g-stat-label">步数</span><span class="g-stat-value g-num" id="moves">0</span></div>
      <div class="g-stat"><span class="g-stat-label">最优参考</span><span class="g-stat-value g-num" id="opt">—</span></div>
      <div class="g-stat"><span class="g-stat-label">最少步纪录</span><span class="g-stat-value g-num" id="best">—</span></div>
    </section>

    <div class="board g-stage" id="board">
      <div class="g-overlay g-overlay-fade g-overlay-win" id="overlay" hidden>
        <p class="g-overlay-title" id="ovTitle"></p>
        <p class="g-overlay-text" id="ovSub"></p>
        <div class="ov-btns">
          <button class="g-alert-btn" id="ovReplay" type="button">重玩本关</button>
          <button class="g-alert-btn default" id="ovNext" type="button">下一关</button>
        </div>
      </div>
    </div>

    <div class="g-segment" id="modes" role="group" aria-label="难度">
      <button class="mode" data-mode="easy" type="button" aria-pressed="false">简单</button>
      <button class="mode" data-mode="normal" type="button" aria-pressed="false">普通</button>
      <button class="mode" data-mode="hard" type="button" aria-pressed="false">困难</button>
    </div>

    <div class="g-btn-row">
      <button class="g-btn" id="newBtn" type="button">新关卡</button>
      <button class="g-btn g-btn-gray" id="undoBtn" type="button">撤销</button>
      <button class="g-btn g-btn-gray" id="resetBtn" type="button">重开</button>
    </div>

    <p class="g-tips" id="tip">点击任意一盏灯，它和上下左右相邻的灯会一起翻转，把全部灯光熄灭即获胜。</p>
    <footer class="g-foot">拾光集 · 在线小游戏</footer>
  </main>

  <script>
  (() => {
  'use strict';
  /* ================= 点灯谜题主逻辑（零依赖，纯本地运行） ================= */

  // ---------- 棋盘常量：25 盏灯压进一个 25 位整数，位为 1 表示亮 ----------
  const N = 5, SIZE = N * N;
  const FULL = (1 << SIZE) - 1;                          // 满盘全亮
  const BOTTOM = ((1 << N) - 1) << (N * (N - 1));        // 底行 5 位（位 20~24）
  // FLIP[i]：点击第 i 格时被翻转的全部格子（自身 + 上下左右）的位掩码
  const FLIP = new Array(SIZE);
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      let m = 1 << (r * N + c);
      if (r > 0)     m |= 1 << ((r - 1) * N + c);
      if (r < N - 1) m |= 1 << ((r + 1) * N + c);
      if (c > 0)     m |= 1 << (r * N + c - 1);
      if (c < N - 1) m |= 1 << (r * N + c + 1);
      FLIP[r * N + c] = m;
    }
  }

  // ---------- 求解器：首行枚举 + 逐行追灯 ----------
  // 点灯在 GF(2) 下与点击顺序无关，任何解都唯一对应一种第一行按法，
  // 因此枚举 32 种首行组合逐行追灯即可覆盖全部解，取最短即最优步数。
  function chase(state, firstMask) {
    let s = state, clicks = 0;
    for (let c = 0; c < N; c++) {
      if (firstMask & (1 << c)) { s ^= FLIP[c]; clicks++; }
    }
    for (let r = 0; r < N - 1; r++) {          // 上一行哪盏还亮，就按下一行同列
      for (let c = 0; c < N; c++) {
        if (s & (1 << (r * N + c))) { s ^= FLIP[(r + 1) * N + c]; clicks++; }
      }
    }
    return (s & BOTTOM) === 0 ? clicks : -1;   // 底行清不干净则此首行组合无解
  }
  function bestSolve(state) {
    let best = Infinity;
    for (let m = 0; m < (1 << N); m++) {
      const k = chase(state, m);
      if (k >= 0 && k < best) best = k;
    }
    return best === Infinity ? -1 : best;
  }

  // ---------- 关卡生成：由满盘逆推 ----------
  // 从满盘全亮出发随机施加一组点击得到初始局面；全亮本身可解，
  // 因此逆推出的局面必定可解，这里仍用求解器复核并按难度筛最优步数区间。
  function generate(lo, hi) {
    let fallback = null;
    for (let t = 0; t < 600; t++) {
      const k = 6 + (Math.random() * 10 | 0);          // 6~15 个构造点击
      const order = [];
      for (let i = 0; i < SIZE; i++) order.push(i);
      for (let i = SIZE - 1; i > 0; i--) {             // Fisher-Yates 洗牌取前 k 格
        const j = Math.random() * (i + 1) | 0;
        const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
      }
      let s = FULL;
      for (let i = 0; i < k; i++) s ^= FLIP[order[i]];
      if (s === 0) continue;                           // 碰巧全灭，开局即胜，丢弃
      const opt = bestSolve(s);
      if (opt < 3) continue;                           // 太简单没意思
      if (opt >= lo && opt <= hi) return { state: s, opt: opt };
      if (!fallback || Math.abs(opt - lo) < Math.abs(fallback.opt - lo)) {
        fallback = { state: s, opt: opt };             // 记录最接近区间的候选
      }
    }
    return fallback || { state: FULL, opt: bestSolve(FULL) };  // 兜底：全亮本身即一关
  }

  // ---------- 难度档位：限定最优步数区间；纪录按难度分开存 ----------
  const MODES = {
    easy:   { label: '简单', lo: 4,  hi: 6,  key: 'lightsOutBestEasy' },
    normal: { label: '普通', lo: 7,  hi: 10, key: 'lightsOutBestNormal' },
    hard:   { label: '困难', lo: 11, hi: 25, key: 'lightsOutBestHard' }
  };

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), overlay = $('overlay');
  const movesEl = $('moves'), optEl = $('opt'), bestEl = $('best');
  const movesStat = $('movesStat');
  const ovTitle = $('ovTitle'), ovSub = $('ovSub');
  const undoBtn = $('undoBtn');
  const tipEl = $('tip');

  // ---------- 本地存储（读写都兜底，隐私模式不报错） ----------
  function bestOf(m) {
    try {
      const v = parseInt(localStorage.getItem(MODES[m].key), 10);
      return isNaN(v) ? null : v;
    } catch (e) { return null; }
  }
  function saveBest(m, v) {
    try { localStorage.setItem(MODES[m].key, String(v)); } catch (e) { }
  }

  // ---------- 状态 ----------
  let mode = 'normal';
  let cur = 0;        // 当前灯阵
  let initial = 0;    // 本关初始灯阵（重开用）
  let opt = 0;        // 本关最优步数
  let moves = 0;
  let hist = [];      // 撤销栈：按过的格子下标
  let solved = false;

  // ---------- 构建 25 个灯格（overlay 保持在最后，盖在灯格上方） ----------
  const cells = [];
  for (let i = 0; i < SIZE; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cell';
    b.addEventListener('click', () => press(i));
    boardEl.insertBefore(b, overlay);
    cells.push(b);
  }

  // ---------- 渲染 ----------
  function render() {
    for (let i = 0; i < SIZE; i++) {
      const on = (cur & (1 << i)) !== 0;
      cells[i].classList.toggle('on', on);
      cells[i].setAttribute('aria-pressed', on ? 'true' : 'false');
      cells[i].setAttribute('aria-label', '第 ' + ((i / N | 0) + 1) + ' 行第 ' + (i % N + 1) + ' 列，' + (on ? '亮' : '灭'));
    }
    movesEl.textContent = moves;
    optEl.textContent = opt > 0 ? opt : '—';
    const b = bestOf(mode);
    bestEl.textContent = b == null ? '—' : b;
    undoBtn.disabled = solved || hist.length === 0;
  }
  function bump(el) {   // 数字变化时弹一下（先移除再强制回流，重置动画）
    el.classList.remove('g-bump');
    void el.offsetWidth;
    el.classList.add('g-bump');
  }

  // ---------- 交互 ----------
  function press(i) {
    if (solved) return;
    if (window.GameSFX) GameSFX.click();
    cur ^= FLIP[i];
    moves++;
    hist.push(i);
    bump(movesStat);
    cells[i].classList.remove('pop');
    void cells[i].offsetWidth;
    cells[i].classList.add('pop');
    render();
    if (cur === 0) win();
  }
  function undo() {
    if (solved || hist.length === 0) return;
    const i = hist.pop();
    cur ^= FLIP[i];     // 点击是自反操作，再按同一格即复原
    moves--;
    render();
  }
  function resetBoard() {
    cur = initial; moves = 0; hist = []; solved = false;
    boardEl.classList.remove('cleared');
    hideOverlay();
    tipEl.textContent = '本关已恢复初始局面，步数清零。';
    render();
  }
  function newPuzzle() {
    if (window.GameSFX) GameSFX.unlock();
    const m = MODES[mode];
    const p = generate(m.lo, m.hi);
    initial = p.state; opt = p.opt;
    cur = initial; moves = 0; hist = []; solved = false;
    boardEl.classList.remove('cleared');
    hideOverlay();
    tipEl.textContent = '最优参考 ' + opt + ' 步，试试能不能恰好用这么多步熄灭全部灯光。';
    render();
  }

  // ---------- 胜利 ----------
  function win() {
    solved = true;
    if (window.GameSFX) GameSFX.win();
    boardEl.classList.add('cleared');
    tipEl.textContent = '已通关！点「下一关」继续挑战，或切换难度换个局面。';
    const prev = bestOf(mode);
    const isNew = prev == null || moves < prev;
    if (isNew) saveBest(mode, moves);
    render();   // 刷新纪录显示并禁用撤销
    ovTitle.textContent = moves === opt ? '完美通关！' : '全部熄灭！';
    let line = '用了 ' + moves + ' 步 · 最优参考 ' + opt + ' 步';
    if (moves === opt) line += '，分毫不差';
    const shown = isNew ? moves : prev;
    if (isNew) line += '，刷新本难度最少步纪录！';
    else if (shown != null) line += '，本难度纪录 ' + shown + ' 步';
    ovSub.textContent = line;
    setTimeout(() => {
      overlay.hidden = false;
      void overlay.offsetWidth;   // 同步回流后再加 open，保证过渡生效
      overlay.classList.add('open');
    }, 430);
  }
  function hideOverlay() {
    overlay.classList.remove('open');
    overlay.hidden = true;
  }

  // ---------- 难度切换 ----------
  const modeBtns = Array.from(document.querySelectorAll('.mode'));
  function setMode(next) {
    if (!MODES[next]) return;
    mode = next;
    for (const btn of modeBtns) {
      const active = btn.dataset.mode === mode;
      btn.classList.toggle('on', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    }
    newPuzzle();
  }
  for (const btn of modeBtns) {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  }

  // ---------- 按钮与快捷键 ----------
  $('newBtn').addEventListener('click', newPuzzle);
  $('resetBtn').addEventListener('click', resetBoard);
  undoBtn.addEventListener('click', undo);
  $('ovNext').addEventListener('click', newPuzzle);
  $('ovReplay').addEventListener('click', resetBoard);
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'KeyN') { e.preventDefault(); newPuzzle(); }
    else if (e.code === 'KeyZ') { e.preventDefault(); undo(); }
    else if (e.code === 'KeyR') { e.preventDefault(); resetBoard(); }
  });

  // ---------- 启动 ----------
  setMode('normal');
  })();
  </script>

  <div class="g-alert-mask g-alert-rules open" id="rulesModal" role="dialog" aria-modal="true" aria-label="游戏规则" hidden>
    <div class="g-alert">
      <div class="g-alert-body">
    <h2>游戏规则</h2>

      <h3>玩法</h3>
      <ul>
        <li>点击任意一盏灯，它与上下左右相邻的灯会同时翻转亮灭</li>
        <li>把 5×5 灯阵的灯全部熄灭即通关，步数越少越好</li>
        <li>每关由满盘逆推生成，必定可解；难度越高最优步数越长</li>
        <li>步数恰好等于最优参考即完美通关，各难度最少步数纪录保存在本机</li>
      </ul>
      <h3>操作</h3>
      <ul>
        <li>点击 / 触按灯格翻转灯光</li>
        <li>N：新关卡　Z：撤销　R：重开</li>
        <li>切换难度档会立即开始对应难度的新关卡</li>
      </ul>
      </div>
      <div class="g-alert-actions">
        <button class="g-alert-btn default" id="rulesClose" type="button">好的</button>
      </div>
    </div>
  </div>
<script>
  /* 左上角工具栏：规则弹窗 + 全局音效开关；字体与主站「界面字体」联动（appearance.js 单源） */
  (function () {
    var mask = document.getElementById('rulesModal');
    var rulesBtn = document.getElementById('rulesBtn');
    var closeBtn = document.getElementById('rulesClose');
    var lastFocus = null;
    function openRules() {
      if (!mask || !mask.hidden) return;
      lastFocus = document.activeElement;
      mask.hidden = false;                  // mask 常驻 .open（g-alert open 态），只切 hidden
      if (closeBtn) closeBtn.focus();
    }
    function closeRules() {
      if (!mask || mask.hidden) return;
      mask.hidden = true;
      if (lastFocus && lastFocus.focus) lastFocus.focus();
      lastFocus = null;
    }
    if (rulesBtn) rulesBtn.addEventListener('click', openRules);
    if (closeBtn) closeBtn.addEventListener('click', closeRules);
    if (mask) mask.addEventListener('click', function (e) { if (e.target === mask) closeRules(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && mask && !mask.hidden) { e.stopPropagation(); closeRules(); }
    });

    var sfxBtn = document.getElementById('sfxBtn');
    var SFX_KEY = 'gameSfxMuted';
    function sfxMuted() { try { return localStorage.getItem(SFX_KEY) === '1'; } catch (e) { return false; } }
    function paintSfx() {
      if (!sfxBtn) return;
      var muted = sfxMuted();
      sfxBtn.classList.toggle('is-muted', muted);
      sfxBtn.setAttribute('aria-pressed', String(muted));
      sfxBtn.setAttribute('aria-label', muted ? '开启音效' : '静音');
      var on = sfxBtn.querySelector('.sfx-on'), off = sfxBtn.querySelector('.sfx-off');
      if (on) on.toggleAttribute('hidden', muted);      // SVGElement.hidden 非反射属性，必须 toggleAttribute
      if (off) off.toggleAttribute('hidden', !muted);
    }
    if (sfxBtn) sfxBtn.addEventListener('click', function () {
      try { localStorage.setItem(SFX_KEY, sfxMuted() ? '0' : '1'); } catch (e) {}
      paintSfx();
    });
    window.addEventListener('storage', function (e) { if (e.key === SFX_KEY) paintSfx(); });
    paintSfx();

    try { if (window.SiteAppearance) SiteAppearance.applySiteFontFromStorage(); } catch (e) {}
    window.addEventListener('storage', function (e) {
      if (e.key === 'fontFamily' && window.SiteAppearance) SiteAppearance.applySiteFontFromStorage();
    });
  })();
  </script>
</body>
