<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>推箱子 - 拾光集</title>
  <meta name="description" content="拾光集在线小游戏：推箱子（Sokoban），内置 5 个渐进关卡，支持撤销、步数统计与最佳记录，纯本地运行。">
  <link rel="icon" href="../../favicon.svg">
  <link rel="canonical" href="https://zengzoxiong.github.io/MySite/tools/sokoban/app.html">
  <style>
    /* ===== 推箱子 · 拾光集自建小游戏（纯静态零依赖，固定亮色样式） ===== */
    [hidden] { display: none !important; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f3f6f9;
      color: #4d5d6c;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 26px 16px 40px;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap { width: 100%; max-width: 560px; }

    header { margin-bottom: 14px; }
    h1 { font-size: 30px; color: #3f5568; letter-spacing: 1px; }
    .sub { margin-top: 6px; font-size: 13px; color: #8ba0b2; line-height: 1.7; }

    /* 顶部统计 */
    .hud { display: flex; gap: 10px; margin-bottom: 12px; }
    .stat {
      flex: 1;
      background: #fff;
      border: 1px solid #e2eaf1;
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(90, 120, 150, .10);
    }
    .stat .lab { display: block; font-size: 12px; color: #93a8ba; letter-spacing: 2px; }
    .stat .val {
      display: block; margin-top: 2px; font-size: 22px; font-weight: 700;
      color: #3f5568; font-variant-numeric: tabular-nums;
    }

    /* 关卡切换器 */
    .levels { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .lv-btn {
      flex: 1 1 0;
      min-width: 64px;
      border: 1px solid #e2eaf1;
      background: #fff;
      color: #5c7186;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      padding: 9px 4px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(90, 120, 150, .08);
      touch-action: manipulation;
    }
    .lv-btn .best { display: block; font-size: 11px; font-weight: 400; color: #9db0c0; margin-top: 2px; }
    .lv-btn.active { background: #4f7ea8; border-color: #4f7ea8; color: #fff; }
    .lv-btn.active .best { color: #d7e6f2; }

    /* 棋盘 */
    .board-card {
      background: #fff;
      border: 1px solid #e2eaf1;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 4px 18px rgba(90, 120, 150, .12);
      margin-bottom: 12px;
    }
    .board {
      display: grid;
      gap: 3px;
      width: 100%;
      margin: 0 auto;
      background: #dfe7ee;
      padding: 6px;
      border-radius: 10px;
    }
    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      background: #eef2f6;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cell.wall {
      background: linear-gradient(160deg, #6c7f93, #55677a);
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18), inset 0 2px 0 rgba(255, 255, 255, .14);
    }
    /* 目标点：虚线圆环 */
    .cell.goal::after {
      content: "";
      position: absolute;
      width: 44%;
      height: 44%;
      border-radius: 50%;
      border: 2px dashed #d9a441;
    }
    .cell.goal { background: #f6efe1; }

    /* 箱子与小人（纯 CSS / 内联 SVG，勿用 emoji） */
    .piece {
      position: relative;
      z-index: 1;
      width: 84%;
      height: 84%;
      pointer-events: none;
    }
    .box-face {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      background: #e8a13c;
      border: 2px solid #c07f22;
      box-shadow: inset 0 -7px 0 rgba(0, 0, 0, .12), 0 2px 5px rgba(120, 80, 20, .28);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box-face::before {
      content: "";
      width: 52%;
      height: 52%;
      border: 2px solid rgba(255, 255, 255, .55);
      border-radius: 4px;
    }
    .cell.done .box-face {
      background: #51b073;
      border-color: #2f8b52;
      box-shadow: inset 0 -7px 0 rgba(0, 0, 0, .14), 0 2px 5px rgba(40, 110, 70, .3);
    }
    .cell.done .box-face::before { border-color: rgba(255, 255, 255, .7); }

    /* 控制区 */
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .btn {
      border: 0;
      background: #4f7ea8;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      padding: 11px 18px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(79, 126, 168, .35);
      touch-action: manipulation;
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: #3f9d6d; }
    .btn.ghost { background: #fff; color: #4f7ea8; border: 1px solid #cfe0ee; box-shadow: 0 2px 8px rgba(90, 120, 150, .1); }

    /* 屏幕方向按钮（手机端） */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(3, 58px);
      gap: 8px;
      margin: 0 auto;
    }
    .dpad .btn-d {
      border: 0;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #d5e2ed;
      color: #4f7ea8;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(90, 120, 150, .14);
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad .btn-d:active { transform: translateY(1px); background: #eaf2f8; }
    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .mid { grid-column: 2; grid-row: 2; background: #eef4f9; cursor: default; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 3; }
    .dpad .btn-d svg { width: 26px; height: 26px; }

    /* 提示 / 说明 */
    .tips {
      background: #fff;
      border: 1px solid #e2eaf1;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.9;
      color: #6b7f91;
      box-shadow: 0 2px 10px rgba(90, 120, 150, .08);
      margin-bottom: 14px;
    }
    .tips h2 { font-size: 15px; color: #3f5568; margin-bottom: 4px; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 8px; }
    .legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .sw { width: 22px; height: 22px; border-radius: 5px; flex: none; }
    .sw.wall { background: linear-gradient(160deg, #6c7f93, #55677a); }
    .sw.goal { background: #f6efe1; border: 1px solid #e2d6bb; position: relative; }
    .sw.goal::after {
      content: ""; position: absolute; inset: 0; margin: auto;
      width: 44%; height: 44%; border-radius: 50%; border: 2px dashed #d9a441;
    }
    .sw.box { background: #e8a13c; border: 2px solid #c07f22; }
    .sw.box-ok { background: #51b073; border: 2px solid #2f8b52; }
    .sw.player { background: #eef2f6; display: flex; align-items: center; justify-content: center; }
    .sw.player svg { width: 18px; height: 18px; }

    /* 通关庆祝弹层 */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(52, 70, 86, .45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .modal-card {
      background: #fff;
      border-radius: 18px;
      padding: 26px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(40, 60, 80, .3);
    }
    .modal-card h2 { font-size: 24px; color: #3f9d6d; margin-bottom: 10px; }
    .modal-card .msg { font-size: 14px; color: #6b7f91; line-height: 1.9; }
    .modal-card .msg b { color: #3f5568; font-size: 18px; font-variant-numeric: tabular-nums; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions .btn { flex: 1; padding: 11px 8px; font-size: 14px; }

    footer {
      text-align: center;
      font-size: 12px;
      color: #a7b8c6;
      padding: 6px 0 2px;
    }

    @media (max-width: 420px) {
      h1 { font-size: 25px; }
      .stat .val { font-size: 19px; }
      .board { gap: 2px; padding: 4px; }
    }
  </style>

    <style>
    /* ===== 右侧规则栏（可收起）=====
       展开时 body 右侧让出面板位，游戏本体居左；收起后仅剩「玩法」竖标签。
       展开偏好存 localStorage，跨游戏页记忆。 */
    .rules-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 272px;
      overflow: visible; /* 把手挂在面板左缘外侧，滚动收进内层 .rules-scroll */
      background: #fff;
      border-left: 1px solid #d7dee8;
      box-shadow: -6px 0 22px rgba(60, 90, 130, .10);
      z-index: 190;
      transform: translateX(0);
      transition: transform .28s cubic-bezier(.22, .9, .3, 1);
      color: #5c7186;
      font: 400 13px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .rules-panel.closed { transform: translateX(100%); }
    /* 规则内容滚动区（面板本体必须 overflow:visible，只能在内层滚） */
    .rules-scroll {
      height: 100%;
      overflow-y: auto;
      padding: 20px 18px;
      box-sizing: border-box;
    }
    .rules-panel h2 {
      font-size: 15px;
      color: #3f5568;
      margin: 0 0 12px;
    }
    .rules-panel h3 {
      font-size: 12.5px;
      color: #4a6f9e;
      margin: 14px 0 4px;
      letter-spacing: 1px;
    }
    .rules-panel ul { margin: 0; padding-left: 18px; }
    .rules-panel li { margin: 4px 0; }
    /* 柜门式把手：挂在面板最左侧中间，随面板滑出滑入 */
    .rules-handle {
      position: absolute;
      left: -30px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 116px;
      padding: 0;
      border: 1px solid #d7dee8;
      border-right: none;
      border-radius: 12px 0 0 12px;
      background: #fff;
      box-shadow: -4px 0 14px rgba(60, 90, 130, .10);
      color: #4a6f9e;
      font: 600 13px/1 inherit;
      letter-spacing: 3px;
      writing-mode: vertical-lr;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .rules-handle:active { transform: translateY(-50%) scale(.96); }
    body { transition: padding-right .28s cubic-bezier(.22, .9, .3, 1); }
    @media (min-width: 1100px) {
      body.rules-open { padding-right: 272px; }
    }
    /* 窄屏：面板变覆盖抽屉，游戏本体不动 */
    @media (max-width: 560px) {
      .rules-panel { width: min(272px, 82vw); }
    }
    </style>
</head>
<body>
    <a class="back-home" href="../../index.html" aria-label="返回拾光集主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>返回主页</a>

  <div class="wrap">
    <header>
      <h1>推箱子</h1>
      <p class="sub">把所有木箱推到目标点即可过关。箱子只能推、不能拉，推到墙角可就动不了了。内置 5 个渐进关卡，支持撤销与最佳步数记录。</p>
    </header>

    <!-- 统计 -->
    <div class="hud">
      <div class="stat"><span class="lab">步数</span><span class="val" id="movesVal">0</span></div>
      <div class="stat"><span class="lab">推动</span><span class="val" id="pushesVal">0</span></div>
      <div class="stat"><span class="lab">最佳</span><span class="val" id="bestVal">--</span></div>
    </div>

    <!-- 关卡切换器 -->
    <div class="levels" id="levelBar"></div>

    <!-- 棋盘 -->
    <div class="board-card">
      <div class="board" id="board" aria-label="推箱子棋盘"></div>
    </div>

    <!-- 操作按钮 -->
    <div class="controls">
      <button class="btn ghost" id="undoBtn" type="button">撤销一步（U）</button>
      <button class="btn ghost" id="restartBtn" type="button">重玩本关（R）</button>
    </div>

    <!-- 手机端方向按钮 -->
    <div class="dpad" aria-label="方向控制">
      <button class="btn-d up" type="button" data-dir="up" aria-label="向上">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l7 9H5z" fill="currentColor"/></svg>
      </button>
      <button class="btn-d left" type="button" data-dir="left" aria-label="向左">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l9-7v14z" fill="currentColor"/></svg>
      </button>
      <div class="btn-d mid" aria-hidden="true"></div>
      <button class="btn-d right" type="button" data-dir="right" aria-label="向右">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12l-9 7V5z" fill="currentColor"/></svg>
      </button>
      <button class="btn-d down" type="button" data-dir="down" aria-label="向下">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19l-7-9h14z" fill="currentColor"/></svg>
      </button>
    </div>

    <!-- 玩法说明 -->
    <div class="tips">
      <h2>图例</h2>
      <div class="legend">
        <div class="item"><span class="sw wall"></span>墙</div>
        <div class="item"><span class="sw goal"></span>目标点</div>
        <div class="item"><span class="sw box"></span>木箱</div>
        <div class="item"><span class="sw box-ok"></span>箱子已到位</div>
        <div class="item">
          <span class="sw player">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="20" cy="14" r="7" fill="#4f7ea8"/>
              <path d="M8 34c0-6.6 5.4-12 12-12s12 5.4 12 12z" fill="#4f7ea8"/>
            </svg>
          </span>
          小人
        </div>
      </div>
    </div>

    <footer>拾光集 · 在线小游戏</footer>
  </div>

  <!-- 通关庆祝弹层 -->
  <div class="modal" id="winModal" hidden>
    <div class="modal-card">
      <h2 id="winTitle">通关啦</h2>
      <div class="msg" id="winMsg"></div>
      <div class="modal-actions">
        <button class="btn primary" id="winNextBtn" type="button">下一关</button>
        <button class="btn ghost" id="winRetryBtn" type="button">重玩本关</button>
        <button class="btn ghost" id="winCloseBtn" type="button">关闭</button>
      </div>
    </div>
  </div>

  <script>
    /* ================= 推箱子 · 游戏逻辑 =================
       地图字符：# 墙、$ 箱子、. 目标点、@ 小人、* 箱子在目标上、& 小人在目标上、空格 地板 */

    // 五个渐进关卡（最小步数经求解器验证：2 / 12 / 16 / 24 / 42）
    const LEVELS = [
      {
        name: "第 1 关 · 教学",
        map: [
          "########",
          "#      #",
          "#  .   #",
          "#      #",
          "#  $   #",
          "# @    #",
          "########"
        ]
      },
      {
        name: "第 2 关 · 双箱",
        map: [
          "#########",
          "# .   . #",
          "#       #",
          "# $   $ #",
          "#   @   #",
          "#       #",
          "#########"
        ]
      },
      {
        name: "第 3 关 · 拐角",
        map: [
          "##########",
          "# .    . #",
          "#        #",
          "#  ##    #",
          "# $   $  #",
          "#   @    #",
          "##########"
        ]
      },
      {
        name: "第 4 关 · 三箱",
        map: [
          "###########",
          "# .  .  . #",
          "#         #",
          "#   # #   #",
          "#  $ $ $  #",
          "#    @    #",
          "###########"
        ]
      },
      {
        name: "第 5 关 · 终极",
        map: [
          "#############",
          "# .  .  .  .#",
          "#           #",
          "#           #",
          "#           #",
          "# $  $  $  $#",
          "#           #",
          "#     @     #",
          "#############"
        ]
      }
    ];

    // 当前关卡状态
    let levelIdx = 0;
    let rows = 0, cols = 0;
    let walls = new Set();      // 墙坐标集合
    let goals = new Set();      // 目标点坐标集合
    let boxes = [];             // 箱子坐标数组
    let player = { r: 0, c: 0 };
    let moves = 0, pushes = 0;
    let undoStack = [];
    let won = false;

    const boardEl = document.getElementById('board');
    const movesVal = document.getElementById('movesVal');
    const pushesVal = document.getElementById('pushesVal');
    const bestVal = document.getElementById('bestVal');
    const levelBar = document.getElementById('levelBar');
    const winModal = document.getElementById('winModal');

    /* ---------- localStorage 读写（带 slug 前缀，包 try/catch） ---------- */
    function bestKey(n) { return 'sokoban_best_' + n; }
    function loadBest(n) {
      try {
        const v = localStorage.getItem(bestKey(n));
        return v === null ? null : parseInt(v, 10);
      } catch (e) { return null; }
    }
    function saveBest(n, val) {
      try { localStorage.setItem(bestKey(n), String(val)); } catch (e) { /* 隐私模式下忽略 */ }
    }

    /* ---------- 关卡解析 ---------- */
    function key(r, c) { return r + ',' + c; }
    function parseLevel(idx) {
      const map = LEVELS[idx].map;
      rows = map.length;
      cols = Math.max.apply(null, map.map(function (s) { return s.length; }));
      walls = new Set();
      goals = new Set();
      boxes = [];
      for (let r = 0; r < rows; r++) {
        const line = map[r];
        for (let c = 0; c < cols; c++) {
          const ch = line[c] || ' ';
          if (ch === '#') walls.add(key(r, c));
          else if (ch === '.') goals.add(key(r, c));
          else if (ch === '$') boxes.push({ r: r, c: c });
          else if (ch === '*') { boxes.push({ r: r, c: c }); goals.add(key(r, c)); }
          else if (ch === '@') player = { r: r, c: c };
          else if (ch === '&') { player = { r: r, c: c }; goals.add(key(r, c)); }
        }
      }
      moves = 0;
      pushes = 0;
      undoStack = [];
      won = false;
    }

    /* ---------- 渲染（CSS 网格 + 内联 SVG / 纯 CSS 图形） ---------- */
    function playerSvg() {
      return '<svg class="piece" viewBox="0 0 40 40" aria-hidden="true">' +
        '<circle cx="20" cy="14" r="7" fill="#4f7ea8"/>' +
        '<path d="M8 34c0-6.6 5.4-12 12-12s12 5.4 12 12z" fill="#4f7ea8"/></svg>';
    }
    function render() {
      boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
      boardEl.style.maxWidth = 'calc(' + cols + ' * 52px)';
      const boxMap = new Map();
      boxes.forEach(function (b) { boxMap.set(key(b.r, b.c), true); });
      let html = '';
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const k = key(r, c);
          let cls = 'cell';
          if (walls.has(k)) cls += ' wall';
          if (goals.has(k)) cls += ' goal';
          const hasBox = boxMap.has(k);
          if (hasBox && goals.has(k)) cls += ' done';
          html += '<div class="' + cls + '">';
          if (hasBox) html += '<div class="piece"><div class="box-face"></div></div>';
          else if (player.r === r && player.c === c) html += playerSvg();
          html += '</div>';
        }
      }
      boardEl.innerHTML = html;
      movesVal.textContent = moves;
      pushesVal.textContent = pushes;
      const best = loadBest(levelIdx + 1);
      bestVal.textContent = best === null ? '--' : best;
    }

    /* ---------- 关卡切换器 ---------- */
    function renderLevelBar() {
      let html = '';
      for (let i = 0; i < LEVELS.length; i++) {
        const best = loadBest(i + 1);
        html += '<button class="lv-btn' + (i === levelIdx ? ' active' : '') + '" type="button" data-lv="' + i + '">' +
          '第 ' + (i + 1) + ' 关' +
          '<span class="best">' + (best === null ? '暂无记录' : '最佳 ' + best + ' 步') + '</span></button>';
      }
      levelBar.innerHTML = html;
    }
    levelBar.addEventListener('click', function (e) {
      const btn = e.target.closest('.lv-btn');
      if (!btn) return;
      loadLevel(parseInt(btn.dataset.lv, 10));
    });

    /* ---------- 移动与撤销 ---------- */
    function isWall(r, c) { return walls.has(key(r, c)); }
    function boxIndexAt(r, c) {
      for (let i = 0; i < boxes.length; i++) {
        if (boxes[i].r === r && boxes[i].c === c) return i;
      }
      return -1;
    }
    function move(dr, dc) {
      if (won) return;
      const nr = player.r + dr, nc = player.c + dc;
      if (isWall(nr, nc)) return;
      const bi = boxIndexAt(nr, nc);
      let willPush = false;
      if (bi >= 0) {
        const br = nr + dr, bc = nc + dc;
        if (isWall(br, bc) || boxIndexAt(br, bc) >= 0) return;
        willPush = true;
      }
      // 快照入撤销栈
      undoStack.push({
        player: { r: player.r, c: player.c },
        boxes: boxes.map(function (b) { return { r: b.r, c: b.c }; }),
        moves: moves,
        pushes: pushes
      });
      if (undoStack.length > 500) undoStack.shift();
      if (willPush) {
        boxes[bi] = { r: nr + dr, c: nc + dc };
        pushes++;
      }
      player = { r: nr, c: nc };
      moves++;
      render();
      checkWin();
    }
    function undo() {
      if (won || undoStack.length === 0) return;
      const st = undoStack.pop();
      player = st.player;
      boxes = st.boxes;
      moves = st.moves;
      pushes = st.pushes;
      render();
    }

    /* ---------- 胜负判定与庆祝 ---------- */
    function checkWin() {
      for (let i = 0; i < boxes.length; i++) {
        if (!goals.has(key(boxes[i].r, boxes[i].c))) return;
      }
      won = true;
      const levelNo = levelIdx + 1;
      const prev = loadBest(levelNo);
      const isNew = prev === null || moves < prev;
      if (isNew) saveBest(levelNo, moves);
      renderLevelBar();

      document.getElementById('winTitle').textContent =
        levelIdx === LEVELS.length - 1 ? '全部通关' : '通关啦';
      let msg = '本关用 <b>' + moves + '</b> 步、推动 <b>' + pushes + '</b> 次完成。<br>';
      if (isNew) msg += '刷新最佳记录：' + moves + ' 步。';
      else msg += '历史最佳：' + prev + ' 步，再接再厉。';
      if (levelIdx === LEVELS.length - 1) {
        msg += '<br>五个关卡全部通过，你已经掌握推箱子的精髓。';
      }
      document.getElementById('winMsg').innerHTML = msg;
      document.getElementById('winNextBtn').hidden = levelIdx === LEVELS.length - 1;
      winModal.hidden = false;
      render();
    }
    function closeWin() { winModal.hidden = true; }

    /* ---------- 载入关卡 ---------- */
    function loadLevel(idx) {
      levelIdx = idx;
      parseLevel(idx);
      renderLevelBar();
      render();
      closeWin();
    }

    /* ---------- 事件绑定 ---------- */
    // 键盘：方向键 / WASD 移动，U 撤销，R 重玩
    window.addEventListener('keydown', function (e) {
      const k = e.key.toLowerCase();
      const dirs = {
        arrowup: [-1, 0], w: [-1, 0],
        arrowdown: [1, 0], s: [1, 0],
        arrowleft: [0, -1], a: [0, -1],
        arrowright: [0, 1], d: [0, 1]
      };
      if (dirs[k]) {
        e.preventDefault();
        move(dirs[k][0], dirs[k][1]);
      } else if (k === 'u') {
        e.preventDefault();
        undo();
      } else if (k === 'r') {
        e.preventDefault();
        loadLevel(levelIdx);
      } else if (k === 'escape') {
        closeWin();
      }
    });

    // 屏幕方向按钮
    document.querySelectorAll('.dpad .btn-d[data-dir]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const map = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
        const d = map[btn.dataset.dir];
        move(d[0], d[1]);
      });
    });

    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('restartBtn').addEventListener('click', function () { loadLevel(levelIdx); });
    document.getElementById('winNextBtn').addEventListener('click', function () {
      if (levelIdx < LEVELS.length - 1) loadLevel(levelIdx + 1);
    });
    document.getElementById('winRetryBtn').addEventListener('click', function () { loadLevel(levelIdx); });
    document.getElementById('winCloseBtn').addEventListener('click', closeWin);

    /* ---------- 启动 ---------- */
    loadLevel(0);
  </script>
  <aside class="rules-panel" id="rulesPanel" role="complementary" aria-label="游戏规则">
    <button class="rules-handle" id="rulesHandle" type="button">玩法</button>
    <div class="rules-scroll">
    <h2>游戏规则</h2>
    
      <h3>玩法</h3>
      <ul>
        <li>把所有木箱推到金色虚线目标点上即可过关</li>
        <li>箱子只能推、不能拉，推到墙角可就动不了了</li>
        <li>内置 5 个渐进关卡，每关记录最佳步数</li>
      </ul>
      <h3>操作</h3>
      <ul>
        <li>方向键 / WASD：移动　U：撤销一步　R：重玩本关</li>
        <li>手机端用屏幕方向按钮</li>
      </ul>
    </div>
  </aside>
  <script>
  (function () {
    var panel = document.getElementById('rulesPanel');
    var handle = document.getElementById('rulesHandle');
    var saved = null;
    try { saved = localStorage.getItem('gameRulesOpen'); } catch (e) { }
    var open = saved === null ? window.innerWidth >= 1100 : saved === '1';
    function apply() {
      panel.classList.toggle('closed', !open);
      handle.textContent = open ? '收起' : '玩法';
      handle.setAttribute('aria-label', open ? '收起游戏规则' : '展开游戏规则');
      document.body.classList.toggle('rules-open', open && window.innerWidth >= 1100);
    }
    handle.addEventListener('click', function () {
      open = !open;
      try { localStorage.setItem('gameRulesOpen', open ? '1' : '0'); } catch (e) { }
      apply();
    });
    window.addEventListener('resize', apply);
    apply();
  })();
  </script>
</body>
</html>
