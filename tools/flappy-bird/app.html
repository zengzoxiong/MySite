<style>
/* 拾光集 · 跳跳鸟页面样式
   组件基线来自共享设计系统 assets/game-ui.css（Apple HIG），
   此处只声明个性色与游戏私有视觉，画布内的场景绘制保持原样。 */
*{margin:0;padding:0;box-sizing:border-box}

:root {
  /* 黄系个性色（规范 §7.1）：实心底上的文字、强调色文字改深色，保证 4.5:1 对比度 */
  --game-accent: #FFCC00;
  --game-on-accent: #1C1C1E;
  --game-accent-text: #8A6100;
}
@media (prefers-color-scheme: dark) {
  /* 深色页面背景为纯黑，浅色的深字/深强调色必须复位（规范 §7.1） */
  :root {
    --game-on-accent: #FFFFFF;
    --game-accent-text: var(--game-accent);
  }
}

/* 游戏舞台：480px 台面居中，圆角裁切，指针提示可点击扇翅 */
.g-stage {
  max-width: 480px;
  margin: 0 auto;
  overflow: hidden;
  border-radius: var(--radius);
  cursor: pointer;
}
/* 画布保持 360×560 逻辑分辨率比例（高分屏由脚本放大位图） */
.g-stage canvas { aspect-ratio: 360 / 560; }

/* 结算层大数字（展示层类 .big）：展示字体 + 等宽数字 + 强调色文字 */
.g-overlay .big {
  font-family: var(--font-display);
  font-size: 46px;
  font-weight: 800;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
  color: var(--game-accent-text);
}
</style>
</head>

<script>
(function () {
'use strict';

/* ================= 基本常量 ================= */
var W = 360, H = 560;                 // 逻辑分辨率
var GROUND_H = 64, GROUND_Y = H - GROUND_H;
var GRAVITY = 1900;                   // 重力加速度（像素 / 秒^2）
var FLAP_VY = -480;                   // 扇翅瞬间的竖直速度
var MAX_FALL = 720;                   // 最大下落速度
var PIPE_W = 62;                      // 管道宽度
var GAP_START = 158, GAP_MIN = 112;   // 缝隙高度：初始 / 下限
var SPACING = 212;                    // 相邻两对管道的水平间距
var SPEED_START = 145, SPEED_MAX = 265;
var BIRD_X = 92, BIRD_R = 13;         // 小鸟横坐标与碰撞半径

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var stage = document.getElementById('stage');
var ov = document.getElementById('ov');
var elScore = document.getElementById('score');
var elBest = document.getElementById('best');
var aiBtn = document.getElementById('aiBtn');
var aiTag = document.getElementById('aiTag');

/* 高分屏适配：物理像素放大，绘制坐标仍按逻辑分辨率 */
(function fit() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr;
  cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
})();

/* ================= 最高分（带 slug 前缀，读写均包 try/catch） ================= */
var BEST_KEY = 'flappy-bird_best';
var best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }

/* ================= 界面状态（渲染层） ================= */
var state = 'ready';   // ready | playing | dying | over | paused
var clouds = [];
var groundOff = 0;     // 地面花纹滚动偏移
var dieT = 0;          // 死亡坠落计时
var overGuard = 0;     // 结束界面输入保护期，防手滑立刻重开
var aiOn = false;      // AI 代玩开关

/* ================= 游戏核心状态 G =================
   玩法数据全部收在 G 里，由下方纯函数读写；渲染层只读不写。 */
var G = null;

function newCloud(x) {
  return { x: x, y: 26 + Math.random() * 150, s: 0.7 + Math.random() * 0.9, v: 12 + Math.random() * 14 };
}
function resetClouds() {
  clouds = [];
  for (var i = 0; i < 4; i++) clouds.push(newCloud(Math.random() * W));
}

/* ================= 难度曲线（纯函数） ================= */
/* 分数越高缝隙越窄、速度越快 */
function gapNow(score) { return Math.max(GAP_MIN, GAP_START - score * 1.8); }
function speedNow(score) { return Math.min(SPEED_MAX, SPEED_START + score * 3.2); }

/* ================= 纯函数核心（渲染无关；与 ai-sim.mjs 同名实现保持一致） =================
   约定：不读写任何 DOM；随机源 rng 由调用方注入（页面传 Math.random，模拟脚本传种子随机）。
   G 结构：
   { bird: { y, vy, rot/wing/boost 纯装饰 }, pipes: [{ x, gapY, gap, scored }], score } */
function spawnPipeCore(c, x, rng) {
  var gap = gapNow(c.score);
  var lastY = c.pipes.length ? c.pipes[c.pipes.length - 1].gapY : H * 0.45;
  var minY = gap / 2 + 56, maxY = GROUND_Y - gap / 2 - 40;
  /* 缝隙中心相对上一根随机偏移，限制幅度避免出现够不着的跳变 */
  var gy = lastY + (rng() * 2 - 1) * 120;
  gy = Math.max(minY, Math.min(maxY, gy));
  c.pipes.push({ x: x, gapY: gy, gap: gap, scored: false });
}

function freshCore(rng) {
  var c = {
    bird: {
      y: H * 0.42, vy: 0,
      /* ↓ 以下为纯装饰字段，不影响玩法（模拟脚本省略） */
      rot: 0, wing: 0, boost: 0
    },
    pipes: [],
    score: 0
  };
  spawnPipeCore(c, W + 90, rng);
  return c;
}

/* 扇翅：瞬间给向上速度 */
function flapCore(c) { c.bird.vy = FLAP_VY; }

/* 圆与矩形相交（小鸟碰撞体略微缩小，手感更宽容） */
function circleRect(cx, cy, cr, rx, ry, rw, rh) {
  var nx = Math.max(rx, Math.min(cx, rx + rw));
  var ny = Math.max(ry, Math.min(cy, ry + rh));
  var dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < cr * cr;
}

function hitPipeCore(c) {
  var r = BIRD_R - 2;
  for (var i = 0; i < c.pipes.length; i++) {
    var p = c.pipes[i];
    if (p.x > BIRD_X + r || p.x + PIPE_W < BIRD_X - r) continue;
    var topH = p.gapY - p.gap / 2;
    var botY = p.gapY + p.gap / 2;
    if (circleRect(BIRD_X, c.bird.y, r, p.x, 0, PIPE_W, topH)) return true;
    if (circleRect(BIRD_X, c.bird.y, r, p.x, botY, PIPE_W, GROUND_Y - botY)) return true;
  }
  return false;
}

/* 核心单步推进：改写 c 并返回 { died, scored } */
function stepCore(c, dt, rng) {
  var res = { died: false, scored: 0 };
  var b = c.bird;

  /* 小鸟物理 */
  b.vy = Math.min(MAX_FALL, b.vy + GRAVITY * dt);
  b.y += b.vy * dt;
  if (b.y < BIRD_R + 2) { b.y = BIRD_R + 2; b.vy = Math.max(b.vy, 0); } /* 撞顶不死，贴顶滑行 */

  /* 管道推进、生成、计分与清理 */
  var sp = speedNow(c.score);
  for (var j = 0; j < c.pipes.length; j++) c.pipes[j].x -= sp * dt;
  if (c.pipes[c.pipes.length - 1].x < W - SPACING) {
    spawnPipeCore(c, c.pipes[c.pipes.length - 1].x + SPACING, rng);
  }
  for (var k = 0; k < c.pipes.length; k++) {
    var p = c.pipes[k];
    if (!p.scored && p.x + PIPE_W < BIRD_X - BIRD_R) { p.scored = true; c.score++; res.scored++; }
  }
  while (c.pipes.length && c.pipes[0].x + PIPE_W < -80) c.pipes.shift();

  /* 碰撞检测 */
  if (b.y + BIRD_R >= GROUND_Y) { b.y = GROUND_Y - BIRD_R; res.died = true; }
  else if (hitPipeCore(c)) res.died = true;
  return res;
}

/* ================= AI 决策（纯函数；与 ai-sim.mjs 同名实现保持一致） =================
   思路（束搜索轨迹规划）：每 replan 秒滚动规划一次——以 1/60 秒为步，
   对「下一管道窗口 + 再下一管入场」逐帧推演「扇 / 不扇」两条分支：
   撞管、落地、或到下一窗口入场时赶不进安全带的分支提前判死（死得越晚
   代价越低）；可行分支按管道窗口内偏离缺口中心、扇翅次数计代价，取
   代价最小者执行其首个扇翅时刻。换管必须的俯冲/急升瞬态发生在两管
   之间的开放空域，该处不计偏离代价，避免物理上必要的轨迹被线性目标
   误剪；赶不上入场的谱系用「连扇 ≈448px/s 爬升 / 自由落体」可达包络
   提前剪除，防止死路在平价排序里挤占束位。 */
var AI_CFG = {
  step: 1 / 60,      // 推演步长（秒）
  beam: 32,          // 束宽（并行保留的轨迹数）
  horizon: 1.5,      // 推演总时长上限（秒）
  qAhead: 0.25,      // 新管道入场后继续推演的时长（秒）
  wFlap: 1.2,        // 每次扇翅的固定代价
  wDev: 0.03,        // 管道窗口内每步每像素偏离缺口中心的代价
  wVy: 0.02,         // 终端竖直速度代价
  wEnd: 0.06,        // 终端高度偏离代价
  margin: 2,         // 安全带收缩（px，容忍时序抖动）
  edge: 14,          // 目标点距安全带边缘的最小距离（px）
  replan: 0.2,       // 重规划周期（秒）
  cruise: 0.42       // 无管道时的巡航高度系数（×H）
};

/* 下一根需要穿过的管道（尚未完全越过小鸟的那根） */
function aiNextPipe(c) {
  for (var i = 0; i < c.pipes.length; i++) {
    var p = c.pipes[i];
    if (p.x + PIPE_W > BIRD_X - BIRD_R) return p;
  }
  return null;
}

/* 束搜索规划：返回 { t0, flaps（相对 t0 的扇翅时刻表，秒）, nextReplan } */
function aiPlan(c) {
  var p = aiNextPipe(c);
  var sp = speedNow(c.score);
  var r = BIRD_R - 2;
  var ceilY = BIRD_R + 2, floorY = GROUND_Y - BIRD_R;
  var step = AI_CFG.step;
  var tInP = 0, tOutP = -1, tInQ = Infinity, tOutQ = Infinity, q = null;
  var pLo = 0, pHi = 0, qLo = 0, qHi = 0;
  if (p) {
    tInP = Math.max(0, (p.x - BIRD_X - r) / sp);
    tOutP = (p.x + PIPE_W - BIRD_X + r) / sp;
    pLo = p.gapY - p.gap / 2 + r + AI_CFG.margin;
    pHi = p.gapY + p.gap / 2 - r - AI_CFG.margin;
    var idx = c.pipes.indexOf(p);
    if (idx + 1 < c.pipes.length) {
      q = c.pipes[idx + 1];
      tInQ = (q.x - BIRD_X - r) / sp;
      tOutQ = (q.x + PIPE_W - BIRD_X + r) / sp;
      qLo = q.gapY - q.gap / 2 + r + AI_CFG.margin;
      qHi = q.gapY + q.gap / 2 - r - AI_CFG.margin;
    }
  }
  var tEnd = Math.min(AI_CFG.horizon, isFinite(tInQ) ? tInQ + AI_CFG.qAhead : Math.max(tOutP, 0) + 0.6);
  var nSteps = Math.max(1, Math.ceil(tEnd / step - 1e-9));

  /* 每步安全带与目标高度：数组按步末时刻索引，与帧末碰撞检测对齐；
     目标沿「p 中心 → q 中心」斜坡过渡并钳在安全带内距边缘 edge 处 */
  var qG = q ? q.gapY : (p ? p.gapY : H * AI_CFG.cruise);
  var cruiseY = H * AI_CFG.cruise;
  var lo = new Float64Array(nSteps), hi = new Float64Array(nSteps), ctr = new Float64Array(nSteps), soft = new Float64Array(nSteps);
  for (var k = 0; k < nSteps; k++) {
    var t = (k + 1) * step;
    var bandLo = ceilY, bandHi = floorY, inWin = false;
    if (p && t >= tInP && t < tOutP) {
      bandLo = pLo; bandHi = pHi; inWin = true;
    } else if (q && t >= tInQ && t < tOutQ) {
      bandLo = qLo; bandHi = qHi; inWin = true;
    }
    lo[k] = bandLo; hi[k] = bandHi;
    /* 偏离代价只在管道窗口内生效：换管必须的俯冲/急升瞬态不罚 */
    soft[k] = inWin ? 1 : 0;
    var aimFrom = p ? p.gapY : cruiseY;
    var aimTo = q ? qG : cruiseY;
    var s = 0;
    if (q && isFinite(tInQ)) s = Math.max(0, Math.min(1, (t - tInP) / (tInQ - tInP)));
    else if (!p) s = 1;
    else if (t > tInP) s = Math.min(1, (t - tInP) / ((tOutP - tInP) + 0.6));
    var ramp = aimFrom + (aimTo - aimFrom) * s;
    var pad = Math.min(AI_CFG.edge, Math.max(0, (bandHi - bandLo) / 2));
    ctr[k] = Math.max(bandLo + pad, Math.min(bandHi - pad, ramp));
  }

  /* 下一窗口入场信息（可达性剪枝用） */
  function nextWin(t) {
    if (p && t < tInP) return { T: tInP - t, lo: pLo, hi: pHi };
    if (q && isFinite(tInQ) && t < tInQ) return { T: tInQ - t, lo: qLo, hi: qHi };
    return null;
  }
  /* 从 (y, vy) 出发 T 秒后能否进入 [lo, hi]：连扇 ≈448px/s 爬升与自由落体的可达包络 */
  function reachOk(y, vy, T, w) {
    var yBot;
    if (vy + GRAVITY * T <= MAX_FALL) yBot = y + vy * T + 0.5 * GRAVITY * T * T;
    else {
      var tc = (MAX_FALL - vy) / GRAVITY;
      yBot = y + vy * tc + 0.5 * GRAVITY * tc * tc + MAX_FALL * (T - tc);
    }
    var yTop = Math.max(ceilY, y - 448 * T);
    return yTop <= w.hi + 1 && yBot >= w.lo - 1;
  }

  var DEATH = 1e6, DEATH_SLOPE = 500;
  /* 状态用父指针串起扇翅历史，搜索期间不拼数组，结束后回溯 */
  var beam = [{ y: c.bird.y, vy: c.bird.vy, cost: 0, dead: false, prev: null, flapT: -1 }];
  var next = new Array(2 * AI_CFG.beam);
  for (var k2 = 0; k2 < nSteps; k2++) {
    var n = 0;
    for (var bi = 0; bi < beam.length; bi++) {
      var st = beam[bi];
      for (var a = 0; a < 2; a++) {
        if (st.dead && a) continue;
        var y = st.y, vy = a ? FLAP_VY : st.vy;
        var cost = st.cost + (a ? AI_CFG.wFlap : 0);
        var dead = st.dead;
        if (!dead) {
          vy = Math.min(MAX_FALL, vy + GRAVITY * step);
          y += vy * step;
          if (y < ceilY) { y = ceilY; vy = Math.max(vy, 0); }
          if (y >= floorY || y < lo[k2] || y > hi[k2]) {
            dead = true;
            cost += DEATH + (nSteps - k2 - 1) * DEATH_SLOPE;
          } else {
            cost += AI_CFG.wDev * soft[k2] * Math.abs(y - ctr[k2]);
            /* 可达性剪枝：到下一窗口入场时赶不进安全带的谱系提前判死 */
            var w = nextWin((k2 + 1) * step);
            if (w && w.T > step && !reachOk(y, vy, w.T, w)) {
              dead = true;
              cost += DEATH + (nSteps - k2 - 1) * DEATH_SLOPE;
            }
          }
        }
        next[n++] = { y: y, vy: vy, cost: cost, dead: dead, prev: st, flapT: a ? k2 * step : -1 };
      }
    }
    if (!n) break;
    next.length = n;
    next.sort(function (x, z) { return x.cost - z.cost; });
    beam = next.slice(0, AI_CFG.beam);
  }
  /* 终端代价：贴近下一目标中心、速度温和 */
  for (var i2 = 0; i2 < beam.length; i2++) {
    var st2 = beam[i2];
    if (!st2.dead) st2.cost += AI_CFG.wEnd * Math.abs(st2.y - ctr[nSteps - 1]) + AI_CFG.wVy * Math.abs(st2.vy);
  }
  beam.sort(function (x, z) { return x.cost - z.cost; });
  /* 回溯最优轨迹的扇翅时刻表 */
  var flaps = [];
  for (var st3 = beam[0]; st3; st3 = st3.prev) if (st3.flapT >= 0) flaps.unshift(st3.flapT);
  return { t0: c.aiT, flaps: flaps, nextReplan: c.aiT + AI_CFG.replan };
}

/* 每帧决策：到期就取计划里的下一个扇翅时刻；到重规划周期就滚动重规划 */
function aiShouldFlap(c, dt) {
  if (c.aiT === undefined) { c.aiT = 0; c.aiPlan = null; }
  c.aiT += dt;
  if (!c.aiPlan || c.aiT >= c.aiPlan.nextReplan) c.aiPlan = aiPlan(c);
  var pl = c.aiPlan;
  if (pl.flaps.length && c.aiT >= pl.t0 + pl.flaps[0] - 1e-9) {
    pl.flaps.shift();
    return true;
  }
  return false;
}

/* ================= HUD 与覆盖层 ================= */
function syncHud() { elScore.textContent = G.score; elBest.textContent = best; }
function showOverlay(html) { ov.innerHTML = html; ov.hidden = false; }
function hideOverlay() { ov.hidden = true; }

function showStart() {
  showOverlay(
    '<h2 class="g-overlay-title">跳跳鸟</h2>' +
    '<p class="g-overlay-text">穿过成对管道缝隙得分<br>撞上管道或落地即结束</p>' +
    '<button type="button" class="g-alert-btn default">开始游戏</button>' +
    '<p class="g-overlay-text">点击画面 / 空格键 扇翅<br>也可点击「AI 代玩」按钮由 AI 自动游玩</p>'
  );
}
function showPause() {
  showOverlay('<h2 class="g-overlay-title">已暂停</h2><p class="g-overlay-text">点击画面或按空格继续</p>');
}
function showOver() {
  state = 'over';
  overGuard = 0.6;
  var isNew = !aiOn && G.score > best;   // AI 代玩成绩不计入最高纪录
  if (isNew) {
    best = G.score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }
  syncHud();
  showOverlay(
    '<h2 class="g-overlay-title">' + (isNew ? '新纪录！' : (aiOn ? 'AI 本局结束' : '游戏结束')) + '</h2>' +
    '<div class="big">' + G.score + '</div>' +
    '<p class="g-overlay-text">最高纪录 ' + best + '</p>' +
    (aiOn ? '<p class="g-overlay-text">AI 代玩中，即将自动开始下一局</p>' : '') +
    '<button type="button" class="g-alert-btn default">再来一局</button>'
  );
}

/* ================= 流程控制 ================= */
function startGame() {
  resetGame();
  state = 'playing';
  hideOverlay();
}
function resumeGame() {
  state = 'playing';
  hideOverlay();
}
function die() {
  state = 'dying';
  dieT = 0;
  G.bird.vy = Math.min(G.bird.vy, -150); /* 撞击瞬间轻微上弹再坠落 */
  if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
}
function flap() {
  flapCore(G);
  G.bird.boost = 0.28; /* 加速扇翅的时间窗（纯装饰） */
}
function act() {
  if (aiOn) return;   // AI 全权接管，忽略手动输入
  if (state === 'ready') startGame();
  else if (state === 'playing') flap();
  else if (state === 'paused') resumeGame();
  else if (state === 'over' && overGuard <= 0) startGame();
}
function resetGame() {
  G = freshCore(Math.random);
  syncHud();
}

/* ================= AI 代玩控制 ================= */
/* 每帧调用：衔接界面状态（自动开局/续局/恢复），并在 playing 时逐帧决策是否扇翅 */
function aiTick(dt) {
  if (!aiOn) return;
  if (state === 'ready') { startGame(); return; }
  if (state === 'paused') { resumeGame(); return; }
  if (state === 'over') { if (overGuard <= 0) startGame(); return; }
  if (state !== 'playing') return;
  if (aiShouldFlap(G, dt)) flap();
}
function setAi(on) {
  aiOn = on;
  aiBtn.classList.toggle('is-running', aiOn);
  aiBtn.setAttribute('aria-pressed', String(aiOn));
  aiTag.hidden = !aiOn;
  if (aiOn) {
    if (state === 'ready') startGame();
    else if (state === 'paused') resumeGame();
    else if (state === 'over' && overGuard <= 0) startGame();
  }
}
aiBtn.addEventListener('click', function () { setAi(!aiOn); });

/* ================= 更新 ================= */
function update(dt) {
  /* 背景元素在任何状态下都保持轻微活动 */
  groundOff = (groundOff + (state === 'playing' ? speedNow(G.score) : SPEED_START * 0.4) * dt) % 24;
  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    c.x -= (c.v + (state === 'playing' ? speedNow(G.score) * 0.12 : 0)) * dt;
    if (c.x < -70) clouds[i] = newCloud(W + 70);
  }
  if (state === 'playing' || state === 'ready') {
    G.bird.wing += dt * (G.bird.boost > 0 ? 30 : 10);
  }

  if (state === 'playing') {
    /* 玩法推进交给纯函数核心 */
    var ev = stepCore(G, dt, Math.random);
    G.bird.boost = Math.max(0, G.bird.boost - dt);
    /* 姿态：上升抬头，下降低头（纯表现） */
    G.bird.rot = Math.max(-0.42, Math.min(1.25, G.bird.vy / 520));
    if (ev.scored) syncHud();
    if (ev.died) { die(); return; }
  } else if (state === 'dying') {
    /* 死亡坠落：管道停止，小鸟落到地面后展示结算（纯表现） */
    G.bird.vy = Math.min(MAX_FALL, G.bird.vy + GRAVITY * dt);
    G.bird.y += G.bird.vy * dt;
    G.bird.rot = Math.min(1.5, G.bird.rot + dt * 5);
    if (G.bird.y + BIRD_R >= GROUND_Y) {
      G.bird.y = GROUND_Y - BIRD_R;
      dieT += dt;
      if (dieT > 0.55) showOver();
    }
  }
}

/* ================= 绘制 ================= */
function draw() {
  /* 天空 */
  var sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#9fd9f2');
  sky.addColorStop(1, '#e3f6fd');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  /* 云（几何圆拼装） */
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (var i = 0; i < clouds.length; i++) drawCloud(clouds[i].x, clouds[i].y, 16 * clouds[i].s);

  /* 远处山丘剪影 */
  ctx.fillStyle = 'rgba(126,191,140,.45)';
  hill(W * 0.22, GROUND_Y, 90, 34);
  hill(W * 0.72, GROUND_Y, 130, 46);

  drawPipes();
  drawGround();
  drawBird();
}
function drawCloud(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.arc(x + r * 0.9, y + 4, r * 0.75, 0, Math.PI * 2);
  ctx.arc(x - r * 0.9, y + 5, r * 0.65, 0, Math.PI * 2);
  ctx.arc(x + r * 0.1, y + r * 0.55, r * 0.8, 0, Math.PI * 2);
  ctx.fill();
}
function hill(cx, baseY, w, h) {
  ctx.beginPath();
  ctx.moveTo(cx - w / 2, baseY);
  ctx.quadraticCurveTo(cx, baseY - h * 2, cx + w / 2, baseY);
  ctx.closePath();
  ctx.fill();
}
function drawPipes() {
  for (var i = 0; i < G.pipes.length; i++) {
    var p = G.pipes[i];
    var topH = p.gapY - p.gap / 2;
    var botY = p.gapY + p.gap / 2;
    drawPipe(p.x, 0, topH, true);
    drawPipe(p.x, botY, GROUND_Y - botY, false);
  }
}
function drawPipe(x, y, h, isTop) {
  if (h <= 0) return;
  /* 管身 */
  ctx.fillStyle = '#74bf2e';
  ctx.fillRect(x, y, PIPE_W, h);
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.fillRect(x + 6, y, 10, h);
  ctx.strokeStyle = '#4c8a17';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y - 2, PIPE_W - 2, h + 4);
  /* 管口帽（贴缝隙一侧） */
  var capY = isTop ? y + h - 24 : y;
  ctx.fillStyle = '#74bf2e';
  ctx.fillRect(x - 5, capY, PIPE_W + 10, 24);
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.fillRect(x - 5 + 6, capY, 10, 24);
  ctx.strokeRect(x - 4, capY + 1, PIPE_W + 8, 22);
}
function drawGround() {
  /* 草地 */
  ctx.fillStyle = '#8ed081';
  ctx.fillRect(0, GROUND_Y, W, 16);
  ctx.fillStyle = '#6db562';
  ctx.fillRect(0, GROUND_Y, W, 4);
  /* 土层 + 滚动斜纹 */
  ctx.fillStyle = '#e7d99a';
  ctx.fillRect(0, GROUND_Y + 16, W, GROUND_H - 16);
  ctx.fillStyle = '#d9c97e';
  for (var x = -groundOff; x < W + 24; x += 24) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y + 16);
    ctx.lineTo(x + 12, GROUND_Y + 16);
    ctx.lineTo(x + 4, GROUND_Y + 30);
    ctx.lineTo(x - 8, GROUND_Y + 30);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = '#cbb968';
  ctx.fillRect(0, GROUND_Y + 30, W, GROUND_H - 30);
}
/* 小鸟：几何图形拼装（椭圆身体 + 扇动翅膀 + 眼睛 + 喙 + 尾羽） */
function drawBird() {
  var bird = G.bird;
  ctx.save();
  ctx.translate(BIRD_X, bird.y);
  ctx.rotate(bird.rot);
  ctx.lineWidth = 2;
  /* 尾羽 */
  ctx.fillStyle = '#e0a92c';
  ctx.beginPath();
  ctx.moveTo(-12, -3);
  ctx.lineTo(-22, -7);
  ctx.lineTo(-21, 3);
  ctx.closePath();
  ctx.fill();
  /* 身体 */
  ctx.fillStyle = '#ffd23f';
  ctx.strokeStyle = '#c9971a';
  ctx.beginPath();
  ctx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  /* 肚皮 */
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath();
  ctx.ellipse(3, 5, 8, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  /* 翅膀（上下扇动，扇翅后摆幅加大） */
  var wag = Math.sin(bird.wing) * (bird.boost > 0 ? 0.9 : 0.35);
  ctx.save();
  ctx.translate(-2, 1);
  ctx.rotate(wag - 0.2);
  ctx.fillStyle = '#f5b52e';
  ctx.strokeStyle = '#c9971a';
  ctx.beginPath();
  ctx.ellipse(-4, 0, 9, 5.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  /* 眼睛 */
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(7, -4, 4.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#b98a17';
  ctx.stroke();
  ctx.fillStyle = '#333333';
  ctx.beginPath();
  ctx.arc(8.4, -4, 2, 0, Math.PI * 2);
  ctx.fill();
  /* 喙 */
  ctx.fillStyle = '#ff8c42';
  ctx.beginPath();
  ctx.moveTo(13, -2);
  ctx.lineTo(23, 0);
  ctx.lineTo(13, 2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#d96a24';
  ctx.stroke();
  ctx.restore();
}

/* ================= 主循环 ================= */
var lastFrame = performance.now();
function loop(now) {
  /* deltaTime 限幅，防止切后台回来一瞬间跳帧 */
  var dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  if (overGuard > 0) overGuard -= dt;
  aiTick(dt);
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ================= 输入（指针 + 键盘，兼容无 PointerEvent 的环境） ================= */
function onTap(el, fn) {
  if (window.PointerEvent) el.addEventListener('pointerdown', fn);
  else {
    el.addEventListener('touchstart', function (e) { e.preventDefault(); fn(e.touches[0]); }, { passive: false });
    el.addEventListener('mousedown', fn);
  }
}
onTap(stage, function () { act(); });
window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
    e.preventDefault();
    if (!e.repeat) act();
  }
});

/* 切后台自动暂停；回到前台重置时间基准，避免 delta 时间跳变 */
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    if (state === 'playing') { state = 'paused'; showPause(); }
  } else {
    lastFrame = performance.now();
  }
});

/* ================= 启动 ================= */
resetClouds();
resetGame();
showStart();
requestAnimationFrame(loop);
})();
</script>
  <div class="g-alert-mask g-alert-rules open" id="rulesModal" role="dialog" aria-modal="true" aria-label="游戏规则" hidden>
    <div class="g-alert">
      <div class="g-alert-body">
    <h2>游戏规则</h2>

      <h3>玩法</h3>
      <ul>
        <li>点击或按空格扇翅上升，松开受重力下坠</li>
        <li>穿过一对管道缝隙得 1 分，撞管或落地结束</li>
        <li>分数越高缝隙越窄、速度越快</li>
      </ul>
      <h3>操作</h3>
      <ul>
        <li>点击 / 轻触 / 空格 / ↑ / 回车：扇翅</li>
      </ul>
      <h3>AI 代玩</h3>
      <ul>
        <li>点击「AI 代玩」按钮，AI 自动判断扇翅时机穿管道并自动续局</li>
        <li>随时再点一次按钮即可停止；AI 成绩不计入最高纪录</li>
      </ul>
      </div>
      <div class="g-alert-actions">
        <button class="g-alert-btn default" id="rulesClose" type="button">好的</button>
      </div>
    </div>
  </div>
<script>
  /* 左上角工具栏：规则弹窗 + 全局音效开关；字体与主站「界面字体」联动（appearance.js 单源） */
  (function () {
    var mask = document.getElementById('rulesModal');
    var rulesBtn = document.getElementById('rulesBtn');
    var closeBtn = document.getElementById('rulesClose');
    var lastFocus = null;
    function openRules() {
      if (!mask || !mask.hidden) return;
      lastFocus = document.activeElement;
      mask.hidden = false;                  // mask 常驻 .open（g-alert open 态），只切 hidden
      if (closeBtn) closeBtn.focus();
    }
    function closeRules() {
      if (!mask || mask.hidden) return;
      mask.hidden = true;
      if (lastFocus && lastFocus.focus) lastFocus.focus();
      lastFocus = null;
    }
    if (rulesBtn) rulesBtn.addEventListener('click', openRules);
    if (closeBtn) closeBtn.addEventListener('click', closeRules);
    if (mask) mask.addEventListener('click', function (e) { if (e.target === mask) closeRules(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && mask && !mask.hidden) { e.stopPropagation(); closeRules(); }
    });

    var sfxBtn = document.getElementById('sfxBtn');
    var SFX_KEY = 'gameSfxMuted';
    function sfxMuted() { try { return localStorage.getItem(SFX_KEY) === '1'; } catch (e) { return false; } }
    function paintSfx() {
      if (!sfxBtn) return;
      var muted = sfxMuted();
      sfxBtn.classList.toggle('is-muted', muted);
      sfxBtn.setAttribute('aria-pressed', String(muted));
      sfxBtn.setAttribute('aria-label', muted ? '开启音效' : '静音');
      var on = sfxBtn.querySelector('.sfx-on'), off = sfxBtn.querySelector('.sfx-off');
      if (on) on.toggleAttribute('hidden', muted);      // SVGElement.hidden 非反射属性，必须 toggleAttribute
      if (off) off.toggleAttribute('hidden', !muted);
    }
    if (sfxBtn) sfxBtn.addEventListener('click', function () {
      try { localStorage.setItem(SFX_KEY, sfxMuted() ? '0' : '1'); } catch (e) {}
      paintSfx();
    });
    window.addEventListener('storage', function (e) { if (e.key === SFX_KEY) paintSfx(); });
    paintSfx();

    try { if (window.SiteAppearance) SiteAppearance.applySiteFontFromStorage(); } catch (e) {}
    window.addEventListener('storage', function (e) {
      if (e.key === 'fontFamily' && window.SiteAppearance) SiteAppearance.applySiteFontFromStorage();
    });
  })();
  </script>
</body>
</html>
