<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 - 拾光集</title>
  <meta name="description" content="拾光集在线小游戏：2048，方向键或滑动合并相同数字方块，纯本地运行，无需联网。">
  <link rel="icon" href="../../favicon.svg">
  <link rel="canonical" href="https://zengzoxiong.github.io/MySite/tools/2048/app.html">
  <style>
    /* ===== 2048 · 拾光集自建小游戏（纯静态零依赖，固定亮色样式） ===== */
    [hidden] { display: none !important; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #faf6ef;
      color: #6b6157;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 26px 16px 40px;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap { width: 100%; max-width: 460px; }

    header { margin-bottom: 14px; }
    h1 { font-size: 40px; line-height: 1.1; color: #7b6f63; letter-spacing: 2px; }
    .sub { margin-top: 6px; font-size: 13px; color: #a2937f; }

    .hud { display: flex; gap: 10px; margin-bottom: 14px; }
    .stat {
      flex: 1;
      background: #fff;
      border: 1px solid #eee3d3;
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(170, 145, 110, .10);
    }
    .stat .lab { display: block; font-size: 12px; color: #ab9c88; letter-spacing: 3px; }
    .stat .val { display: block; margin-top: 2px; font-size: 22px; font-weight: 700; color: #7b6f63; font-variant-numeric: tabular-nums; }
    .stat.bump { animation: bump .18s ease; }
    @keyframes bump { 50% { transform: scale(1.07); } }

    .btn {
      border: 0;
      background: #8f7a66;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      padding: 0 18px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(143, 122, 102, .35);
      touch-action: manipulation;
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: #e08a3c; }
    .btn.auto-on { background: #2f9e44; box-shadow: 0 2px 10px rgba(47, 158, 68, .4); }
    .hud .btn { align-self: stretch; }

    /* 棋盘：16 个底格 + 绝对定位方块，坐标全部由 CSS 变量 --x/--y 经 calc 换算，天然响应式 */
    .board {
      --gap: 10px;
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: #b9ab9c;
      border-radius: 14px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .cellbg, .tile {
      --tw: calc((100% - 5 * var(--gap)) / 4);
      position: absolute;
      width: var(--tw);
      height: var(--tw);
      border-radius: 9px;
      left: calc(var(--gap) + var(--x) * (var(--tw) + var(--gap)));
      top:  calc(var(--gap) + var(--y) * (var(--tw) + var(--gap)));
    }
    .cellbg { background: rgba(255, 250, 240, .38); }
    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      z-index: 1;
      transition: left .13s ease-in-out, top .13s ease-in-out;
    }
    /* 字号必须用实像素：--tw 里的 100% 在 font-size 上下文里是父字号而非棋盘宽 */
    .len1 { font-size: calc(var(--tw-px, 80px) * .52); }
    .len2 { font-size: calc(var(--tw-px, 80px) * .46); }
    .len3 { font-size: calc(var(--tw-px, 80px) * .36); }
    .len4 { font-size: calc(var(--tw-px, 80px) * .27); }

    /* 经典配色 */
    .v2    { background: #eee4da; color: #776e65; }
    .v4    { background: #ede0c8; color: #776e65; }
    .v8    { background: #f2b179; color: #fff9f0; }
    .v16   { background: #f59563; color: #fff9f0; }
    .v32   { background: #f67c5f; color: #fff9f0; }
    .v64   { background: #f65e3b; color: #fff9f0; }
    .v128  { background: #edcf72; color: #fff9f0; }
    .v256  { background: #edcc61; color: #fff9f0; }
    .v512  { background: #edc850; color: #fff9f0; }
    .v1024 { background: #edc53f; color: #fff9f0; }
    .v2048 { background: #edc22e; color: #fff9f0; box-shadow: 0 0 18px rgba(237, 194, 46, .55); }
    .vx    { background: #3c3a32; color: #fff9f0; }

    /* 出现 / 合并动画 */
    .tile.appear { animation: appear .18s ease .05s backwards; }
    @keyframes appear { from { transform: scale(0); opacity: 0; } }
    .tile.pop { animation: pop .18s ease; }
    @keyframes pop { 50% { transform: scale(1.22); } }

    /* 胜负弹层（hidden + 同步回流 + open，保证过渡生效） */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      border-radius: 14px;
      background: rgba(253, 249, 242, .86);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .overlay.open { opacity: 1; }
    .ov-title { font-size: 34px; font-weight: 800; color: #7b6f63; }
    .overlay.win .ov-title { color: #d98b28; }
    .ov-sub { font-size: 14px; color: #8d8175; padding: 0 16px; }
    .ov-btns { display: flex; gap: 10px; margin-top: 8px; }
    .ov-btns .btn { padding: 10px 18px; }

    .hint { margin-top: 14px; text-align: center; font-size: 13px; color: #ab9c88; }
    footer { margin-top: 28px; text-align: center; font-size: 12px; color: #bfb2a0; }
  </style>
    <style>
    /* 返回主页按钮（fixed 定位不挤占各页布局） */
    .back-home {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 13px;
      border-radius: 10px;
      background: #fff;
      color: #4a6f9e;
      border: 1px solid #d3dfee;
      box-shadow: 0 2px 8px rgba(60, 90, 130, .12);
      font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-decoration: none;
      touch-action: manipulation;
    }
    .back-home:hover { background: #f0f6fc; }
    .back-home:active { transform: translateY(1px); }
    .back-home svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (max-width: 560px) {
      .back-home { top: 8px; left: 8px; padding: 7px 10px; font-size: 12px; }
    }
    </style>
    <style>
    /* ===== 右侧规则栏（可收起）=====
       展开时 body 右侧让出面板位，游戏本体居左；收起后仅剩「玩法」竖标签。
       展开偏好存 localStorage，跨游戏页记忆。 */
    .rules-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 272px;
      overflow: visible; /* 把手挂在面板左缘外侧，滚动收进内层 .rules-scroll */
      background: #fff;
      border-left: 1px solid #d7dee8;
      box-shadow: -6px 0 22px rgba(60, 90, 130, .10);
      z-index: 190;
      transform: translateX(0);
      transition: transform .28s cubic-bezier(.22, .9, .3, 1);
      color: #5c7186;
      font: 400 13px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .rules-panel.closed { transform: translateX(100%); }
    /* 规则内容滚动区（面板本体必须 overflow:visible，只能在内层滚） */
    .rules-scroll {
      height: 100%;
      overflow-y: auto;
      padding: 20px 18px;
      box-sizing: border-box;
    }
    .rules-panel h2 {
      font-size: 15px;
      color: #3f5568;
      margin: 0 0 12px;
    }
    .rules-panel h3 {
      font-size: 12.5px;
      color: #4a6f9e;
      margin: 14px 0 4px;
      letter-spacing: 1px;
    }
    .rules-panel ul { margin: 0; padding-left: 18px; }
    .rules-panel li { margin: 4px 0; }
    /* 柜门式把手：挂在面板最左侧中间，随面板滑出滑入 */
    .rules-handle {
      position: absolute;
      left: -30px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 116px;
      padding: 0;
      border: 1px solid #d7dee8;
      border-right: none;
      border-radius: 12px 0 0 12px;
      background: #fff;
      box-shadow: -4px 0 14px rgba(60, 90, 130, .10);
      color: #4a6f9e;
      font: 600 13px/1 inherit;
      letter-spacing: 3px;
      writing-mode: vertical-lr;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .rules-handle:active { transform: translateY(-50%) scale(.96); }
    body { transition: padding-right .28s cubic-bezier(.22, .9, .3, 1); }
    @media (min-width: 1100px) {
      body.rules-open { padding-right: 272px; }
    }
    /* 窄屏：面板变覆盖抽屉，游戏本体不动 */
    @media (max-width: 560px) {
      .rules-panel { width: min(272px, 82vw); }
    }
    </style>
</head>
<body>
    <a class="back-home" href="../../index.html" aria-label="返回拾光集主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>返回主页</a>

  <main class="wrap">
    <header>
      <h1>2048</h1>
      <p class="sub">滑动合并相同数字，目标 2048</p>
    </header>

    <section class="hud">
      <div class="stat" id="scoreStat"><span class="lab">分数</span><span class="val" id="score">0</span></div>
      <div class="stat"><span class="lab">最高分</span><span class="val" id="best">0</span></div>
      <button class="btn" id="newBtn" type="button">新游戏</button>
      <button class="btn" id="autoBtn" type="button">自动模式</button>
    </section>

    <div class="board" id="board">
      <div class="overlay" id="overlay" hidden>
        <p class="ov-title" id="ovTitle"></p>
        <p class="ov-sub" id="ovSub"></p>
        <div class="ov-btns">
          <button class="btn" id="ovContinue" type="button" hidden>继续挑战</button>
          <button class="btn primary" id="ovRestart" type="button">再来一局</button>
        </div>
      </div>
    </div>

    <footer>拾光集 · 在线小游戏</footer>
  </main>

  <script>
  'use strict';
  /* ================= 2048 主逻辑（零依赖，纯本地运行） ================= */
  const SIZE = 4;          // 棋盘 4×4
  const MOVE_MS = 140;     // 滑动动画时长，与 CSS transition 对应
  const WIN_VALUE = 2048;  // 胜利目标

  const board = document.getElementById('board');

  // 把格子实际边长写进 --tw-px 供 font-size 使用（width 可用 100%，字号不行）
  function syncTileFont() {
    const gap = parseFloat(getComputedStyle(board).getPropertyValue('--gap')) || 10;
    const tw = (board.clientWidth - 5 * gap) / 4;
    board.style.setProperty('--tw-px', tw.toFixed(2) + 'px');
  }
  syncTileFont();
  window.addEventListener('resize', syncTileFont);
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const scoreStat = document.getElementById('scoreStat');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovSub = document.getElementById('ovSub');
  const ovContinue = document.getElementById('ovContinue');
  const ovRestart = document.getElementById('ovRestart');

  let grid = [];           // grid[行][列] = 方块对象 或 null
  let score = 0;
  let best = loadBest();
  let won = false;         // 是否已合成过 2048（避免重复弹胜利窗）
  let over = false;        // 是否已无路可走
  let paused = false;      // 胜利弹层挂起中
  let lock = false;        // 滑动动画期间锁输入

  bestEl.textContent = best;

  /* ---------- 本地存储（读写都兜底，隐私模式不报错） ---------- */
  function loadBest() {
    try { return parseInt(localStorage.getItem('2048.best'), 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest() {
    try { localStorage.setItem('2048.best', String(best)); }
    catch (e) { /* 写入失败时静默忽略 */ }
  }

  /* ---------- 方块构建与定位 ---------- */
  // 位置全部走 CSS 变量 --x（列）/ --y（行），由 calc 换算成 left/top
  function setPos(t) {
    t.el.style.setProperty('--x', t.c);
    t.el.style.setProperty('--y', t.r);
  }
  function tileClass(v, extra) {
    const cls = 'tile v' + (v > WIN_VALUE ? 'x' : v) + ' len' + Math.min(String(v).length, 4);
    return extra ? cls + ' ' + extra : cls;
  }
  function createTile(r, c, v, appear) {
    const el = document.createElement('div');
    el.className = tileClass(v, appear ? 'appear' : '');
    el.textContent = v;
    const t = { r: r, c: c, v: v, el: el, merging: false };
    setPos(t);            // 先定位再入 DOM，避免从默认位置产生过渡
    grid[r][c] = t;
    board.appendChild(el);
    return t;
  }
  function emptyGrid() {
    return Array.from({ length: SIZE }, function () { return Array(SIZE).fill(null); });
  }
  function randomEmptyCell() {
    const list = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) if (!grid[r][c]) list.push([r, c]);
    }
    return list.length ? list[Math.floor(Math.random() * list.length)] : null;
  }
  function spawnTile() {
    const p = randomEmptyCell();
    if (p) createTile(p[0], p[1], Math.random() < 0.9 ? 2 : 4, true);
  }

  /* ---------- 移动与合并 ---------- */
  const VEC = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };

  function move(dir) {
    if (lock || over || paused) return;
    const dr = VEC[dir][0], dc = VEC[dir][1];
    const rows = [0, 1, 2, 3], cols = [0, 1, 2, 3];
    if (dr === 1) rows.reverse();     // 从靠边一侧开始遍历，保证合并次序正确
    if (dc === 1) cols.reverse();

    let moved = false;
    const merges = [];                // [滑入的块, 被合入的块]
    for (const r of rows) {
      for (const c of cols) {
        const t = grid[r][c];
        if (!t) continue;
        t.merging = false;
        // 一路滑到最远的空格
        let nr = r, nc = c;
        while (true) {
          const ar = nr + dr, ac = nc + dc;
          if (ar < 0 || ar >= SIZE || ac < 0 || ac >= SIZE || grid[ar][ac]) break;
          nr = ar; nc = ac;
        }
        const ar = nr + dr, ac = nc + dc;
        const target = (ar >= 0 && ar < SIZE && ac >= 0 && ac < SIZE) ? grid[ar][ac] : null;
        if (target && target.v === t.v && !target.merging) {
          // 可合并：t 滑到 target 上，动画结束后二合一
          grid[r][c] = null;
          t.r = ar; t.c = ac;
          setPos(t);
          target.merging = true;
          merges.push([t, target]);
          moved = true;
        } else if (nr !== r || nc !== c) {
          // 仅滑动
          grid[r][c] = null;
          grid[nr][nc] = t;
          t.r = nr; t.c = nc;
          setPos(t);
          moved = true;
        }
      }
    }
    if (!moved) return;

    lock = true;
    window.setTimeout(function () {
      // 应用合并结果：移除被吞的块，留下的一方翻倍并弹一下
      for (const pair of merges) {
        const gone = pair[0], stay = pair[1];
        gone.el.remove();
        stay.v *= 2;
        stay.el.className = tileClass(stay.v, 'pop');
        stay.el.textContent = stay.v;
        addScore(stay.v);
        if (stay.v >= WIN_VALUE && !won) {
          won = true;
          paused = true;
          showOverlay('win');
        }
      }
      spawnTile();
      lock = false;
      checkOver();
    }, MOVE_MS);
  }

  function addScore(n) {
    score += n;
    scoreEl.textContent = score;
    scoreStat.classList.remove('bump');
    void scoreStat.offsetWidth;
    scoreStat.classList.add('bump');
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      saveBest();
    }
  }

  function checkOver() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (!t) return;                                                          // 还有空格
        if (c < SIZE - 1 && grid[r][c + 1] && grid[r][c + 1].v === t.v) return;  // 横向可合
        if (r < SIZE - 1 && grid[r + 1][c] && grid[r + 1][c].v === t.v) return;  // 纵向可合
      }
    }
    over = true;
    showOverlay('lose');
  }

  /* ---------- 弹层 ---------- */
  function showOverlay(kind) {
    if (kind === 'win') {
      ovTitle.textContent = '胜利！';
      ovSub.textContent = '你合成出了 2048，可以继续挑战更高分数';
      ovContinue.hidden = false;
      overlay.classList.add('win');
    } else {
      ovTitle.textContent = '游戏结束';
      ovSub.textContent = '最终分数 ' + score + (score > 0 && score >= best ? ' · 新纪录！' : '');
      ovContinue.hidden = true;
      overlay.classList.remove('win');
    }
    overlay.hidden = false;
    void overlay.offsetWidth;   // 同步回流后再加 open，保证过渡生效
    overlay.classList.add('open');
  }
  function hideOverlay() {
    overlay.classList.remove('open');
    overlay.hidden = true;
  }

  /* ---------- 开局 ---------- */
  function newGame() {
    board.querySelectorAll('.tile').forEach(function (el) { el.remove(); });
    grid = emptyGrid();
    score = 0;
    scoreEl.textContent = '0';
    won = false;
    over = false;
    paused = false;
    lock = false;
    hideOverlay();
    spawnTile();
    spawnTile();
  }

  /* ---------- 输入：键盘 ---------- */
  const KEYMAP = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    A: 'left', D: 'right', W: 'up', S: 'down'
  };
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const dir = KEYMAP[e.key];
    if (!dir) return;
    e.preventDefault();       // 阻止方向键滚动页面
    move(dir);
  });

  /* ---------- 输入：触屏滑动 ---------- */
  let touchStart = null;
  board.addEventListener('touchstart', function (e) {
    touchStart = e.changedTouches[0];
  }, { passive: true });
  board.addEventListener('touchmove', function (e) {
    e.preventDefault();       // 棋盘上滑动不滚动页面（配合 touch-action: none）
  }, { passive: false });
  board.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.clientX;
    const dy = t.clientY - touchStart.clientY;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;   // 位移太短不算滑动
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: true });

  /* ---------- 按钮 ---------- */
  document.getElementById('newBtn').addEventListener('click', newGame);
  ovRestart.addEventListener('click', newGame);
  ovContinue.addEventListener('click', function () {
    paused = false;
    hideOverlay();
  });

  /* ---------- 自动模式：AI 托管（expectimax 跑在 Web Worker 里） ----------
     深搜每步几十万次评估，主线程跑会卡成幻灯片；搬进 Worker 后页面
     照常渲染、AI 照常深算。深度恒定 3 层（残局 4 层），稳定冲击 4096。
     死亡停在结算面板，玩家点「再来一局」后 AI 接着走 */
  let autoOn = false;
  let aiBusy = false;   // 上一手还没算完时不重复下发

  const AI_WORKER_SRC = `
    'use strict';
    const LOG2 = { 0: 0 };
    for (let v = 2; v <= 65536; v *= 2) LOG2[v] = Math.log2(v);
    const lg = function (v) { return LOG2[v] || 0; };
    const VEC = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
    const TRAV = {};
    (function () {
      for (const dir of ['up', 'left', 'down', 'right']) {
        const dr = VEC[dir][0], dc = VEC[dir][1];
        const rows = [0, 1, 2, 3], cols = [0, 1, 2, 3];
        if (dr === 1) rows.reverse();
        if (dc === 1) cols.reverse();
        const order = [];
        for (const r of rows) for (const c of cols) order.push(r * 4 + c);
        TRAV[dir] = order;
      }
    })();
    function simMove(m, dir) {
      const out = m.slice();
      const order = TRAV[dir];
      const dr = VEC[dir][0], dc = VEC[dir][1];
      const merged = new Uint8Array(16);
      let moved = false, gained = 0;
      for (const i of order) {
        const v = out[i];
        if (!v) continue;
        let ni = i;
        while (true) {
          const ar = (ni >> 2) + dr, ac = (ni & 3) + dc;
          if (ar < 0 || ar > 3 || ac < 0 || ac > 3 || out[ar * 4 + ac]) break;
          ni = ar * 4 + ac;
        }
        const ar = (ni >> 2) + dr, ac = (ni & 3) + dc;
        const ti = (ar >= 0 && ar < 4 && ac >= 0 && ac < 4) ? ar * 4 + ac : -1;
        if (ti >= 0 && out[ti] === v && !merged[ti]) {
          out[i] = 0; out[ti] = v * 2; merged[ti] = 1;
          gained += v * 2; moved = true;
        } else if (ni !== i) {
          out[i] = 0; out[ni] = v; moved = true;
        }
      }
      return { mat: out, moved: moved, gained: gained };
    }
    function maxOf(m) {
      let x = 0;
      for (let i = 0; i < 16; i++) if (m[i] > x) x = m[i];
      return x;
    }
    function evaluate(m) {
      let empty = 0, smooth = 0, maxV = 0;
      let monoLR = 0, monoRL = 0, monoUD = 0, monoDU = 0;
      for (let i = 0; i < 16; i++) {
        const v = m[i];
        if (!v) { empty++; continue; }
        if (v > maxV) maxV = v;
        const lv = lg(v), c = i & 3, r = i >> 2;
        if (c < 3) {
          const w = lg(m[i + 1]);
          smooth += Math.abs(lv - w);
          if (lv > w) monoLR += w - lv; else monoRL += lv - w;
        }
        if (r < 3) {
          const w = lg(m[i + 4]);
          if (lv > w) monoUD += w - lv; else monoDU += lv - w;
        }
      }
      const mono = Math.max(monoLR, monoRL) + Math.max(monoUD, monoDU);
      // 最大数钉角有奖励、漂移重罚——4096 失败多是大数漂移导致棋盘碎裂
      const inCorner = m[0] === maxV || m[3] === maxV || m[12] === maxV || m[15] === maxV;
      const corner = inCorner ? lg(maxV) * 270 : -lg(maxV) * 60;
      return empty * 270 + mono * 47 + corner + lg(maxV) * 36 - smooth * 3;
    }
    /* 随机层：全展开每个空位（不算 4 块会系统性高估局面） */
    function expectNode(m, depth) {
      let exp = 0, n = 0;
      for (let i = 0; i < 16; i++) {
        if (m[i]) continue;
        for (const v of [2, 4]) {
          const m2 = m.slice();
          m2[i] = v;
          exp += (v === 2 ? 0.9 : 0.1) * maxNode(m2, depth);
        }
        n += 2;
      }
      return n ? exp / n : maxNode(m, depth);
    }
    /* 我方层：四方向取最优；无路可走重罚，上层会主动避开死局 */
    function maxNode(m, depth) {
      if (depth <= 0) return evaluate(m);
      let best = -Infinity;
      for (const dir of ['up', 'left', 'down', 'right']) {
        const sim = simMove(m, dir);
        if (!sim.moved) continue;
        const sc = sim.gained + expectNode(sim.mat, depth - 1);
        if (sc > best) best = sc;
      }
      return best === -Infinity ? -1e6 - lg(maxOf(m)) * 1000 : best;
    }
    function bestDir(m) {
      let empties = 0;
      for (let i = 0; i < 16; i++) if (!m[i]) empties++;
      // 全程 3 层是实测最优（多局 33k-36.9k 分）；4 层全期望开局要数亿
      // 次评估直接卡死，降开局深度又会伤布局质量，两头不讨好
      const depth = 3;
      let best = null, bestScore = -Infinity;
      for (const dir of ['up', 'left', 'down', 'right']) {
        const sim = simMove(m, dir);
        if (!sim.moved) continue;
        const sc = sim.gained + expectNode(sim.mat, depth - 1);
        if (sc > bestScore) { bestScore = sc; best = dir; }
      }
      return best;
    }
    onmessage = function (e) {
      const dir = bestDir(e.data.mat);
      postMessage({ id: e.data.id, dir: dir });
    };
  `;
  const aiWorker = new Worker(URL.createObjectURL(new Blob([AI_WORKER_SRC], { type: 'application/javascript' })));
  let aiReqId = 0;
  aiWorker.onmessage = function (e) {
    aiBusy = false;
    if (!autoOn || e.data.id !== aiReqId) return;   // 过期的回答直接丢弃
    if (e.data.dir) move(e.data.dir);
  };

  function gridValues() {
    const m = new Float64Array(16);
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) { const t = grid[r][c]; if (t) m[r * 4 + c] = t.v; }
    return m;
  }

  function requestAiMove() {
    if (aiBusy) return;
    aiBusy = true;
    aiReqId++;
    aiWorker.postMessage({ id: aiReqId, mat: Array.from(gridValues()) });
  }

  document.getElementById('autoBtn').addEventListener('click', function () {
    autoOn = !autoOn;
    this.textContent = autoOn ? '停止自动' : '自动模式';
    this.classList.toggle('auto-on', autoOn);
    if (autoOn && !lock) requestAiMove();
  });

  /* 驱动：动画锁解除即向 Worker 要下一步；死亡停在结算面板，
     玩家点「再来一局」后 AI 自动接手继续 */
  window.setInterval(function () {
    if (!autoOn || lock) return;
    if (over) return;
    if (paused) { paused = false; hideOverlay(); }
    requestAiMove();
  }, 80);

  /* ---------- 初始化：先铺 16 个底格，再开局 ---------- */
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const bg = document.createElement('div');
      bg.className = 'cellbg';
      bg.style.setProperty('--x', c);
      bg.style.setProperty('--y', r);
      board.appendChild(bg);
    }
  }
  newGame();
  </script>
  <aside class="rules-panel" id="rulesPanel" role="complementary" aria-label="游戏规则">
    <button class="rules-handle" id="rulesHandle" type="button">玩法</button>
    <div class="rules-scroll">
    <h2>游戏规则</h2>
    
      <h3>玩法</h3>
      <ul>
        <li>滑动合并相同数字，每次合并得分翻倍</li>
        <li>合成 2048 即胜利，可继续冲击更高分</li>
        <li>棋盘填满且无可合并时结束；「自动模式」由 AI 托管走棋</li>
      </ul>
      <h3>操作</h3>
      <ul>
        <li>方向键 / WASD / 触屏滑动：推动方块</li>
        <li>新游戏：重开　自动模式：AI 接手</li>
      </ul>
    </div>
  </aside>
  <script>
  (function () {
    var panel = document.getElementById('rulesPanel');
    var handle = document.getElementById('rulesHandle');
    var saved = null;
    try { saved = localStorage.getItem('gameRulesOpen'); } catch (e) { }
    var open = saved === null ? window.innerWidth >= 1100 : saved === '1';
    function apply() {
      panel.classList.toggle('closed', !open);
      handle.textContent = open ? '收起' : '玩法';
      handle.setAttribute('aria-label', open ? '收起游戏规则' : '展开游戏规则');
      document.body.classList.toggle('rules-open', open && window.innerWidth >= 1100);
    }
    handle.addEventListener('click', function () {
      open = !open;
      try { localStorage.setItem('gameRulesOpen', open ? '1' : '0'); } catch (e) { }
      apply();
    });
    window.addEventListener('resize', apply);
    apply();
  })();
  </script>
