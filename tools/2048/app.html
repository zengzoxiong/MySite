<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 - 拾光集</title>
  <meta name="description" content="拾光集在线小游戏：2048，方向键或滑动合并相同数字方块，纯本地运行，无需联网。">
  <link rel="icon" href="../../favicon.svg">
  <link rel="canonical" href="https://zengzoxiong.github.io/MySite/tools/2048/app.html">
  <link rel="stylesheet" href="../../assets/game-ui.css">
  <style>
    /* ===== 2048 游戏私有样式：棋盘与方块视觉保留，外围组件统一走共享样式表 ===== */
    /* 个性色：橙（暖色方块），组件强调色一行切换 */
    :root { --game-accent: #FF9500; }

    /* 规则栏展开时内容列平滑让位（位移量由共享样式 .g-page.rules-open 负责） */
    .g-page { transition: padding-right .28s cubic-bezier(.22, .9, .3, 1); }

    /* 棋盘：16 个底格 + 绝对定位方块，坐标全部由 CSS 变量 --x/--y 经 calc 换算，天然响应式 */
    .board {
      --gap: 10px;
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: #b9ab9c;
      border-radius: 14px;
    }
    /* 结算层圆角随棋盘走 */
    .board .g-overlay { border-radius: 14px; }

    .cellbg, .tile {
      --tw: calc((100% - 5 * var(--gap)) / 4);
      position: absolute;
      width: var(--tw);
      height: var(--tw);
      border-radius: 9px;
      left: calc(var(--gap) + var(--x) * (var(--tw) + var(--gap)));
      top:  calc(var(--gap) + var(--y) * (var(--tw) + var(--gap)));
    }
    .cellbg { background: rgba(255, 250, 240, .38); }
    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      z-index: 1;
      transition: left .13s ease-in-out, top .13s ease-in-out;
    }
    /* 字号必须用实像素：--tw 里的 100% 在 font-size 上下文里是父字号而非棋盘宽 */
    .len1 { font-size: calc(var(--tw-px, 80px) * .52); }
    .len2 { font-size: calc(var(--tw-px, 80px) * .46); }
    .len3 { font-size: calc(var(--tw-px, 80px) * .36); }
    .len4 { font-size: calc(var(--tw-px, 80px) * .27); }

    /* 经典配色（游戏个性视觉，原样保留） */
    .v2    { background: #eee4da; color: #776e65; }
    .v4    { background: #ede0c8; color: #776e65; }
    .v8    { background: #f2b179; color: #fff9f0; }
    .v16   { background: #f59563; color: #fff9f0; }
    .v32   { background: #f67c5f; color: #fff9f0; }
    .v64   { background: #f65e3b; color: #fff9f0; }
    .v128  { background: #edcf72; color: #fff9f0; }
    .v256  { background: #edcc61; color: #fff9f0; }
    .v512  { background: #edc850; color: #fff9f0; }
    .v1024 { background: #edc53f; color: #fff9f0; }
    .v2048 { background: #edc22e; color: #fff9f0; box-shadow: 0 0 18px rgba(237, 194, 46, .55); }
    .vx    { background: #3c3a32; color: #fff9f0; }

    /* 出现 / 合并动画 */
    .tile.appear { animation: appear .18s ease .05s backwards; }
    @keyframes appear { from { transform: scale(0); opacity: 0; } }
    .tile.pop { animation: pop .18s ease; }
    @keyframes pop { 50% { transform: scale(1.22); } }

    /* 结算层按钮排布（按钮本体统一用 .g-alert-btn，规范 §5 第 8 条） */
    .ov-btns .g-alert-btn { flex: 1 1 auto; min-width: 96px; }

    /* 胜利态标题换强调色（私有 .win 与 g-* 共存，规范 §5 第 8 条） */
    .g-overlay.win .g-overlay-title { color: var(--game-accent); }
  </style>
</head>
<body class="g-page">
    <a class="g-back-chip" href="../../index.html" aria-label="返回拾光集主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>返回主页</a>

  <main class="g-wrap">
    <header>
      <h1 class="g-nav-large">2048</h1>
      <p class="g-nav-sub">滑动合并相同数字，目标 2048</p>
    </header>

    <section class="g-hud">
      <div class="g-stat" id="scoreStat"><span class="g-stat-label">分数</span><span class="g-stat-value g-num" id="score">0</span></div>
      <div class="g-stat"><span class="g-stat-label">最高分</span><span class="g-stat-value g-num" id="best">0</span></div>
    </section>

    <div class="g-hud-bar">
      <button class="g-btn g-btn-gray" id="newBtn" type="button">新游戏</button>
      <div class="g-ai-group">
        <button class="g-btn g-ai-btn" id="autoBtn" type="button">AI 代玩</button>
        <span class="g-ai-tag g-ai-tag-auto">AI 代玩中 · 点击停止</span>
      </div>
    </div>

    <div class="board g-stage" id="board">
      <div class="g-overlay g-overlay-fade" id="overlay" hidden>
        <p class="g-overlay-title" id="ovTitle"></p>
        <p class="g-overlay-text" id="ovSub"></p>
        <div class="g-btn-row ov-btns">
          <button class="g-alert-btn" id="ovContinue" type="button" hidden>继续挑战</button>
          <button class="g-alert-btn default" id="ovRestart" type="button">再来一局</button>
        </div>
      </div>
    </div>

    <footer class="g-foot">拾光集 · 在线小游戏</footer>
  </main>

  <script>
  'use strict';
  /* ================= 2048 主逻辑（零依赖，纯本地运行） ================= */
  const SIZE = 4;          // 棋盘 4×4
  const MOVE_MS = 140;     // 滑动动画时长，与 CSS transition 对应
  const WIN_VALUE = 2048;  // 胜利目标

  const board = document.getElementById('board');

  // 把格子实际边长写进 --tw-px 供 font-size 使用（width 可用 100%，字号不行）
  function syncTileFont() {
    const gap = parseFloat(getComputedStyle(board).getPropertyValue('--gap')) || 10;
    const tw = (board.clientWidth - 5 * gap) / 4;
    board.style.setProperty('--tw-px', tw.toFixed(2) + 'px');
  }
  syncTileFont();
  window.addEventListener('resize', syncTileFont);
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const scoreStat = document.getElementById('scoreStat');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovSub = document.getElementById('ovSub');
  const ovContinue = document.getElementById('ovContinue');
  const ovRestart = document.getElementById('ovRestart');

  let mat = [];            // 权威棋盘状态：mat[行*4+列] = 数值（0 为空），纯数据与渲染无关
  const tiles = new Array(16).fill(null);  // 渲染缓存：tiles[i] 是 mat[i] 格上的方块对象
  let score = 0;
  let best = loadBest();
  let won = false;         // 是否已合成过 2048（避免重复弹胜利窗）
  let over = false;        // 是否已无路可走
  let paused = false;      // 胜利弹层挂起中
  let lock = false;        // 滑动动画期间锁输入

  bestEl.textContent = best;

  /* ---------- 本地存储（读写都兜底，隐私模式不报错） ---------- */
  function loadBest() {
    try { return parseInt(localStorage.getItem('2048.best'), 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest() {
    try { localStorage.setItem('2048.best', String(best)); }
    catch (e) { /* 写入失败时静默忽略 */ }
  }

  /* ---------- 方块构建与定位 ---------- */
  // 位置全部走 CSS 变量 --x（列）/ --y（行），由 calc 换算成 left/top
  function setPos(t) {
    t.el.style.setProperty('--x', t.c);
    t.el.style.setProperty('--y', t.r);
  }
  function tileClass(v, extra) {
    const cls = 'tile v' + (v > WIN_VALUE ? 'x' : v) + ' len' + Math.min(String(v).length, 4);
    return extra ? cls + ' ' + extra : cls;
  }
  function createTile(r, c, v, appear) {
    const el = document.createElement('div');
    el.className = tileClass(v, appear ? 'appear' : '');
    el.textContent = v;
    const t = { r: r, c: c, v: v, el: el, merging: false };
    setPos(t);            // 先定位再入 DOM，避免从默认位置产生过渡
    board.appendChild(el);
    return t;
  }
  // 生成新块：位置与数值由核心纯函数 pickSpawn 决定（0.9 概率 2、0.1 概率 4）
  function spawnAt() {
    const s = core.pickSpawn(mat);
    if (!s) return;
    mat[s[0]] = s[1];
    tiles[s[0]] = createTile(s[0] >> 2, s[0] & 3, s[1], true);
  }

  /* ---------- 移动与合并（状态推进交给核心纯函数，DOM 只负责表现） ---------- */
  function move(dir) {
    if (lock || over || paused) return;
    const trace = [];                     // 记录每块滑动轨迹供动画使用
    const res = core.simMove(mat, dir, trace);
    if (!res.moved) return;

    // 按 trace 驱动滑动动画：滑块移位，待合并的对子先标记
    const merges = [];                    // [滑入的块, 被合入的块]
    for (const step of trace) {
      const t = tiles[step.from];
      tiles[step.from] = null;
      t.r = step.to >> 2; t.c = step.to & 3;
      setPos(t);
      if (step.merge >= 0) {
        const stay = tiles[step.merge];
        stay.merging = true;
        merges.push([t, stay]);
      } else {
        tiles[step.to] = t;
      }
    }
    mat = res.mat;                        // 先提交状态，动画随后跟上

    lock = true;
    window.setTimeout(function () {
      // 应用合并结果：移除被吞的块，留下的一方翻倍并弹一下
      for (const pair of merges) {
        pair[0].el.remove();
        const stay = pair[1];
        stay.v *= 2;
        stay.el.className = tileClass(stay.v, 'pop');
        stay.el.textContent = stay.v;
      }
      addScore(res.gained);
      if (core.maxOf(mat) >= WIN_VALUE && !won) {
        won = true;
        paused = true;
        showOverlay('win');
      }
      spawnAt();
      lock = false;
      checkOver();
    }, MOVE_MS);
  }

  function addScore(n) {
    score += n;
    scoreEl.textContent = score;
    scoreStat.classList.remove('g-bump');
    void scoreStat.offsetWidth;
    scoreStat.classList.add('g-bump');
    if (score > best && !autoOn) {   // AI 代玩成绩不计最高分
      best = score;
      bestEl.textContent = best;
      saveBest();
    }
  }

  function checkOver() {
    if (core.hasMoves(mat)) return;   // 核心纯函数判定：还有空格或相邻同值即未结束
    over = true;
    showOverlay('lose');
  }

  /* ---------- 弹层 ---------- */
  function showOverlay(kind) {
    if (kind === 'win') {
      ovTitle.textContent = '胜利！';
      ovSub.textContent = '你合成出了 2048，可以继续挑战更高分数';
      ovContinue.hidden = false;
      overlay.classList.add('win');
    } else {
      ovTitle.textContent = '游戏结束';
      ovSub.textContent = '最终分数 ' + score + (score > 0 && !autoOn && score >= best ? ' · 新纪录！' : '');
      ovContinue.hidden = true;
      overlay.classList.remove('win');
    }
    overlay.hidden = false;
    void overlay.offsetWidth;   // 同步回流后再加 open，保证过渡生效
    overlay.classList.add('open');
  }
  function hideOverlay() {
    overlay.classList.remove('open');
    overlay.hidden = true;
  }

  /* ---------- 开局 ---------- */
  function newGame() {
    board.querySelectorAll('.tile').forEach(function (el) { el.remove(); });
    tiles.fill(null);
    mat = new Array(16).fill(0);
    score = 0;
    scoreEl.textContent = '0';
    won = false;
    over = false;
    paused = false;
    lock = false;
    hideOverlay();
    spawnAt();
    spawnAt();
  }

  /* ---------- 输入：键盘 ---------- */
  const KEYMAP = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    A: 'left', D: 'right', W: 'up', S: 'down'
  };
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const dir = KEYMAP[e.key];
    if (!dir) return;
    e.preventDefault();       // 阻止方向键滚动页面
    move(dir);
  });

  /* ---------- 输入：触屏滑动 ---------- */
  let touchStart = null;
  board.addEventListener('touchstart', function (e) {
    touchStart = e.changedTouches[0];
  }, { passive: true });
  board.addEventListener('touchmove', function (e) {
    e.preventDefault();       // 棋盘上滑动不滚动页面（配合 touch-action: none）
  }, { passive: false });
  board.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.clientX;
    const dy = t.clientY - touchStart.clientY;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;   // 位移太短不算滑动
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: true });

  /* ---------- 按钮 ---------- */
  document.getElementById('newBtn').addEventListener('click', newGame);
  ovRestart.addEventListener('click', newGame);
  ovContinue.addEventListener('click', function () {
    paused = false;
    hideOverlay();
  });

  /* ---------- AI 代玩：expectimax 搜索，核心逻辑与渲染完全无关 ----------
     aiCore2048 是纯函数工厂：状态为 16 格数值矩阵，单步推进、局面评估、
     方向搜索全部不碰 DOM。同一份函数源码三处复用——主线程（生成/判定）、
     Web Worker（AI 决策，源码经 toString 注入）、ai-sim.mjs（按
     AI_CORE_BEGIN / AI_CORE_END 标记提取后跑批量模拟），天然保持一致。
     深度自适应：空位充足时 2 层足够稳，空位紧张或大数成型时加深到 3 层。
     死亡停在结算面板，玩家点「再来一局」后 AI 接着走 */
  /* ===== AI_CORE_BEGIN（ai-sim.mjs 依赖此标记提取同一份逻辑，两端必须同步修改）===== */
  function aiCore2048() {
    'use strict';
    // 16 格数值矩阵（行优先，下标 = 行*4+列），所有函数只操作矩阵，不碰 DOM
    const LOG2 = { 0: 0 };
    for (let v = 2; v <= 65536; v *= 2) LOG2[v] = Math.log2(v);
    const lg = function (v) { return LOG2[v] || 0; };
    const DIRS = ['up', 'left', 'down', 'right'];
    const VEC = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
    // 各方向的遍历次序：从靠边一侧开始，保证合并次序正确
    const TRAV = {};
    (function () {
      for (const dir of DIRS) {
        const dr = VEC[dir][0], dc = VEC[dir][1];
        const rows = [0, 1, 2, 3], cols = [0, 1, 2, 3];
        if (dr === 1) rows.reverse();
        if (dc === 1) cols.reverse();
        const order = [];
        for (const r of rows) for (const c of cols) order.push(r * 4 + c);
        TRAV[dir] = order;
      }
    })();

    /* 单步推进：沿 dir 滑动并合并。trace 传数组时逐块记录
       { from, to, merge }（merge=-1 为纯滑动，否则滑到 merge 格合并），供页面动画 */
    function simMove(m, dir, trace) {
      const out = m.slice();
      const order = TRAV[dir];
      const dr = VEC[dir][0], dc = VEC[dir][1];
      const merged = new Uint8Array(16);
      let moved = false, gained = 0;
      for (const i of order) {
        const v = out[i];
        if (!v) continue;
        let ni = i;
        while (true) {
          const ar = (ni >> 2) + dr, ac = (ni & 3) + dc;
          if (ar < 0 || ar > 3 || ac < 0 || ac > 3 || out[ar * 4 + ac]) break;
          ni = ar * 4 + ac;
        }
        const ar = (ni >> 2) + dr, ac = (ni & 3) + dc;
        const ti = (ar >= 0 && ar < 4 && ac >= 0 && ac < 4) ? ar * 4 + ac : -1;
        if (ti >= 0 && out[ti] === v && !merged[ti]) {
          out[i] = 0; out[ti] = v * 2; merged[ti] = 1;
          gained += v * 2; moved = true;
          if (trace) trace.push({ from: i, to: ti, merge: ti });
        } else if (ni !== i) {
          out[i] = 0; out[ni] = v; moved = true;
          if (trace) trace.push({ from: i, to: ni, merge: -1 });
        }
      }
      return { mat: out, moved: moved, gained: gained };
    }

    function maxOf(m) {
      let x = 0;
      for (let i = 0; i < 16; i++) if (m[i] > x) x = m[i];
      return x;
    }
    function countEmpty(m) {
      let n = 0;
      for (let i = 0; i < 16; i++) if (!m[i]) n++;
      return n;
    }
    /* 是否还有合法动作：有空格，或存在相邻同值块 */
    function hasMoves(m) {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const v = m[r * 4 + c];
          if (!v) return true;
          if (c < 3 && m[r * 4 + c + 1] === v) return true;
          if (r < 3 && m[(r + 1) * 4 + c] === v) return true;
        }
      }
      return false;
    }
    /* 随机生成块：0.9 概率 2、0.1 概率 4，落在随机空格；返回 [下标, 值] 或 null */
    function pickSpawn(m) {
      const empties = [];
      for (let i = 0; i < 16; i++) if (!m[i]) empties.push(i);
      if (!empties.length) return null;
      const i = empties[Math.floor(Math.random() * empties.length)];
      return [i, Math.random() < 0.9 ? 2 : 4];
    }

    function evaluate(m) {
      let empty = 0, smooth = 0, maxV = 0;
      let monoLR = 0, monoRL = 0, monoUD = 0, monoDU = 0;
      for (let i = 0; i < 16; i++) {
        const v = m[i];
        if (!v) { empty++; continue; }
        if (v > maxV) maxV = v;
        const lv = lg(v), c = i & 3, r = i >> 2;
        if (c < 3) {
          const w = lg(m[i + 1]);
          smooth += Math.abs(lv - w);
          if (lv > w) monoLR += w - lv; else monoRL += lv - w;
        }
        if (r < 3) {
          const w = lg(m[i + 4]);
          if (lv > w) monoUD += w - lv; else monoDU += lv - w;
        }
      }
      const mono = Math.max(monoLR, monoRL) + Math.max(monoUD, monoDU);
      // 最大数钉角有奖励、漂移重罚——高分局失败多是大数漂移导致棋盘碎裂
      const inCorner = m[0] === maxV || m[3] === maxV || m[12] === maxV || m[15] === maxV;
      const corner = inCorner ? lg(maxV) * 270 : -lg(maxV) * 60;
      return empty * 270 + mono * 47 + corner + lg(maxV) * 36 - smooth * 3;
    }
    /* 随机层：全展开每个空位的 2/4 两种可能（只算 2 会系统性高估局面） */
    function expectNode(m, depth) {
      let exp = 0, n = 0;
      for (let i = 0; i < 16; i++) {
        if (m[i]) continue;
        for (const v of [2, 4]) {
          const m2 = m.slice();
          m2[i] = v;
          exp += (v === 2 ? 0.9 : 0.1) * maxNode(m2, depth);
        }
        n += 2;
      }
      return n ? exp / n : maxNode(m, depth);
    }
    /* 我方层：四方向取最优；无路可走重罚，上层会主动避开死局 */
    function maxNode(m, depth) {
      if (depth <= 0) return evaluate(m);
      let best = -Infinity;
      for (const dir of DIRS) {
        const sim = simMove(m, dir);
        if (!sim.moved) continue;
        const sc = sim.gained + expectNode(sim.mat, depth - 1);
        if (sc > best) best = sc;
      }
      return best === -Infinity ? -1e6 - lg(maxOf(m)) * 1000 : best;
    }
    /* AI 决策入口：返回最优方向，四向皆不可动时返回 null。
       depthOverride 供模拟脚本实验固定深度；页面默认按空位数自适应 */
    function bestDir(m, depthOverride) {
      const depth = depthOverride || (countEmpty(m) <= 6 ? 3 : 2);
      let best = null, bestScore = -Infinity;
      for (const dir of DIRS) {
        const sim = simMove(m, dir);
        if (!sim.moved) continue;
        const sc = sim.gained + expectNode(sim.mat, depth - 1);
        if (sc > bestScore) { bestScore = sc; best = dir; }
      }
      return best;
    }

    return { simMove: simMove, maxOf: maxOf, countEmpty: countEmpty, hasMoves: hasMoves, pickSpawn: pickSpawn, evaluate: evaluate, bestDir: bestDir };
  }
  /* ===== AI_CORE_END ===== */

  const core = aiCore2048();   // 主线程实例：生成与判定复用核心纯函数

  let autoOn = false;
  let aiBusy = false;   // 上一手还没算完时不重复下发
  let aiReqId = 0;

  /* AI 决策跑在 Web Worker 里，源码直接复用上面的工厂函数，与主线程严格同一份实现 */
  const AI_WORKER_SRC =
    'const core = (' + aiCore2048.toString() + ')();\n' +
    'onmessage = function (e) {\n' +
    '  postMessage({ id: e.data.id, dir: core.bestDir(e.data.mat) });\n' +
    '};';
  let aiWorker = null;
  try {
    aiWorker = new Worker(URL.createObjectURL(new Blob([AI_WORKER_SRC], { type: 'application/javascript' })));
  } catch (e) { /* 个别环境禁用 Worker：降级为主线程计算（见 requestAiMove） */ }

  if (aiWorker) {
    aiWorker.onmessage = function (e) {
      aiBusy = false;
      if (!autoOn || e.data.id !== aiReqId) return;   // 过期的回答直接丢弃
      if (e.data.dir) move(e.data.dir);
    };
  }

  function requestAiMove() {
    if (aiBusy) return;
    aiBusy = true;
    if (!aiWorker) {   // 无 Worker 兜底：主线程算（每步几十毫秒，仍可正常代玩）
      window.setTimeout(function () {
        aiBusy = false;
        if (!autoOn || lock || over || paused) return;
        const dir = core.bestDir(mat.slice());
        if (dir) move(dir);
      }, 30);
      return;
    }
    aiReqId++;
    aiWorker.postMessage({ id: aiReqId, mat: mat.slice() });
  }

  document.getElementById('autoBtn').addEventListener('click', function () {
    autoOn = !autoOn;
    this.textContent = autoOn ? '停止代玩' : 'AI 代玩';
    this.classList.toggle('auto-on', autoOn);
    if (autoOn && !lock) requestAiMove();
  });

  /* 驱动：动画锁解除即向 Worker 要下一步；死亡停在结算面板，
     玩家点「再来一局」后 AI 自动接手继续 */
  window.setInterval(function () {
    if (!autoOn || lock) return;
    if (over) return;
    if (paused) { paused = false; hideOverlay(); }
    requestAiMove();
  }, 80);

  /* ---------- 初始化：先铺 16 个底格，再开局 ---------- */
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const bg = document.createElement('div');
      bg.className = 'cellbg';
      bg.style.setProperty('--x', c);
      bg.style.setProperty('--y', r);
      board.appendChild(bg);
    }
  }
  newGame();
  </script>
  <aside class="g-rules" id="rulesPanel" role="complementary" aria-label="游戏规则">
    <button class="g-rules-handle" id="rulesHandle" type="button">玩法</button>
    <div class="g-rules-scroll">
    <h2>游戏规则</h2>
    
      <h3>玩法</h3>
      <ul>
        <li>滑动合并相同数字，每次合并得分翻倍</li>
        <li>合成 2048 即胜利，可继续冲击更高分</li>
        <li>棋盘填满且无可合并时结束</li>
        <li>「AI 代玩」由 AI 托管走棋，成绩不计最高分</li>
      </ul>
      <h3>操作</h3>
      <ul>
        <li>方向键 / WASD / 触屏滑动：推动方块</li>
        <li>新游戏：重开　AI 代玩：AI 接手</li>
      </ul>
    </div>
  </aside>
  <script>
  (function () {
    var panel = document.getElementById('rulesPanel');
    var handle = document.getElementById('rulesHandle');
    var saved = null;
    try { saved = localStorage.getItem('gameRulesOpen'); } catch (e) { }
    var open = saved === null ? window.innerWidth >= 1100 : saved === '1';
    function apply() {
      panel.classList.toggle('closed', !open);
      handle.textContent = open ? '收起' : '玩法';
      handle.setAttribute('aria-label', open ? '收起游戏规则' : '展开游戏规则');
      document.body.classList.toggle('rules-open', open && window.innerWidth >= 1100);
    }
    handle.addEventListener('click', function () {
      open = !open;
      try { localStorage.setItem('gameRulesOpen', open ? '1' : '0'); } catch (e) { }
      apply();
    });
    window.addEventListener('resize', apply);
    apply();
  })();
  </script>
</body>
</html>
