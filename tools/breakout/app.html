<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打砖块 - 拾光集</title>
<link rel="icon" href="../../favicon.svg">
<link rel="canonical" href="https://zengzoxiong.github.io/MySite/tools/breakout/app.html">
<link rel="stylesheet" href="../../assets/game-ui.css">
<style>
/* ===== 打砖块 · 个性色：砖块红 =====
   字体栈、色彩令牌、按钮、覆盖层、规则栏等组件基线统一由共享样式表 game-ui.css 提供，
   深浅色跟随系统；此处只保留游戏私有视觉与少量页面级微调。 */
:root { --game-accent: #FF3B30; }

/* 命（生命）圆点：游戏私有状态视觉，JS 依 .life / .lost 类名动态生成，类名保持不动 */
.lives { display: flex; align-items: center; gap: 5px; }
.life { width: 10px; height: 10px; border-radius: 50%; background: var(--game-accent); display: inline-block; }
.life.lost { background: var(--fill); }

/* 舞台覆盖层整块可点（保留 JS 中 overlay 点击即开始/继续的交互，仅补指针反馈） */
.g-overlay { cursor: pointer; }

/* 规则栏展开时主体让位的平滑过渡（共享样式表只提供位移本身） */
.g-page { transition: padding-right .28s cubic-bezier(.22, .9, .3, 1); }
</style>
</head>
<body class="g-page">
    <a class="g-back-chip" href="../../index.html" aria-label="返回拾光集主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>返回主页</a>

<main class="g-wrap g-wrap-wide">
  <header class="g-nav">
    <h1 class="g-nav-title">打砖块</h1>
    <div class="g-hud-bar">
      <span class="g-stat-inline">分数 <b id="score">0</b></span>
      <span class="g-stat-inline">关卡 <b id="level">1</b></span>
      <span class="g-stat-inline">最高 <b id="best">0</b></span>
      <span id="lives" class="lives"></span>
      <div class="g-ai-group">
        <button id="aiBtn" class="g-btn g-ai-btn g-btn-sm" type="button" aria-pressed="false">AI 代玩</button>
        <span class="g-ai-tag g-ai-tag-auto">AI 代玩中 · 点击停止</span>
      </div>
      <button id="pauseBtn" class="g-btn g-btn-gray g-btn-sm" type="button">暂停</button>
    </div>
  </header>
  <div class="g-stage">
    <canvas id="cv" width="640" height="480"></canvas>
    <div class="g-overlay" id="ovStart">
      <h2 class="g-overlay-title">打砖块</h2>
      <p class="g-overlay-text">移动挡板接住小球，打光全部砖块进入下一关<br>球碰到挡板的位置不同，反弹角度也不同<br>共 3 条命，越往后球速越快</p>
      <button id="btnStart" class="g-btn" type="button">开始游戏</button>
    </div>
    <div class="g-overlay" id="ovOver" hidden>
      <h2 class="g-overlay-title">游戏结束</h2>
      <p class="g-overlay-text" id="overInfo"></p>
      <button id="btnRestart" class="g-btn" type="button">再来一局</button>
    </div>
    <div class="g-overlay" id="ovPause" hidden>
      <h2 class="g-overlay-title">已暂停</h2>
      <button id="btnResume" class="g-btn" type="button">继续游戏</button>
    </div>
  </div>
  <footer class="g-foot">拾光集 · 在线小游戏</footer>
</main>
<script>
(() => {
'use strict';
/*CORE-BEGIN*/
// ======================================================================
// 纯逻辑核心：与 DOM/渲染完全无关的纯函数
// 页面与 tools/breakout/ai-sim.mjs 共用同一份实现——模拟脚本会提取
// CORE-BEGIN/CORE-END 之间的代码在 Node 中直接运行，保证两边逻辑一致。
// ======================================================================
const W=640, H=480, COLS=8, ROWS=6, BW=70, BH=20, GAP=6, TOP=48;
const LEFT=(W-(COLS*BW+(COLS-1)*GAP))/2;
const coreSpeedOf=level=>Math.min(7.6,4.6+(level-1)*.55);   // 每关提速
function coreBuildBricks(g){
  g.bricks=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
    g.bricks.push({x:LEFT+c*(BW+GAP),y:TOP+r*(BH+GAP),row:r,alive:true});
}
function coreResetBall(g){g.ball={x:W/2,y:H-60,vx:0,vy:0,r:7,stuck:true};}
// 创建一局完整状态（rand 可注入随机源，模拟脚本用种子随机保证可复现）
function coreCreateState(rand){
  const g={rand:rand||Math.random,keys:{l:false,r:false},over:false,msg:null,
           level:1,lives:3,score:0,paddle:{x:W/2-46,y:H-36,w:92,h:14}};
  coreBuildBricks(g);coreResetBall(g);
  return g;
}
function coreLaunch(g){
  if(!g.ball.stuck)return;
  const a=g.rand()*.7-.35, v=coreSpeedOf(g.level);   // 随机小角度发射，保证向上
  g.ball.vx=Math.sin(a)*v;g.ball.vy=-Math.cos(a)*v;g.ball.stuck=false;
}
function coreLevelUp(g){
  g.level++;coreBuildBricks(g);coreResetBall(g);
  g.msg={text:'第 '+g.level+' 关，球速提升',t:110};   // 画布居中浮字，约 1.8 秒
}
function coreLoseLife(g){
  g.lives--;
  if(g.lives<=0)g.over=true;   // 命尽：置标记，结算展示交给页面
  else coreResetBall(g);
}
function coreMoveBall(g,k){
  const b=g.ball,r=b.r;
  b.x+=b.vx*k;b.y+=b.vy*k;
  // 墙壁反弹
  if(b.x<r){b.x=r;b.vx=Math.abs(b.vx);}
  if(b.x>W-r){b.x=W-r;b.vx=-Math.abs(b.vx);}
  if(b.y<r){b.y=r;b.vy=Math.abs(b.vy);}
  // 挡板反弹：角度随击中位置偏移（边角更斜，中心更直）
  const p=g.paddle;
  if(b.vy>0&&b.y+r>=p.y&&b.y-r<=p.y+p.h&&b.x>p.x-r&&b.x<p.x+p.w+r){
    const hitPos=Math.max(-1,Math.min(1,(b.x-(p.x+p.w/2))/(p.w/2)));
    const v=Math.hypot(b.vx,b.vy)||coreSpeedOf(g.level);
    b.vx=Math.sin(hitPos*1.05)*v;
    b.vy=-Math.cos(hitPos*1.05)*v;
    b.y=p.y-r-.5;
  }
  // 砖块：按穿透更深的轴决定反弹方向
  for(const br of g.bricks){
    if(!br.alive)continue;
    if(b.x+r>br.x&&b.x-r<br.x+BW&&b.y+r>br.y&&b.y-r<br.y+BH){
      br.alive=false;g.score+=(ROWS-br.row)*10;
      const ox=Math.min(b.x+r-br.x,br.x+BW-(b.x-r));
      const oy=Math.min(b.y+r-br.y,br.y+BH-(b.y-r));
      if(ox<oy)b.vx=-b.vx;else b.vy=-b.vy;
      if(g.bricks.every(x=>!x.alive))coreLevelUp(g);
      break;
    }
  }
  // 掉出底部
  if(b.y-r>H)coreLoseLife(g);
}
// 单帧推进（k 为相对 60fps 的时间系数），物理与原版逐行一致
function coreStep(g,k){
  const p=g.paddle;
  if(g.keys.l)p.x-=8.5*k;
  if(g.keys.r)p.x+=8.5*k;
  p.x=Math.max(8,Math.min(W-8-p.w,p.x));
  if(g.ball.stuck){g.ball.x=p.x+p.w/2;g.ball.y=p.y-g.ball.r-1;}
  else{
    const sp=Math.hypot(g.ball.vx,g.ball.vy),steps=Math.max(1,Math.ceil(sp*k/6));
    for(let i=0;i<steps&&!g.over;i++)coreMoveBall(g,k/steps);   // 分子步推进，防高速穿砖
  }
  if(g.msg){g.msg.t-=k;if(g.msg.t<=0)g.msg=null;}
}
// 把 x 镜面折叠回 [r, W-r]（等价于墙反弹后的位置，用于落点预测）
function coreFoldX(x,r){
  const lo=r,span=W-2*r;
  let m=(x-lo)%(2*span);if(m<0)m+=2*span;
  return m<=span?lo+m:lo+2*span-m;
}
// AI 决策（与渲染无关）：返回 {dir:-1|0|1, launch:boolean}。
// 策略：挡板追踪球的预测落点（匀速直线 + 墙镜面反射外推）；
// 落点所在砖列仍有砖时垂直顶住清列；该列清空后朝最近有砖的列做
// 与距离成比例的小幅偏移，引导球飞向剩余砖块。
function coreAiAction(g){
  const b=g.ball,p=g.paddle;
  if(b.stuck)return{dir:0,launch:true};
  let landX;
  if(b.vy>0){   // 下降：直线外推到挡板高度
    const t=Math.max(0,(p.y-b.r-b.y)/b.vy);
    landX=coreFoldX(b.x+b.vx*t,b.r);
  }else{        // 上升：外推经顶部反弹后落回挡板高度的位置
    const t=(2*b.r-(p.y-b.r)-b.y)/b.vy;
    landX=coreFoldX(b.x+b.vx*t,b.r);
  }
  const colAlive=c=>{for(let i=c;i<g.bricks.length;i+=COLS)if(g.bricks[i].alive)return true;return false;};
  let col=Math.floor((landX-LEFT)/(BW+GAP));
  if(col<0||col>=COLS)col=-1;
  let aim=0;
  if(col<0||!colAlive(col)){
    let bestC=-1,bestD=1e9;
    for(let c=0;c<COLS;c++){
      if(!colAlive(c))continue;
      const d=Math.abs(LEFT+c*(BW+GAP)+BW/2-landX);
      if(d<bestD){bestD=d;bestC=c;}
    }
    if(bestC>=0)aim=Math.max(-.7,Math.min(.7,(LEFT+bestC*(BW+GAP)+BW/2-landX)/240));
  }
  // 让球以 hitPos=aim 撞上挡板：挡板中心应停在 landX-aim*w/2
  const targetX=Math.max(8,Math.min(W-8-p.w,landX-(aim+1)*(p.w/2)));
  return{dir:targetX>p.x+1?1:targetX<p.x-1?-1:0,launch:false};
}
/*CORE-END*/

// ---------- DOM 与渲染 ----------
const COLORS=['#e03131','#e8590c','#f08c00','#2f9e44','#1971c2','#7048e8'];
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const scoreEl=$('score'), bestEl=$('best'), levelEl=$('level'), livesEl=$('lives');
const ovStart=$('ovStart'), ovOver=$('ovOver'), ovPause=$('ovPause'), overInfo=$('overInfo');
const aiBtn=$('aiBtn');

// ---------- 最高分存取 ----------
let best=0;
try{best=+localStorage.getItem('breakoutBest')||0}catch(e){}
function saveBest(v){try{localStorage.setItem('breakoutBest',v)}catch(e){}}
bestEl.textContent=best;

// ---------- 页面状态（核心数据都在纯逻辑状态对象 g 中） ----------
let state='ready';   // ready / playing / paused / over
let g=coreCreateState();
let aiOn=false, aiRestartTimer=null;   // AI 代玩开关与自动续局定时器
const keys={l:false,r:false};          // 手动玩法键盘状态
let shownScore=-1,shownLevel=-1,shownLives=-1;
function syncHud(){
  const s=Math.floor(g.score);
  if(s===shownScore&&g.level===shownLevel&&g.lives===shownLives)return;
  shownScore=s;shownLevel=g.level;shownLives=g.lives;
  scoreEl.textContent=s;levelEl.textContent=g.level;
  livesEl.innerHTML='';
  for(let i=0;i<3;i++){const d=document.createElement('i');d.className='life'+(i<g.lives?'':' lost');livesEl.appendChild(d);}
}
function setPanel(){ovStart.hidden=state!=='ready';ovOver.hidden=state!=='over';ovPause.hidden=state!=='paused';}
function start(){
  if(aiRestartTimer){clearTimeout(aiRestartTimer);aiRestartTimer=null;}
  g=coreCreateState();keys.l=keys.r=false;shownScore=shownLevel=shownLives=-1;
  state='playing';syncHud();setPanel();
}
function pause(){if(state!=='playing')return;state='paused';setPanel();}
function resume(){if(state!=='paused')return;state='playing';setPanel();}
function gameOver(){
  state='over';
  const s=Math.floor(g.score), isNew=!aiOn&&s>best&&s>0;   // AI 代玩成绩不计最高纪录
  if(isNew){best=s;saveBest(s);bestEl.textContent=best;}
  overInfo.textContent='本局得分 '+s+' · 到达第 '+g.level+' 关 · '+(isNew?'新纪录！':'历史最高 '+best);
  setPanel();
  if(aiOn)aiRestartTimer=setTimeout(()=>{   // AI 代玩时自动开下一局
    aiRestartTimer=null;
    if(aiOn&&state==='over')start();
  },1400);
}

// ---------- AI 代玩开关 ----------
function setAi(on){
  aiOn=on;
  aiBtn.textContent=on?'停止 AI':'AI 代玩';
  aiBtn.classList.toggle('is-running',on);
  aiBtn.setAttribute('aria-pressed',on?'true':'false');
  if(aiRestartTimer){clearTimeout(aiRestartTimer);aiRestartTimer=null;}
  if(on){
    if(state==='ready'||state==='over')start();
    else if(state==='paused')resume();
  }
}
aiBtn.addEventListener('click',()=>setAi(!aiOn));

// ---------- 绘制 ----------
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.fill();
}
function draw(){
  ctx.fillStyle='#f7f9fb';ctx.fillRect(0,0,W,H);
  for(const b of g.bricks){
    if(!b.alive)continue;
    ctx.fillStyle=COLORS[b.row];
    roundRect(b.x,b.y,BW,BH,5);
  }
  ctx.fillStyle='#343a40';
  roundRect(g.paddle.x,g.paddle.y,g.paddle.w,g.paddle.h,7);
  ctx.fillStyle='#1a73e8';
  ctx.beginPath();ctx.arc(g.ball.x,g.ball.y,g.ball.r,0,6.3);ctx.fill();
  if(g.msg){
    ctx.fillStyle='rgba(32,33,36,.55)';
    ctx.font='bold 26px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center';
    ctx.fillText(g.msg.text,W/2,H/2);
    ctx.textAlign='left';
  }
  if(aiOn){   // AI 代玩角标
    ctx.fillStyle='rgba(112,72,232,.8)';
    ctx.font='bold 13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='right';
    ctx.fillText('AI 代玩中',W-10,30);
    ctx.textAlign='left';
  }
}

// ---------- 输入：键盘 ----------
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.l=true;e.preventDefault();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){keys.r=true;e.preventDefault();}
  else if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();
    if(state==='ready')start();
    else if(state==='playing')coreLaunch(g);
    else if(state==='paused')resume();
    else if(state==='over')start();
  }else if(e.code==='KeyP'){state==='playing'?pause():resume();}
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=false;
});

// ---------- 输入：鼠标 / 触摸（坐标按显示缩放换算；AI 代玩时不抢控制权） ----------
function gameX(clientX){
  const r=cv.getBoundingClientRect();
  return (clientX-r.left)*W/r.width;
}
cv.addEventListener('mousemove',e=>{if(state==='playing'&&!aiOn)g.paddle.x=gameX(e.clientX)-g.paddle.w/2;});
cv.addEventListener('click',()=>{if(state==='playing'&&!aiOn)coreLaunch(g);});
let tX=null;
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];tX=t.clientX;
  if(state==='playing'&&!aiOn)g.paddle.x=gameX(tX)-g.paddle.w/2;
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(state==='playing'&&!aiOn)g.paddle.x=gameX(e.touches[0].clientX)-g.paddle.w/2;
},{passive:false});
cv.addEventListener('touchend',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  const moved=tX!==null&&Math.abs(t.clientX-tX)>12;   // 明显拖动算移挡板，轻点算发射
  tX=null;
  if(!moved&&state==='playing'&&!aiOn)coreLaunch(g);
},{passive:false});

// ---------- 面板按钮与暂停 ----------
ovStart.addEventListener('click',start);
ovOver.addEventListener('click',start);
ovPause.addEventListener('click',resume);
$('btnStart').addEventListener('click',start);
$('btnRestart').addEventListener('click',start);
$('btnResume').addEventListener('click',resume);
$('pauseBtn').addEventListener('click',()=>{state==='playing'?pause():resume();});
document.addEventListener('visibilitychange',()=>{   // 切后台自动暂停
  if(document.hidden&&state==='playing')pause();
});

// ---------- 主循环 ----------
let last=performance.now();
function loop(t){
  const k=Math.min(t-last,50)/16.667;last=t;   // 钳制大间隔，防跳帧暴走
  if(state==='playing'){
    if(aiOn){   // AI 代玩：决策与移动走纯逻辑，与模拟脚本同一套代码
      const act=coreAiAction(g);
      g.keys.l=act.dir<0;g.keys.r=act.dir>0;
      if(act.launch)coreLaunch(g);
    }else{
      g.keys.l=keys.l;g.keys.r=keys.r;
    }
    coreStep(g,k);
    syncHud();
    if(g.over)gameOver();
  }
  draw();
  requestAnimationFrame(loop);
}
syncHud();setPanel();
requestAnimationFrame(loop);
})();
</script>
  <aside class="g-rules" id="rulesPanel" role="complementary" aria-label="游戏规则">
    <button class="g-rules-handle" id="rulesHandle" type="button">玩法</button>
    <div class="g-rules-scroll">
    <h2>游戏规则</h2>
    
      <h3>玩法</h3>
      <ul>
        <li>移动挡板反弹小球，打掉全部砖块进入下一关</li>
        <li>球打在挡板不同位置，反弹角度不同（边角更斜）</li>
        <li>共 3 条命，漏球扣一条，球速逐关提升</li>
      </ul>
      <h3>操作</h3>
      <ul>
        <li>← → / 鼠标移动 / 触屏拖动：移动挡板</li>
        <li>空格 / 点击：发球　P：暂停</li>
        <li>AI 代玩：一键自动游玩，成绩不计最高分，随时可停止</li>
      </ul>
    </div>
  </aside>
  <script>
  (function () {
    var panel = document.getElementById('rulesPanel');
    var handle = document.getElementById('rulesHandle');
    var saved = null;
    try { saved = localStorage.getItem('gameRulesOpen'); } catch (e) { }
    var open = saved === null ? window.innerWidth >= 1100 : saved === '1';
    function apply() {
      panel.classList.toggle('closed', !open);
      handle.textContent = open ? '收起' : '玩法';
      handle.setAttribute('aria-label', open ? '收起游戏规则' : '展开游戏规则');
      document.body.classList.toggle('rules-open', open && window.innerWidth >= 1100);
    }
    handle.addEventListener('click', function () {
      open = !open;
      try { localStorage.setItem('gameRulesOpen', open ? '1' : '0'); } catch (e) { }
      apply();
    });
    window.addEventListener('resize', apply);
    apply();
  })();
  </script>
</body>
</html>
