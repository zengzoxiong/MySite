<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#eef0f4;color:#3c4043;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:520px;background:#fff;border-radius:16px;box-shadow:0 10px 32px rgba(60,64,67,.12);padding:18px 20px 14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.hud{font-size:13px;color:#5f6368;font-variant-numeric:tabular-nums}
.hud b{color:#202124;font-size:15px;margin:0 2px}
.panel{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;background:#f1f3f4;border-radius:10px;padding:3px}
.seg button{font:inherit;border:0;background:transparent;color:#5f6368;font-size:13px;font-weight:500;padding:6px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:#1a73e8;box-shadow:0 1px 4px rgba(60,64,67,.16);font-weight:600}
.seg button:active{transform:scale(.96)}
.status{font-size:14px;color:#5f6368;margin-bottom:12px;text-align:center;min-height:20px}
/* 棋盘：3x3 玻璃格 */
.board-wrap{position:relative;width:100%;max-width:360px;margin:0 auto}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{position:relative;aspect-ratio:1/1;border:0;border-radius:12px;background:#f1f3f4;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cell:active{transform:scale(.96)}
.cell:disabled{cursor:default;transform:none}
.cell.win{background:#e8f0fe}
/* X 与 O 用纯 CSS 绘制 */
.mark{position:relative;width:52%;height:52%;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.cell.x .mark::before,.cell.x .mark::after{content:"";position:absolute;left:50%;top:50%;width:100%;height:11%;min-height:8px;border-radius:8px;background:#3c4043}
.cell.x .mark::before{transform:translate(-50%,-50%) rotate(45deg)}
.cell.x .mark::after{transform:translate(-50%,-50%) rotate(-45deg)}
.cell.o .mark{border:10px solid #1a73e8;border-radius:50%;width:52%;height:52%;box-sizing:border-box}
/* 胜利连线动画 */
.winline{position:absolute;left:0;top:0;height:8px;border-radius:8px;background:#e5484d;opacity:.85;transform-origin:left center;transform:rotate(0deg) scaleX(0);transition:transform .45s ease;pointer-events:none}
.winline.show{transform:rotate(var(--angle)) scaleX(1)}
.actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:10px;padding:9px 22px;background:#1a73e8;color:#fff;font-weight:600;cursor:pointer}
button:active{transform:scale(.96)}
.btn-plain{background:#f1f3f4;color:#3c4043;padding:9px 18px;font-weight:500}
/* AI 代玩主按钮：醒目蓝色光晕，运行中切换为红色停止态 */
.btn-ai{box-shadow:0 2px 10px rgba(26,115,232,.35)}
.btn-ai.stop{background:#e5484d;box-shadow:0 2px 10px rgba(229,72,77,.35)}
.tips{font-size:12.5px;color:#9aa0a6;text-align:center;margin-top:12px;line-height:1.8}
footer{text-align:center;color:#bdc1c6;font-size:12px;margin-top:10px}
</style>
    <style>

    </style>
    <style>
    /* ===== 右侧规则栏（可收起）=====
       展开时 body 右侧让出面板位，游戏本体居左；收起后仅剩「玩法」竖标签。
       展开偏好存 localStorage，跨游戏页记忆。 */
    .rules-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 272px;
      overflow: visible; /* 把手挂在面板左缘外侧，滚动收进内层 .rules-scroll */
      background: #fff;
      border-left: 1px solid #d7dee8;
      box-shadow: -6px 0 22px rgba(60, 90, 130, .10);
      z-index: 190;
      transform: translateX(0);
      transition: transform .28s cubic-bezier(.22, .9, .3, 1);
      color: #5c7186;
      font: 400 13px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .rules-panel.closed { transform: translateX(100%); }
    /* 规则内容滚动区（面板本体必须 overflow:visible，只能在内层滚） */
    .rules-scroll {
      height: 100%;
      overflow-y: auto;
      padding: 20px 18px;
      box-sizing: border-box;
    }
    .rules-panel h2 {
      font-size: 15px;
      color: #3f5568;
      margin: 0 0 12px;
    }
    .rules-panel h3 {
      font-size: 12.5px;
      color: #4a6f9e;
      margin: 14px 0 4px;
      letter-spacing: 1px;
    }
    .rules-panel ul { margin: 0; padding-left: 18px; }
    .rules-panel li { margin: 4px 0; }
    /* 柜门式把手：挂在面板最左侧中间，随面板滑出滑入 */
    .rules-handle {
      position: absolute;
      left: -30px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 116px;
      padding: 0;
      border: 1px solid #d7dee8;
      border-right: none;
      border-radius: 12px 0 0 12px;
      background: #fff;
      box-shadow: -4px 0 14px rgba(60, 90, 130, .10);
      color: #4a6f9e;
      font: 600 13px/1 inherit;
      letter-spacing: 3px;
      writing-mode: vertical-lr;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .rules-handle:active { transform: translateY(-50%) scale(.96); }
    body { transition: padding-right .28s cubic-bezier(.22, .9, .3, 1); }
    @media (min-width: 1100px) {
      body.rules-open { padding-right: 272px; }
    }
    /* 窄屏：面板变覆盖抽屉，游戏本体不动 */
    @media (max-width: 560px) {
      .rules-panel { width: min(272px, 82vw); }
    }
    </style>
</head>
<body>
    <a class="back-home" href="../../index.html" aria-label="返回拾光集主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>返回主页</a>

<main class="card">
  <header>
    <h1>井字棋</h1>
    <div class="hud">胜 <b id="sWin">0</b> · 平 <b id="sDraw">0</b> · 负 <b id="sLose">0</b></div>
  </header>
  <div class="panel">
    <div class="seg" id="diffSeg">
      <button type="button" data-diff="easy">简单</button>
      <button type="button" data-diff="hard" class="on">困难</button>
    </div>
    <div class="seg" id="firstSeg">
      <button type="button" data-first="player" class="on">玩家先手</button>
      <button type="button" data-first="ai">电脑先手</button>
    </div>
  </div>
  <div class="status" id="statusText">你执 X，点击格子落子</div>
  <div class="board-wrap">
    <div class="board" id="board">
      <button class="cell" type="button" data-i="0"></button>
      <button class="cell" type="button" data-i="1"></button>
      <button class="cell" type="button" data-i="2"></button>
      <button class="cell" type="button" data-i="3"></button>
      <button class="cell" type="button" data-i="4"></button>
      <button class="cell" type="button" data-i="5"></button>
      <button class="cell" type="button" data-i="6"></button>
      <button class="cell" type="button" data-i="7"></button>
      <button class="cell" type="button" data-i="8"></button>
    </div>
    <div class="winline" id="winLine"></div>
  </div>
  <div class="actions">
    <button id="newBtn" type="button">重新开局</button>
    <button class="btn-ai" id="aiBtn" type="button">AI 代玩</button>
  </div>
  <footer>拾光集 · 在线小游戏</footer>
</main>
<script>
(() => {
'use strict';

// ================= 元素引用 =================
const cells = Array.from(document.querySelectorAll('.cell'));
const statusText = document.getElementById('statusText');
const winLine = document.getElementById('winLine');
const sWin = document.getElementById('sWin');
const sDraw = document.getElementById('sDraw');
const sLose = document.getElementById('sLose');
const diffSeg = document.getElementById('diffSeg');
const firstSeg = document.getElementById('firstSeg');
const newBtn = document.getElementById('newBtn');

// ================= 比分存取（localStorage，带 slug 前缀） =================
let score = { win: 0, draw: 0, lose: 0 };
try {
  const raw = localStorage.getItem('tic-tac-toe-score');
  if (raw) {
    const obj = JSON.parse(raw);
    for (const k of ['win', 'draw', 'lose']) if (typeof obj[k] === 'number') score[k] = obj[k];
  }
} catch (e) { /* 读失败用默认值 */ }
function saveScore() {
  try { localStorage.setItem('tic-tac-toe-score', JSON.stringify(score)); } catch (e) {}
}
function updateHud() {
  sWin.textContent = score.win;
  sDraw.textContent = score.draw;
  sLose.textContent = score.lose;
}
updateHud();

// ================= 对局状态（纯函数核心，与渲染无关） =================
/* ===== AI_CORE_BEGIN（ai-sim.mjs 依赖此标记提取同一份逻辑，两端必须同步修改）===== */
function aiCoreTicTacToe() {
  'use strict';
  // 8 条胜利线：三行、三列、两斜
  const WINS = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],  // 三行
    [0, 3, 6], [1, 4, 7], [2, 5, 8],  // 三列
    [0, 4, 8], [2, 4, 6]              // 两斜
  ];

  // 判定胜负：返回胜者标记，平局返回 'D'，未结束返回 ''
  function winnerOf(b) {
    for (const [a, c, d] of WINS) {
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
    }
    return b.every(Boolean) ? 'D' : '';
  }

  // 新局状态：9 格棋盘（'' / 'X' / 'O'）+ 当前行棋方，纯数据
  function freshGame(firstMark) {
    return { board: new Array(9).fill(''), turn: firstMark === 'O' ? 'O' : 'X' };
  }

  // 单步推进：在 i 位落当前行棋方的子，返回新状态（不修改原状态）
  function stepGame(state, i) {
    const board = state.board.slice();
    if (i < 0 || i > 8 || board[i]) return { board, turn: state.turn, winner: winnerOf(board) };
    board[i] = state.turn;
    return { board, turn: state.turn === 'X' ? 'O' : 'X', winner: winnerOf(board) };
  }

  // minimax 全搜索（3x3 全展开，保证不败）：
  // 返回分值：aiMark 赢为正（越快赢分越高），对手赢为负（越慢输分越高），平局 0
  function minimax(b, side, depth, aiMark, oppMark) {
    const w = winnerOf(b);
    if (w === aiMark) return 10 - depth;
    if (w === oppMark) return depth - 10;
    if (w === 'D') return 0;
    let best = side === aiMark ? -Infinity : Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = side;
      const s = minimax(b, side === aiMark ? oppMark : aiMark, depth + 1, aiMark, oppMark);
      b[i] = '';
      best = side === aiMark ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }

  // 完美选点：返回 aiMark 的最佳落子位（保证不败），棋盘已满返回 -1
  function bestMove(b, aiMark, oppMark) {
    let best = -Infinity, move = -1;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = aiMark;
      const s = minimax(b, oppMark, 1, aiMark, oppMark);
      b[i] = '';
      if (s > best) { best = s; move = i; }
    }
    return move;
  }

  return { WINS, winnerOf, freshGame, stepGame, minimax, bestMove };
}
/* ===== AI_CORE_END ===== */
const core = aiCoreTicTacToe();   // 主线程实例：状态推进与胜负判定复用核心纯函数

// 页面对局状态镜像：每次落子经 core.stepGame 推进，渲染只读不写
let state = core.freshGame('X'); // { board, turn }
let playerMark = 'X';                // 玩家执子（先手时 X，电脑先手时 O）
let aiMark = 'O';
let diff = 'hard';                   // easy / hard
let over = false;
let aiTimer = null;

// 电脑选点：困难档取最优；简单档 30% 概率随机落子
function pickMove() {
  const b = state.board;
  const empties = [];
  for (let i = 0; i < 9; i++) if (!b[i]) empties.push(i);
  if (!empties.length) return -1;
  if (diff === 'easy' && empties.length > 1 && Math.random() < 0.3) {
    return empties[Math.floor(Math.random() * empties.length)];
  }
  return core.bestMove(b, aiMark, playerMark);
}

// 落一子并推进对局（点击、对方 AI、AI 代玩共用），返回胜负结果（'' 为未结束）
function applyMove(i) {
  state = core.stepGame(state, i);
  render();
  return state.winner;
}

// ================= 渲染与流程 =================
function render() {
  const b = state.board;
  for (let i = 0; i < 9; i++) {
    const cell = cells[i];
    cell.classList.toggle('x', b[i] === 'X');
    cell.classList.toggle('o', b[i] === 'O');
    if (!b[i]) cell.innerHTML = '';
    else if (!cell.firstChild) cell.innerHTML = '<span class="mark"></span>';
  }
}

function setBusy(busy) {
  for (const cell of cells) cell.disabled = busy || over || !!state.board[cell.dataset.i];
}

function endGame(w) {
  over = true;
  setBusy(true);
  if (aiRunning) {
    // AI 代玩局只做演示，不计胜平负比分
    statusText.textContent = w === 'D' ? 'AI 对弈平局，即将自动开新局'
      : (w === playerMark ? 'AI 托管方获胜，即将自动开新局' : '电脑获胜，即将自动开新局');
  } else if (w === 'D') {
    score.draw += 1;
    statusText.textContent = '棋逢对手，本局平局';
  } else if (w === playerMark) {
    score.win += 1;
    statusText.textContent = '你赢了，漂亮的一局';
  } else {
    score.lose += 1;
    statusText.textContent = '电脑获胜，再接再厉';
  }
  if (!aiRunning) { saveScore(); updateHud(); }
  if (w !== 'D') {
    // 画出胜利连线并播放生长动画
    const line = core.WINS.find(([a, c, d]) => state.board[a] === w && state.board[a] === state.board[c] && state.board[a] === state.board[d]);
    for (const i of line) cells[i].classList.add('win');
    drawWinLine(line);
  }
}

// 依据胜线上首尾格子的中心点计算连线的位置、长度与角度
function drawWinLine(line) {
  const wrap = document.querySelector('.board-wrap');
  const rect = wrap.getBoundingClientRect();
  const gap = 8;
  const size = (rect.width - gap * 2) / 3;   // 单格边长（棋盘 3 格 + 2 缝）
  const center = i => {
    const r = i % 3, c = Math.floor(i / 3);
    return {
      x: r * (size + gap) + size / 2,
      y: c * (size + gap) + size / 2
    };
  };
  const a = center(line[0]), b = center(line[2]);
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.sqrt(dx * dx + dy * dy) + size * 0.5;  // 两端各多出半格更饱满
  const angle = Math.atan2(dy, dx);
  winLine.style.left = (a.x - size * 0.25 * Math.cos(angle)) + 'px';
  winLine.style.top = (a.y - size * 0.25 * Math.sin(angle)) + 'px';
  winLine.style.width = len + 'px';
  winLine.style.setProperty('--angle', angle + 'rad');
  // 先复位再展开，保证每次都触发生长动画
  winLine.classList.remove('show');
  void winLine.offsetWidth;
  winLine.classList.add('show');
}

function aiMove() {
  aiTimer = null;
  if (over) return;
  const i = pickMove();
  if (i < 0) return;
  const w = applyMove(i);
  if (w) { endGame(w); return; }
  if (aiRunning) {
    statusText.textContent = 'AI 托管中，即将落子';
    setBusy(true);
  } else {
    statusText.textContent = '轮到你了（执 ' + playerMark + '）';
    setBusy(false);
  }
}

function newGame() {
  if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
  state = core.freshGame('X');   // 新局：X 先手
  over = false;
  winLine.classList.remove('show');
  for (const cell of cells) cell.classList.remove('win');
  render();
  if (playerMark === 'X') {
    statusText.textContent = aiRunning ? 'AI 托管中，自动对局进行中' : '你执 X，点击格子落子';
    setBusy(aiRunning);
  } else {
    // 电脑先手：AI 执 X 立即落子
    statusText.textContent = aiRunning ? 'AI 托管中，电脑执 X 先手' : '电脑执 X 先手，思考中';
    setBusy(true);
    aiTimer = setTimeout(aiMove, 350);
  }
}

// ================= AI 代玩：托管玩家方落子，自动续局 =================
const aiBtn = document.getElementById('aiBtn');
let aiRunning = false;   // AI 代玩开关
let aiDemoTimer = 0;     // 代玩步进定时器句柄

// 停止代玩：恢复按钮与提示，玩家可继续手动游玩
function stopAi(msg) {
  if (!aiRunning) return;
  aiRunning = false;
  clearTimeout(aiDemoTimer);
  aiBtn.textContent = 'AI 代玩';
  aiBtn.classList.remove('stop');
  if (!over) setBusy(false);
  statusText.textContent = msg || 'AI 已停止，可继续手动游玩';
}

// 代玩步进：轮到玩家方时用完美 minimax 落子，局末自动开下一局
function aiDemoTick() {
  if (!aiRunning) return;
  if (over) {
    aiDemoTimer = setTimeout(() => {
      if (!aiRunning) return;
      if (over) newGame();   // 期间被用户手动开局则顺势继续
      aiDemoTimer = setTimeout(aiDemoTick, 400);
    }, 1600);
    return;
  }
  if (state.turn === playerMark && !aiTimer) {
    const i = core.bestMove(state.board, playerMark, aiMark);
    if (i >= 0) {
      const w = applyMove(i);
      if (w) { endGame(w); aiDemoTimer = setTimeout(aiDemoTick, 400); return; }
      statusText.textContent = 'AI 托管落子，电脑思考中';
      setBusy(true);
      aiTimer = setTimeout(aiMove, 320);
    }
  }
  aiDemoTimer = setTimeout(aiDemoTick, 380);   // 对方行棋期间轮询等待
}

aiBtn.addEventListener('click', () => {
  if (aiRunning) { stopAi(); return; }
  if (over) newGame();
  aiRunning = true;
  aiBtn.textContent = '停止代玩';
  aiBtn.classList.add('stop');
  statusText.textContent = 'AI 托管中，点击「停止代玩」可随时停下';
  setBusy(true);
  aiDemoTick();
});

// ================= 事件 =================
for (const cell of cells) {
  cell.addEventListener('click', () => {
    const i = Number(cell.dataset.i);
    if (over || aiRunning || state.turn !== playerMark || state.board[i]) return;
    const w = applyMove(i);
    if (w) { endGame(w); return; }
    statusText.textContent = '电脑思考中';
    setBusy(true);
    aiTimer = setTimeout(aiMove, 300);
  });
}

// 难度切换
diffSeg.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  diff = btn.dataset.diff;
  for (const b of diffSeg.querySelectorAll('button')) b.classList.toggle('on', b === btn);
  newGame();
});

// 先手切换：双方互换执子
firstSeg.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  for (const b of firstSeg.querySelectorAll('button')) b.classList.toggle('on', b === btn);
  if (btn.dataset.first === 'player') {
    playerMark = 'X'; aiMark = 'O';
  } else {
    playerMark = 'O'; aiMark = 'X';
  }
  newGame();
});

newBtn.addEventListener('click', () => { stopAi(); newGame(); });   // 重新开局会先停掉 AI

// ================= 启动 =================
newGame();
})();
</script>
  <aside class="rules-panel" id="rulesPanel" role="complementary" aria-label="游戏规则">
    <button class="rules-handle" id="rulesHandle" type="button">玩法</button>
    <div class="rules-scroll">
    <h2>游戏规则</h2>
    
      <h3>玩法</h3>
      <ul>
        <li>你执 X 先手，电脑执 O，先把三子连成一线即胜</li>
        <li>困难档电脑用 minimax 算法几乎不败；简单档会留活路</li>
        <li>比分（胜 / 平 / 负）自动累计，可切换难度与先后手</li>
      </ul>
      <h3>操作</h3>
      <ul>
        <li>点击格子落子；顶部按钮切换难度、先后手</li>
        <li>点「AI 代玩」由 AI 托管你的落子并自动续局，随时可停（不计比分）</li>
      </ul>
    </div>
  </aside>
  <script>
  (function () {
    var panel = document.getElementById('rulesPanel');
    var handle = document.getElementById('rulesHandle');
    var saved = null;
    try { saved = localStorage.getItem('gameRulesOpen'); } catch (e) { }
    var open = saved === null ? window.innerWidth >= 1100 : saved === '1';
    function apply() {
      panel.classList.toggle('closed', !open);
      handle.textContent = open ? '收起' : '玩法';
      handle.setAttribute('aria-label', open ? '收起游戏规则' : '展开游戏规则');
      document.body.classList.toggle('rules-open', open && window.innerWidth >= 1100);
    }
    handle.addEventListener('click', function () {
      open = !open;
      try { localStorage.setItem('gameRulesOpen', open ? '1' : '0'); } catch (e) { }
      apply();
    });
    window.addEventListener('resize', apply);
    apply();
  })();
  </script>
</body>
