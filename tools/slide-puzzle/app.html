<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字华容道 - 拾光集</title>
  <meta name="description" content="拾光集在线小游戏：数字华容道（滑块拼图），3×3 / 4×4 / 5×5 三档难度，纯本地运行。">
  <link rel="icon" href="../../favicon.svg">
  <link rel="canonical" href="https://zengzoxiong.github.io/MySite/tools/slide-puzzle/app.html">
  <style>
    /* ===== 数字华容道 · 拾光集自建小游戏（纯静态零依赖，固定亮色样式） ===== */
    [hidden] { display: none !important; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f3f6f9;
      color: #4d5d6c;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 26px 16px 40px;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap { width: 100%; max-width: 440px; }

    header { margin-bottom: 14px; }
    h1 { font-size: 30px; color: #3f5568; letter-spacing: 1px; }
    .sub { margin-top: 6px; font-size: 13px; color: #8ba0b2; }

    .hud { display: flex; gap: 10px; margin-bottom: 12px; }
    .stat {
      flex: 1;
      background: #fff;
      border: 1px solid #e2eaf1;
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(90, 120, 150, .10);
    }
    .stat .lab { display: block; font-size: 12px; color: #93a8ba; letter-spacing: 3px; }
    .stat .val { display: block; margin-top: 2px; font-size: 22px; font-weight: 700; color: #3f5568; font-variant-numeric: tabular-nums; }
    .btn {
      border: 0;
      background: #4f7ea8;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      padding: 0 18px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(79, 126, 168, .35);
      touch-action: manipulation;
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: #3f9d6d; }
    .hud .btn { align-self: stretch; }

    /* 难度档位 */
    .seg { display: flex; gap: 8px; margin-bottom: 12px; }
    .seg button {
      flex: 1;
      border: 1px solid #dfe8f0;
      background: #fff;
      color: #5b6b7a;
      padding: 8px 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
    }
    .seg button.active { background: #4f7ea8; border-color: #4f7ea8; color: #fff; }

    /* 棋盘：底格与数字块均绝对定位，坐标由 CSS 变量 --x/--y 配合 --n 经 calc 换算，换档免重算像素 */
    .board {
      --gap: 8px;
      --n: 4;
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: #b7c6d3;
      border-radius: 14px;
      user-select: none;
      -webkit-user-select: none;
    }
    .p-bg, .p-tile {
      --tw: calc((100% - (var(--n) + 1) * var(--gap)) / var(--n));
      position: absolute;
      width: var(--tw);
      height: var(--tw);
      border-radius: 10px;
      left: calc(var(--gap) + var(--x) * (var(--tw) + var(--gap)));
      top:  calc(var(--gap) + var(--y) * (var(--tw) + var(--gap)));
    }
    .p-bg { background: rgba(255, 255, 255, .30); }
    .p-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #ffffff, #f1f5f9);
      color: #3f5568;
      font-size: calc(var(--tw-px, 60px) / 2.3); /* 同 2048：字号用实像素，--tw 的 100% 进 font-size 是父字号 */
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 6px rgba(50, 75, 100, .28);
      cursor: pointer;
      z-index: 1;
      transition: left .12s ease, top .12s ease;
    }
    .p-tile:active { transform: scale(.95); }
    .noanim .p-tile { transition: none; }   /* 开局摆放瞬移到位，不播过渡 */

    /* 胜利弹层（含彩带庆祝） */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      border-radius: 14px;
      background: rgba(248, 251, 253, .88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      overflow: hidden;
      opacity: 0;
      transition: opacity .25s ease;
    }
    .overlay.open { opacity: 1; }
    .ov-title { font-size: 34px; font-weight: 800; color: #3f5568; }
    .ov-sub { font-size: 14px; color: #6d8296; padding: 0 16px; }
    .overlay .btn { padding: 10px 22px; }
    .confetti { position: absolute; inset: 0; pointer-events: none; }
    .cf { position: absolute; top: -14px; border-radius: 2px; animation: cf-fall linear forwards; }
    @keyframes cf-fall { to { transform: translateY(450px) rotate(560deg); } }

    .best { margin-top: 12px; text-align: center; font-size: 13px; color: #7b93a7; font-variant-numeric: tabular-nums; }
    .hint { margin-top: 6px; text-align: center; font-size: 13px; color: #9db0c0; }
    footer { margin-top: 24px; text-align: center; font-size: 12px; color: #b4c4d1; }
  </style>
    <style>
    /* 返回主页按钮（fixed 定位不挤占各页布局） */
    .back-home {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 13px;
      border-radius: 10px;
      background: #fff;
      color: #4a6f9e;
      border: 1px solid #d3dfee;
      box-shadow: 0 2px 8px rgba(60, 90, 130, .12);
      font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-decoration: none;
      touch-action: manipulation;
    }
    .back-home:hover { background: #f0f6fc; }
    .back-home:active { transform: translateY(1px); }
    .back-home svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (max-width: 560px) {
      .back-home { top: 8px; left: 8px; padding: 7px 10px; font-size: 12px; }
    }
    </style>
</head>
<body>
    <a class="back-home" href="../../index.html" aria-label="返回拾光集主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>返回主页</a>

  <main class="wrap">
    <header>
      <h1>数字华容道</h1>
      <p class="sub">把数字块滑回 1 到 N 的顺序</p>
    </header>

    <section class="hud">
      <div class="stat"><span class="lab">步数</span><span class="val" id="moves">0</span></div>
      <div class="stat"><span class="lab">用时</span><span class="val" id="time">0:00</span></div>
      <button class="btn" id="newBtn" type="button">新游戏</button>
    </section>

    <div class="seg" id="seg">
      <button type="button" data-size="3">3×3</button>
      <button type="button" data-size="4" class="active">4×4</button>
      <button type="button" data-size="5">5×5</button>
    </div>

    <div class="board" id="board">
      <div class="overlay" id="overlay" hidden>
        <div class="confetti" id="confetti"></div>
        <p class="ov-title">完成！</p>
        <p class="ov-sub" id="ovStats"></p>
        <button class="btn primary" id="againBtn" type="button">再来一局</button>
      </div>
    </div>

    <p class="best" id="bestLine"></p>
    <p class="hint">点击空位旁的数字块即可滑动；也可用方向键 / WASD，按数字块滑动的方向按键。</p>
    <footer>拾光集 · 在线小游戏 · 纯本地运行</footer>
  </main>

  <script>
  'use strict';
  /* ================= 数字华容道主逻辑（零依赖，纯本地运行） ================= */
  const board = document.getElementById('board');

  // 格子实际边长写进 --tw-px 供字号使用；--n 随档位变化，换档与窗口变化都要同步
  function syncTileFont() {
    const gap = parseFloat(getComputedStyle(board).getPropertyValue('--gap')) || 8;
    const n = parseInt(getComputedStyle(board).getPropertyValue('--n')) || 4;
    const tw = (board.clientWidth - (n + 1) * gap) / n;
    board.style.setProperty('--tw-px', tw.toFixed(2) + 'px');
  }
  syncTileFont();
  window.addEventListener('resize', syncTileFont);
  const movesEl = document.getElementById('moves');
  const timeEl = document.getElementById('time');
  const bestLine = document.getElementById('bestLine');
  const overlay = document.getElementById('overlay');
  const ovStats = document.getElementById('ovStats');
  const confetti = document.getElementById('confetti');

  let n = 4;             // 当前档位（3 / 4 / 5）
  let cells = [];        // cells[i] = 该格数字，0 表示空位
  let els = [];          // els[v] = 数字 v 对应的 DOM 元素
  let blankIdx = 0;      // 空位下标
  let moves = 0;
  let seconds = 0;
  let timerId = null;
  let over = false;

  /* ---------- 本地存储（按档位分别记录最佳，读写都兜底） ---------- */
  function bestKey() { return 'slide-puzzle.best.' + n; }
  function loadBest() {
    try {
      const raw = localStorage.getItem(bestKey());
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveBest(mv, sec) {
    try { localStorage.setItem(bestKey(), JSON.stringify({ moves: mv, time: sec })); }
    catch (e) { /* 写入失败时静默忽略 */ }
  }

  /* ---------- 计时 ---------- */
  function fmt(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }
  function startTimer() {
    stopTimer();
    timerId = window.setInterval(function () {
      seconds++;
      timeEl.textContent = fmt(seconds);
    }, 1000);
  }
  function stopTimer() {
    if (timerId) { window.clearInterval(timerId); timerId = null; }
  }

  /* ---------- 棋盘构建 ---------- */
  function setXY(el, x, y) {
    el.style.setProperty('--x', x);
    el.style.setProperty('--y', y);
  }
  function buildDom() {
    board.querySelectorAll('.p-tile, .p-bg').forEach(function (el) { el.remove(); });
    els = [];
    for (let i = 0; i < n * n; i++) {
      const bg = document.createElement('div');
      bg.className = 'p-bg';
      setXY(bg, i % n, Math.floor(i / n));
      board.appendChild(bg);
    }
    for (let v = 1; v < n * n; v++) {
      const el = document.createElement('div');
      el.className = 'p-tile';
      el.textContent = v;
      el.addEventListener('click', function () { moveCell(cells.indexOf(v)); });
      board.appendChild(el);
      els[v] = el;
    }
  }
  function renderAll(instant) {
    if (instant) board.classList.add('noanim');
    for (let i = 0; i < cells.length; i++) {
      if (cells[i] === 0) { blankIdx = i; continue; }
      setXY(els[cells[i]], i % n, Math.floor(i / n));
    }
    if (instant) { void board.offsetWidth; board.classList.remove('noanim'); }
  }

  /* ---------- 打乱：从完成态随机逆推 N 步，保证必然可解 ---------- */
  function shuffleBoard() {
    const steps = n === 3 ? 160 : n === 4 ? 320 : 520;
    let blank = n * n - 1;
    let prev = -1;                        // 上一次空位所在格，避免原地来回蹭
    for (let s = 0; s < steps; s++) {
      const r = Math.floor(blank / n), c = blank % n;
      const opts = [];
      if (r > 0) opts.push(blank - n);
      if (r < n - 1) opts.push(blank + n);
      if (c > 0) opts.push(blank - 1);
      if (c < n - 1) opts.push(blank + 1);
      const cand = prev >= 0 ? opts.filter(function (i) { return i !== prev; }) : opts;
      const pick = cand[Math.floor(Math.random() * cand.length)];
      cells[blank] = cells[pick];
      cells[pick] = 0;
      prev = blank;
      blank = pick;
    }
    blankIdx = blank;
    if (isSolved()) shuffleBoard();       // 概率极低地回到原状，重洗兜底
  }

  /* ---------- 移动 ---------- */
  function isSolved() {
    for (let i = 0; i < n * n; i++) {
      if (cells[i] !== (i + 1) % (n * n)) return false;
    }
    return true;
  }
  function moveCell(idx) {
    if (over || idx < 0 || cells[idx] === 0) return;
    const r = Math.floor(idx / n), c = idx % n;
    const br = Math.floor(blankIdx / n), bc = blankIdx % n;
    if (Math.abs(r - br) + Math.abs(c - bc) !== 1) return;   // 必须与空位相邻
    const v = cells[idx];
    cells[blankIdx] = v;
    cells[idx] = 0;
    setXY(els[v], bc, br);                  // 数字块滑进空位
    blankIdx = idx;
    moves++;
    movesEl.textContent = moves;
    if (!timerId) startTimer();             // 首次移动才开始计时
    if (isSolved()) winGame();
  }

  /* ---------- 胜利 ---------- */
  function winGame() {
    over = true;
    stopTimer();
    const old = loadBest();
    let record = false;
    if (!old || moves < old.moves || (moves === old.moves && seconds < old.time)) {
      record = true;
      saveBest(moves, seconds);
    }
    ovStats.textContent = '步数 ' + moves + ' · 用时 ' + fmt(seconds) + (record ? ' · 新纪录！' : '');
    overlay.hidden = false;
    void overlay.offsetWidth;               // 同步回流后再加 open，保证过渡生效
    overlay.classList.add('open');
    spawnConfetti();
    updateBestLine();
  }
  function spawnConfetti() {
    confetti.innerHTML = '';
    const colors = ['#f94144', '#f3722c', '#f8961e', '#f9c74f', '#90be6d', '#43aa8b', '#577590', '#9b5de5'];
    for (let i = 0; i < 42; i++) {
      const p = document.createElement('span');
      p.className = 'cf';
      const size = 5 + Math.random() * 6;
      p.style.left = (Math.random() * 100) + '%';
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
      p.style.animationDelay = (Math.random() * 0.8) + 's';
      p.style.opacity = (0.65 + Math.random() * 0.35).toFixed(2);
      confetti.appendChild(p);
    }
  }

  /* ---------- 开局 ---------- */
  function newGame(size) {
    n = size;
    board.style.setProperty('--n', n);
    syncTileFont();
    stopTimer();
    moves = 0; seconds = 0; over = false;
    movesEl.textContent = '0';
    timeEl.textContent = '0:00';
    overlay.classList.remove('open');
    overlay.hidden = true;
    cells = Array.from({ length: n * n }, function (_, i) { return (i + 1) % (n * n); });
    shuffleBoard();
    buildDom();
    renderAll(true);
    updateBestLine();
    updateSeg();
  }
  function updateBestLine() {
    const b = loadBest();
    bestLine.textContent = n + '×' + n + ' 最佳：' + (b ? b.moves + ' 步 / ' + fmt(b.time) : '暂无');
  }
  function updateSeg() {
    document.querySelectorAll('#seg button').forEach(function (b) {
      b.classList.toggle('active', Number(b.dataset.size) === n);
    });
  }

  /* ---------- 输入：档位与按钮 ---------- */
  document.querySelectorAll('#seg button').forEach(function (b) {
    b.addEventListener('click', function () { newGame(Number(b.dataset.size)); });
  });
  document.getElementById('newBtn').addEventListener('click', function () { newGame(n); });
  document.getElementById('againBtn').addEventListener('click', function () { newGame(n); });

  /* ---------- 输入：键盘（方向键 = 数字块滑动的方向） ---------- */
  const KEYMAP = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    A: 'left', D: 'right', W: 'up', S: 'down'
  };
  function moveByKey(dir) {
    if (over) return;
    const br = Math.floor(blankIdx / n), bc = blankIdx % n;
    if (dir === 'left' && bc < n - 1) moveCell(blankIdx + 1);       // 空位右侧的块向左滑
    else if (dir === 'right' && bc > 0) moveCell(blankIdx - 1);     // 空位左侧的块向右滑
    else if (dir === 'up' && br < n - 1) moveCell(blankIdx + n);    // 空位下方的块向上滑
    else if (dir === 'down' && br > 0) moveCell(blankIdx - n);      // 空位上方的块向下滑
  }
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const dir = KEYMAP[e.key];
    if (!dir) return;
    e.preventDefault();
    moveByKey(dir);
  });

  /* ---------- 启动 ---------- */
  newGame(4);
  </script>
</body>
</html>
