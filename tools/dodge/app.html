<script>
(function () {
'use strict';

/* ================= 基本常量 ================= */
var W = 420, H = 640;          // 逻辑分辨率
var SHIP_Y = H - 84;           // 飞船固定纵坐标
var SHIP_R = 13;               // 飞船碰撞半径
var SHIELD_DUR = 10;           // 护盾持续秒数

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var stage = document.getElementById('stage');
var ov = document.getElementById('ov');
var elScore = document.getElementById('score');
var elBest = document.getElementById('best');
var elShield = document.getElementById('shieldBox');
var elShieldT = document.getElementById('shieldT');
var aiBtn = document.getElementById('aiBtn');
var aiTag = document.getElementById('aiTag');

/* 高分屏适配 */
(function fit() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr;
  cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
})();

/* ================= 最高分（带 slug 前缀，读写均包 try/catch） ================= */
var BEST_KEY = 'dodge_best';
var best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }

/* ================= 界面状态（渲染层） ================= */
var state = 'ready';   // ready | playing | dying | over | paused
var shownScore = -1;
var dieT = 0, overGuard = 0;
var parts = [];        // 粒子
var stars = [];        // 背景星空
var aiOn = false;      // AI 代玩开关
var aiClock = 0;       // AI 决策间隔计时

/* ================= 游戏核心状态 G =================
   玩法数据全部收在 G 里，由下方纯函数读写；渲染层只读不写。 */
var G = null;

/* ================= 难度曲线（纯函数） ================= */
function mulFor(t) { return Math.min(2.2, 1 + t / 70); }
function intervalFor(t) { return Math.max(0.34, 1.05 - t * 0.011); }

/* ================= 纯函数核心（渲染无关；与 ai-sim.mjs 同名实现保持一致） =================
   约定：不读写任何 DOM；随机源 rng 由调用方注入（页面传 Math.random，模拟脚本传种子随机）。
   G 结构：
   { t 存活秒, score, shipX 飞船横坐标, tx 目标横坐标, keys {left,right},
     meteors [], pickups [], spawnT 陨石生成倒计时, nextPickup 下次道具时刻, shieldLeft 护盾剩余秒 } */
function freshCore(rng) {
  return {
    t: 0, score: 0,
    shipX: W / 2, tx: null,
    keys: { left: false, right: false },
    meteors: [],
    pickups: [],
    spawnT: 0.9,                       // 开局稍等再落第一颗
    nextPickup: 8 + rng() * 5,
    shieldLeft: 0
  };
}

/* 生成陨石：x/y/vx/vy/r 为玩法字段，其余仅供绘制 */
function spawnMeteorCore(c, rng) {
  var r = 13 + rng() * 27;
  c.meteors.push({
    x: r + rng() * (W - 2 * r),
    y: -r - 12,
    vx: (rng() * 2 - 1) * 46 * mulFor(c.t),
    vy: (95 + rng() * 115) * mulFor(c.t),
    r: r,
    /* ↓ 以下为纯装饰字段，不影响玩法（模拟脚本省略） */
    rot: rng() * Math.PI * 2,
    vr: (rng() * 2 - 1) * 2.6,
    verts: (function () {
      var n = 6 + (rng() * 4 | 0), vs = [];
      for (var i = 0; i < n; i++) vs.push(0.72 + rng() * 0.42);
      return vs;
    })(),
    craters: (function () {
      var cn = 2 + (rng() * 2 | 0), cs = [];
      for (var j = 0; j < cn; j++) {
        var a = rng() * Math.PI * 2, d = rng() * r * 0.45;
        cs.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, r: r * (0.12 + rng() * 0.16) });
      }
      return cs;
    })(),
    hue: 16 + rng() * 24
  });
}

function spawnPickupCore(c, rng) {
  c.pickups.push({ x: 30 + rng() * (W - 60), y: -24, vy: 105, ph: rng() * Math.PI * 2 });
}

/* 飞船移动：键盘恒速 / 指针与 AI 目标点平滑跟随 */
function moveShipCore(c, dt) {
  var kb = (c.keys.right ? 1 : 0) - (c.keys.left ? 1 : 0);
  if (kb !== 0) {
    c.shipX += kb * 430 * dt;   // 键盘：恒速移动
    c.tx = null;
  } else if (c.tx !== null) {
    c.shipX += (c.tx - c.shipX) * Math.min(1, dt * 14);   // 指针：平滑跟随
  }
  c.shipX = Math.max(22, Math.min(W - 22, c.shipX));
}

/* 核心单步推进：改写 c 并返回 {died, smashed, gotPickup} */
function stepCore(c, dt, rng) {
  var res = { died: false, smashed: 0, gotPickup: false };
  c.t += dt;
  c.score = Math.floor(c.t * 10);   // 每秒 +10
  if (c.shieldLeft > 0) {
    c.shieldLeft = Math.max(0, c.shieldLeft - dt);
  }
  moveShipCore(c, dt);

  /* 陨石生成 */
  c.spawnT -= dt;
  if (c.spawnT <= 0) { spawnMeteorCore(c, rng); c.spawnT = intervalFor(c.t); }

  /* 护盾道具生成 */
  if (c.t >= c.nextPickup) {
    spawnPickupCore(c, rng);
    c.nextPickup = c.t + 11 + rng() * 8;
  }

  /* 陨石更新与碰撞 */
  for (var mi = c.meteors.length - 1; mi >= 0; mi--) {
    var m = c.meteors[mi];
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    if ((m.x < m.r && m.vx < 0) || (m.x > W - m.r && m.vx > 0)) m.vx = -m.vx;   // 左右反弹
    if (m.y > H + m.r + 40) { c.meteors.splice(mi, 1); continue; }
    var rr = m.r * 0.82 + SHIP_R;   // 判定圆略缩小，手感更宽容
    var dx = m.x - c.shipX, dy = m.y - SHIP_Y;
    if (dx * dx + dy * dy < rr * rr) {
      if (c.shieldLeft > 0) {
        res.smashed++;              // 无敌期间撞碎陨石
        c.meteors.splice(mi, 1);
      } else {
        res.died = true;
        return res;
      }
    }
  }

  /* 道具下落与拾取 */
  for (var qi = c.pickups.length - 1; qi >= 0; qi--) {
    var q = c.pickups[qi];
    q.y += q.vy * dt;
    var qy = q.y + Math.sin(c.t * 3 + q.ph) * 4;   // 上下浮动
    var ddx = q.x - c.shipX, ddy = qy - SHIP_Y;
    if (ddx * ddx + ddy * ddy < 35 * 35) {
      c.pickups.splice(qi, 1);
      c.shieldLeft = SHIELD_DUR;
      res.gotPickup = true;
    } else if (q.y > H + 40) {
      c.pickups.splice(qi, 1);
    }
  }
  return res;
}

/* ================= AI 决策（纯函数；与 ai-sim.mjs 同名实现保持一致） =================
   v2 轨迹预采样评分：
   1) 每次决策把各陨石在前瞻窗口内的位置（含左右墙反弹）按 step 预采样；
   2) 每个候选目标点用闭式跟随轨迹逐采样点比对 2D 距离（比仅看横向带更准）；
   3) 窗口内一旦判定撞击，用「首次撞击越晚越好」的悬崖项主导排序，
      未撞击时由近距危险度、护盾道具/清场收益与移动代价决胜。 */
var AI_CFG = {
  look: 0.5,       // 前瞻秒数（实测 0.5 最优：短视窗反应式闪避 + 高频拾盾）
  step: 0.01,      // 预测采样步长（秒）；越细越不易漏判擦碰，实测 0.01 最优
  follow: 14,      // 指针跟随系数（与 moveShipCore 一致）
  band: 1.2,       // 判定半径放宽系数（2D 精算余量）
  wNear: 1.2,      // 近距危险权重
  hitW: 100,       // 首次撞击悬崖惩罚（每晚一个采样点加 hitW）
  softCap: 4,      // 近距危险度封顶（保证悬崖项主导排序）
  moveCost: 0.02,  // 每移动 100px 的代价（抑制抖动）
  pickLook: 4.5,   // 护盾道具考虑窗口（秒）
  pickW: 1.5,      // 护盾道具吸引力上限
  pickNeed: 500,   // 估计奔赴道具的速度（px/s）
  smashW: 0.5,     // 护盾期清场加分上限（每颗陨石）
  smashR: 26       // 清场判定横向吸附半径（px）
};

/* 预采样缓冲（每次决策复用，避免频繁分配） */
var PRED_MAX_M = 64;                    // 陨石数上限
var PRED_MAX_K = 256;                   // 单陨石采样点上限
var predMx = new Float64Array(PRED_MAX_M * PRED_MAX_K);
var predMy = new Float64Array(PRED_MAX_M * PRED_MAX_K);
var predRr2 = new Float64Array(PRED_MAX_M);
var predEff2 = new Float64Array(PRED_MAX_M);
var predEnd = new Int32Array(PRED_MAX_M);
var shipE = new Float64Array(PRED_MAX_K);
var predN = 0;

/* 匀速直线 + 左右墙反弹：求 τ 秒后陨石横坐标 */
function foldX(xn, r) {
  var lo = r, hi = W - r, span = hi - lo;
  if (span <= 0) return lo;
  var k = (xn - lo) % (2 * span);
  if (k < 0) k += 2 * span;
  return lo + (k <= span ? k : 2 * span - k);
}

/* 护盾道具对候选点的吸引力（返回要减去的分数） */
function pickupGain(c, xT) {
  var gain = 0;
  for (var i = 0; i < c.pickups.length; i++) {
    var q = c.pickups[i];
    var tau = (SHIP_Y - q.y) / q.vy;    // 道具落到飞船高度的时间
    if (tau < 0.35 || tau > AI_CFG.pickLook) continue;
    if (Math.abs(q.x - c.shipX) / AI_CFG.pickNeed > tau - 0.15) continue;   // 来不及
    var off = Math.abs(xT - q.x);
    if (off > 70) continue;
    var g = AI_CFG.pickW * (1 - tau / AI_CFG.pickLook) * (1 - off / 70);
    if (g > gain) gain = g;
  }
  return gain;
}

/* 护盾充裕时顺路撞碎陨石清场（返回要减去的分数） */
function smashGain(c, xT) {
  if (c.shieldLeft < AI_CFG.look) return 0;
  var g = 0;
  for (var i = 0; i < c.meteors.length; i++) {
    var m = c.meteors[i];
    var rr = m.r * 0.82 + SHIP_R;
    if (m.y > SHIP_Y + rr) continue;                 // 已飞过飞船高度带
    var tHit = (SHIP_Y - m.y) / m.vy;                // 到达飞船高度带中心时刻
    if (tHit < 0 || tHit > AI_CFG.look) continue;
    if (c.shieldLeft <= tHit) continue;              // 到达时护盾已过期 → 不去撞
    var off = Math.abs(xT - foldX(m.x + m.vx * tHit, m.r));
    var rr2 = rr + AI_CFG.smashR;
    if (off < rr2) g += AI_CFG.smashW * (1 - off / rr2);
  }
  return g;
}

/* 单个候选目标点的评分（越低越好） */
function evalX(c, xT, K) {
  var x0 = c.shipX;
  var dt = AI_CFG.step;
  var soft = 0, hitK = 0;
  for (var k = 1; k <= K; k++) {
    var xs = xT + (x0 - xT) * shipE[k];
    if (xs < 22) xs = 22; else if (xs > W - 22) xs = W - 22;
    var shielded = c.shieldLeft > k * dt;
    for (var i = 0; i < predN; i++) {
      if (k > predEnd[i]) continue;
      var e = i * PRED_MAX_K + k;
      var dx = predMx[e] - xs, dy = predMy[e] - SHIP_Y;
      var d2 = dx * dx + dy * dy;
      if (d2 >= predEff2[i]) continue;
      if (shielded) continue;
      if (hitK === 0 && d2 < predRr2[i]) hitK = k;
      soft += AI_CFG.wNear / (1 + k * dt) * (1 - d2 / predEff2[i]);
    }
    if (hitK !== 0) break;
  }
  if (soft > AI_CFG.softCap) soft = AI_CFG.softCap;
  var danger = hitK !== 0 ? AI_CFG.hitW * (K + 1 - hitK) : 0;
  return danger + soft - pickupGain(c, xT) - smashGain(c, xT);
}

/* 每步决策：预采样陨石轨迹后横向细扫候选点，返回最优目标横坐标 */
function aiPickTarget(c) {
  var dt = AI_CFG.step;
  var K = Math.max(1, Math.min(PRED_MAX_K - 1, Math.ceil(AI_CFG.look / dt)));
  for (var k = 1; k <= K; k++) shipE[k] = Math.exp(-AI_CFG.follow * k * dt);
  /* 陨石预采样：仅保留前瞻窗口内会进入判定带的陨石 */
  var n = 0;
  for (var i = 0; i < c.meteors.length && n < PRED_MAX_M; i++) {
    var m = c.meteors[i];
    var rr = m.r * 0.82 + SHIP_R;
    var eff = rr * AI_CFG.band;
    if (m.y > SHIP_Y + eff) continue;
    var tOut = Math.min(AI_CFG.look, (SHIP_Y + eff - m.y) / m.vy);
    var kk = Math.max(1, Math.min(K, Math.floor(tOut / dt)));
    var base = n * PRED_MAX_K;
    for (var k2 = 1; k2 <= kk; k2++) {
      var tau = k2 * dt;
      predMx[base + k2] = foldX(m.x + m.vx * tau, m.r);
      predMy[base + k2] = m.y + m.vy * tau;
    }
    predRr2[n] = rr * rr;
    predEff2[n] = eff * eff;
    predEnd[n] = kk;
    n++;
  }
  predN = n;
  var bestX = c.shipX, bestS = Infinity;
  for (var x = 22; x <= W - 22 + 1e-9; x += 8) {
    var s = evalX(c, x, K) + AI_CFG.moveCost * Math.abs(x - c.shipX) / 100;
    if (s < bestS) { bestS = s; bestX = x; }
  }
  return bestX;
}

/* ================= HUD 与覆盖层 ================= */
function syncHud() { elScore.textContent = G.score; elBest.textContent = best; }
function syncShield() {
  if (G.shieldLeft > 0) {
    elShield.hidden = false;
    elShieldT.textContent = G.shieldLeft.toFixed(1);
  } else {
    elShield.hidden = true;
  }
}
function showOverlay(html) { ov.innerHTML = html; ov.hidden = false; }
function hideOverlay() { ov.hidden = true; }

function showStart() {
  showOverlay(
    '<h2>陨石闪避</h2>' +
    '<p>驾驶小飞船躲开不断坠落的陨石<br>存活越久得分越高（每秒 10 分）<br>护盾道具可提供 10 秒无敌，无敌期间可撞碎陨石</p>' +
    '<button type="button">开始游戏</button>' +
    '<p>移动鼠标 / 手指拖动 / 方向键 控制飞船<br>也可点击右上角「AI 代玩」由 AI 自动游玩</p>'
  );
}
function showPause() {
  showOverlay('<h2>已暂停</h2><p>点击画面或按空格继续</p>');
}
function showOver() {
  state = 'over';
  overGuard = 0.6;
  var isNew = !aiOn && G.score > best;   // AI 代玩成绩不计入最高纪录
  if (isNew) {
    best = G.score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }
  syncHud();
  showOverlay(
    '<h2>' + (isNew ? '新纪录！' : (aiOn ? 'AI 本局结束' : '游戏结束')) + '</h2>' +
    '<div class="big">' + G.score + '</div>' +
    '<p>存活 ' + G.t.toFixed(1) + ' 秒 · 最高纪录 ' + best + '</p>' +
    (aiOn ? '<p>AI 代玩中，即将自动开始下一局（成绩不计入纪录）</p>' : '') +
    '<button type="button">再来一局</button>'
  );
}

/* ================= 流程控制 ================= */
function startGame() {
  resetGame();
  state = 'playing';
  hideOverlay();
}
function resumeGame() {
  state = 'playing';
  hideOverlay();
}
function die() {
  state = 'dying';
  dieT = 0;
  G.shieldLeft = 0;
  syncShield();
  burst(G.shipX, SHIP_Y, 35, 26);    // 橙色火焰碎片
  burst(G.shipX, SHIP_Y, 205, 14);   // 蓝白火花
  if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
}
function act() {
  if (state === 'ready') startGame();
  else if (state === 'paused') resumeGame();
  else if (state === 'over' && overGuard <= 0) startGame();
  /* playing 状态下点击不做动作，移动交给指针与键盘 */
}
function resetGame() {
  G = freshCore(Math.random);
  shownScore = -1;
  syncHud();
  syncShield();
}

/* ================= AI 代玩控制 ================= */
/* 每帧调用：衔接界面状态（自动开局/续局/恢复），并在 playing 时周期性决策 */
function aiTick(dt) {
  if (!aiOn) return;
  if (state === 'ready') { startGame(); return; }
  if (state === 'paused') { resumeGame(); return; }
  if (state === 'over') { if (overGuard <= 0) startGame(); return; }
  if (state !== 'playing') return;
  G.keys.left = false; G.keys.right = false;   // AI 全权接管，忽略物理按键
  aiClock -= dt;
  if (aiClock > 0) return;
  aiClock = 0.1;
  G.tx = aiPickTarget(G);
}
function setAi(on) {
  aiOn = on;
  aiBtn.textContent = aiOn ? '停止 AI 代玩' : 'AI 代玩';
  aiBtn.classList.toggle('ai-on', aiOn);
  aiBtn.setAttribute('aria-pressed', String(aiOn));
  aiTag.hidden = !aiOn;
  if (aiOn) {
    if (state === 'ready') startGame();
    else if (state === 'paused') resumeGame();
    else if (state === 'over' && overGuard <= 0) startGame();
  }
}
aiBtn.addEventListener('click', function () { setAi(!aiOn); });

/* ================= 爆裂粒子 ================= */
function burst(x, y, hue, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 220;
    var life = 0.5 + Math.random() * 0.45;
    parts.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: life, max: life,
      r: 2 + Math.random() * 3.5,
      col: 'hsl(' + hue + ',65%,' + (45 + Math.random() * 25) + '%)'
    });
  }
}

/* ================= 更新 ================= */
function update(dt) {
  /* 星空缓慢下移，营造飞行感 */
  for (var si = 0; si < stars.length; si++) {
    var st = stars[si];
    st.y += st.v * dt;
    if (st.y > H + 2) { st.y = -2; st.x = Math.random() * W; }
  }
  /* 粒子 */
  for (var pi = parts.length - 1; pi >= 0; pi--) {
    var pt = parts[pi];
    pt.life -= dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vy += 420 * dt;
    if (pt.life <= 0) parts.splice(pi, 1);
  }

  if (state === 'playing') {
    var ev = stepCore(G, dt, Math.random);
    if (G.score !== shownScore) { shownScore = G.score; elScore.textContent = G.score; }
    syncShield();
    if (ev.died) { die(); return; }
  } else if (state === 'dying') {
    /* 陨石继续飘落，短暂延迟后展示结算 */
    for (var di = 0; di < G.meteors.length; di++) {
      var md = G.meteors[di];
      md.x += md.vx * dt;
      md.y += md.vy * dt;
      md.rot += md.vr * dt;
    }
    dieT += dt;
    if (dieT > 0.7) showOver();
  }
}

/* ================= 绘制 ================= */
function draw() {
  /* 深空背景 */
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#101c36');
  bg.addColorStop(1, '#25406b');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 星星 */
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    ctx.fillStyle = 'rgba(255,255,255,' + s.a + ')';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  drawPickups();
  drawMeteors();
  drawParts();
  if (state === 'playing' || state === 'paused' || state === 'ready') drawShip();
  drawShieldRing();
}
/* 多边形陨石：随机顶点半径 + 陨石坑 + 自转 */
function drawMeteors() {
  for (var i = 0; i < G.meteors.length; i++) {
    var m = G.meteors[i];
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    ctx.beginPath();
    var n = m.verts.length;
    for (var k = 0; k < n; k++) {
      var a = k / n * Math.PI * 2, rr = m.r * m.verts[k];
      var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = 'hsl(' + m.hue + ',26%,44%)';
    ctx.fill();
    ctx.strokeStyle = 'hsl(' + m.hue + ',32%,28%)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'hsla(' + m.hue + ',30%,30%,.55)';
    for (var c = 0; c < m.craters.length; c++) {
      ctx.beginPath();
      ctx.arc(m.craters[c].x, m.craters[c].y, m.craters[c].r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}
/* 护盾道具：光晕 + 圆环 + 盾形徽记 */
function drawPickups() {
  for (var i = 0; i < G.pickups.length; i++) {
    var q = G.pickups[i];
    var y = q.y + Math.sin(G.t * 3 + q.ph) * 4;
    ctx.fillStyle = 'rgba(41,182,246,.18)';
    ctx.beginPath();
    ctx.arc(q.x, y, 20 + Math.sin(G.t * 5 + q.ph) * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#29b6f6';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(q.x, y, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#29b6f6';
    ctx.beginPath();
    ctx.moveTo(q.x, y - 7.5);
    ctx.lineTo(q.x + 5.5, y - 4.5);
    ctx.lineTo(q.x + 5.5, y + 1);
    ctx.quadraticCurveTo(q.x + 5.5, y + 5.5, q.x, y + 7.5);
    ctx.quadraticCurveTo(q.x - 5.5, y + 5.5, q.x - 5.5, y + 1);
    ctx.lineTo(q.x - 5.5, y - 4.5);
    ctx.closePath();
    ctx.fill();
  }
}
/* 小飞船：几何拼装（机身 + 机翼 + 舷窗 + 尾焰） */
function drawShip() {
  ctx.save();
  ctx.translate(G.shipX, SHIP_Y);
  /* 尾焰（随机抖动） */
  var fl = 8 + Math.random() * 7;
  var grd = ctx.createLinearGradient(0, 12, 0, 20 + fl);
  grd.addColorStop(0, 'rgba(255,183,77,.95)');
  grd.addColorStop(1, 'rgba(255,183,77,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(-5, 12);
  ctx.lineTo(5, 12);
  ctx.lineTo(0, 12 + fl);
  ctx.closePath();
  ctx.fill();
  /* 机翼 */
  ctx.fillStyle = '#c3d0e4';
  ctx.beginPath();
  ctx.moveTo(-11, 2); ctx.lineTo(-22, 16); ctx.lineTo(-8, 13);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(11, 2); ctx.lineTo(22, 16); ctx.lineTo(8, 13);
  ctx.closePath(); ctx.fill();
  /* 机身 */
  ctx.fillStyle = '#f2f6fc';
  ctx.strokeStyle = '#8fa3bd';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -20);
  ctx.quadraticCurveTo(12, -6, 12, 6);
  ctx.lineTo(7, 13);
  ctx.lineTo(-7, 13);
  ctx.lineTo(-12, 6);
  ctx.quadraticCurveTo(-12, -6, 0, -20);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  /* 舷窗 */
  ctx.fillStyle = '#37c6ff';
  ctx.beginPath();
  ctx.arc(0, -4, 4.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.beginPath();
  ctx.arc(-1.4, -5.4, 1.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
/* 护盾光环（剩 3 秒内闪烁警示） */
function drawShieldRing() {
  if (G.shieldLeft <= 0 || state === 'dying' || state === 'over') return;
  var pulse = 26 + Math.sin(G.t * 6) * 2;
  var blink = G.shieldLeft < 3 ? (Math.sin(G.t * 16) > 0 ? 0.85 : 0.25) : 0.8;
  ctx.strokeStyle = 'rgba(41,182,246,' + blink + ')';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(G.shipX, SHIP_Y, pulse, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(41,182,246,' + (blink * 0.35) + ')';
  ctx.beginPath();
  ctx.arc(G.shipX, SHIP_Y, pulse + 5, 0, Math.PI * 2);
  ctx.stroke();
}
function drawParts() {
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ================= 主循环 ================= */
var lastFrame = performance.now();
function loop(now) {
  var dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  if (overGuard > 0) overGuard -= dt;
  aiTick(dt);
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ================= 输入（指针 + 键盘，兼容无 PointerEvent 的环境） ================= */
function setPointer(e) {
  var rect = cv.getBoundingClientRect();
  G.tx = (e.clientX - rect.left) / rect.width * W;
}
function onTap(el, fn) {
  if (window.PointerEvent) el.addEventListener('pointerdown', fn);
  else {
    el.addEventListener('touchstart', function (e) { e.preventDefault(); fn(e.touches[0]); }, { passive: false });
    el.addEventListener('mousedown', fn);
  }
}
function onMove(el, fn) {
  if (window.PointerEvent) el.addEventListener('pointermove', fn);
  else {
    el.addEventListener('touchmove', function (e) { e.preventDefault(); fn(e.touches[0]); }, { passive: false });
    el.addEventListener('mousemove', fn);
  }
}
onTap(stage, function (e) {
  setPointer(e);
  act();
});
onMove(stage, function (e) {
  if (state === 'playing') setPointer(e);
});
window.addEventListener('keydown', function (e) {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { G.keys.left = true; e.preventDefault(); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { G.keys.right = true; e.preventDefault(); }
  else if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (!e.repeat) act();
  }
});
window.addEventListener('keyup', function (e) {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') G.keys.left = false;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') G.keys.right = false;
});

/* 切后台自动暂停；回到前台重置时间基准，避免 delta 时间跳变 */
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    if (state === 'playing') { state = 'paused'; showPause(); }
  } else {
    lastFrame = performance.now();
  }
});

/* ================= 启动 ================= */
function initStars() {
  stars = [];
  for (var i = 0; i < 70; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: Math.random() < 0.8 ? 1.5 : 2.5,
      v: 14 + Math.random() * 34,
      a: 0.25 + Math.random() * 0.6
    });
  }
}
initStars();
resetGame();
showStart();
requestAnimationFrame(loop);
})();
</script>
  <aside class="rules-panel" id="rulesPanel" role="complementary" aria-label="游戏规则">
    <button class="rules-handle" id="rulesHandle" type="button">玩法</button>
    <div class="rules-scroll">
    <h2>游戏规则</h2>

      <h3>玩法</h3>
      <ul>
        <li>操控小飞船左右闪避坠落的陨石，存活越久分越高</li>
        <li>陨石越来越密、越来越快，大小转速各不相同</li>
        <li>拾取青色护盾道具获得 10 秒无敌，可撞碎陨石</li>
      </ul>
      <h3>操作</h3>
      <ul>
        <li>鼠标移动 / 触屏拖动 / ← → / A D：移动飞船</li>
        <li>空格：开始 / 重开</li>
      </ul>
      <h3>AI 代玩</h3>
      <ul>
        <li>点击「AI 代玩」按钮，AI 自动操控飞船闪避陨石并自动续局</li>
        <li>随时再点一次按钮即可停止；AI 成绩不计入最高纪录</li>
      </ul>
    </div>
  </aside>
  <script>
  (function () {
    var panel = document.getElementById('rulesPanel');
    var handle = document.getElementById('rulesHandle');
    var saved = null;
    try { saved = localStorage.getItem('gameRulesOpen'); } catch (e) { }
    var open = saved === null ? window.innerWidth >= 1100 : saved === '1';
    function apply() {
      panel.classList.toggle('closed', !open);
      handle.textContent = open ? '收起' : '玩法';
      handle.setAttribute('aria-label', open ? '收起游戏规则' : '展开游戏规则');
      document.body.classList.toggle('rules-open', open && window.innerWidth >= 1100);
    }
    handle.addEventListener('click', function () {
      open = !open;
      try { localStorage.setItem('gameRulesOpen', open ? '1' : '0'); } catch (e) { }
      apply();
    });
    window.addEventListener('resize', apply);
    apply();
  })();
  </script>
</body>
