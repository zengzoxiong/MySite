<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="../../favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件在线预览 - 拖入即读的本地文档查看器</title>
    <meta name="description" content="在浏览器里直接预览常见文件：PDF、图片、音频视频、文本（可切换 GBK/Big5 编码）、Markdown、JSON、CSV、Excel、Word、PPT 文字、ZIP 压缩包。文件不上传，全部在本机解析。">
    <link rel="canonical" href="https://zengzoxiong.github.io/MySite/tools/file-preview/app.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* 工具条与编码下拉靠 hidden 控制显隐，但下面的 display 规则会盖掉 UA 样式 */
        [hidden] { display: none !important; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Roboto, sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #e7ecf3 100%);
            color: #0f172a;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1180px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 20px; }

        .header h1 {
            font-size: 1.9rem;
            background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p { color: #64748b; font-size: 12.5px; margin-top: 8px; }

        .drop {
            border: 2px dashed #b6c2d4;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.72);
            padding: 26px 18px;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s, background .2s;
            margin-bottom: 16px;
        }

        .drop:hover, .drop.dragover, .drop:focus-visible {
            border-color: #2563eb;
            background: #fff;
            outline: none;
        }

        .drop svg { width: 38px; height: 38px; fill: #2563eb; opacity: .85; }
        .drop strong { display: block; margin-top: 6px; font-size: 15px; }
        .drop small { color: #64748b; font-size: 12px; }

        .layout { display: grid; grid-template-columns: 262px 1fr; gap: 16px; align-items: start; }

        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .05);
        }

        .side { padding: 12px; position: sticky; top: 16px; }

        .side-head {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 12px; color: #64748b; font-weight: 700;
            padding: 2px 4px 10px;
        }

        .mini {
            border: 1px solid #e2e8f0; background: #f8fafc; color: #475569;
            border-radius: 7px; font-size: 11px; padding: 3px 8px; cursor: pointer;
        }

        .mini:hover { background: #eef2f7; color: #0f172a; }

        .list { list-style: none; max-height: 46vh; overflow: auto; }

        .list li {
            display: flex; gap: 8px; align-items: center;
            padding: 8px; border-radius: 9px; cursor: pointer;
            font-size: 12.5px; border: 1px solid transparent;
        }

        .list li:hover { background: #f1f5f9; }
        .list li[aria-current="true"] { background: #eff6ff; border-color: #bfdbfe; }

        .list .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .list .sz { color: #94a3b8; font-size: 11px; flex: none; }
        .list .kd {
            flex: none; font-size: 10px; font-weight: 700; letter-spacing: .04em;
            text-transform: uppercase; color: #2563eb; background: #eff6ff;
            border-radius: 5px; padding: 2px 5px;
        }
        .list .rm { flex: none; border: 0; background: none; color: #cbd5e1; cursor: pointer; font-size: 15px; line-height: 1; }
        .list .rm:hover { color: #ef4444; }
        .list:empty::after { content: '还没有文件'; color: #94a3b8; font-size: 12px; display: block; text-align: center; padding: 14px 0; }

        .fmt { margin-top: 12px; border-top: 1px dashed #e2e8f0; padding-top: 10px; font-size: 11.5px; color: #64748b; line-height: 1.7; }
        .fmt b { display: block; margin-top: 7px; color: #334155; font-size: 12px; }
        .fmt b:first-child { margin-top: 0; }
        .fmt .e { font-family: 'Cascadia Mono', Consolas, 'Courier New', monospace; font-size: 11px; color: #64748b; }

        .stage { padding: 0; overflow: hidden; }

        .bar {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 11px 14px; border-bottom: 1px solid #eef2f7;
            background: #fbfcfe; font-size: 12.5px;
        }

        .bar .name { font-weight: 700; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar .meta { color: #94a3b8; }
        .bar .spacer { margin-left: auto; }
        .bar label { color: #64748b; display: inline-flex; align-items: center; gap: 5px; }
        .bar select { font: inherit; font-size: 12px; padding: 2px 5px; border: 1px solid #dbe3ee; border-radius: 6px; background: #fff; color: #0f172a; }

        .notice {
            padding: 9px 14px; font-size: 12.5px; line-height: 1.6;
            background: #fffbeb; color: #92400e; border-bottom: 1px solid #fde68a;
        }

        .notice.info { background: #f0f9ff; color: #075985; border-bottom-color: #bae6fd; }

        .view { padding: 16px; min-height: 58vh; max-height: calc(100vh - 190px); overflow: auto; }

        .empty { text-align: center; color: #94a3b8; padding: 60px 20px; font-size: 13px; line-height: 2; }
        .empty h3 { color: #475569; font-size: 15px; margin-bottom: 8px; }

        .view img.fit { max-width: 100%; height: auto; display: block; margin: 0 auto; background: repeating-conic-gradient(#f1f5f9 0 25%, #fff 0 50%) 0 0 / 22px 22px; border-radius: 6px; }
        .view embed, .view iframe.doc { width: 100%; border: 0; border-radius: 8px; background: #fff; }
        .view audio, .view video { width: 100%; max-height: 70vh; display: block; margin: 0 auto; background: #000; border-radius: 8px; }
        .view audio { background: #fff; }

        pre.raw {
            font-family: 'Cascadia Mono', Consolas, 'Courier New', monospace;
            font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
            color: #1e293b;
        }

        .json { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 12.5px; line-height: 1.7; }
        .json details { margin-left: 14px; }
        .json summary { cursor: pointer; }
        .json .k { color: #0f766e; }
        .json .s { color: #1d4ed8; }
        .json .n { color: #b45309; }
        .json .b { color: #7c3aed; }
        .json .z { color: #94a3b8; }

        .sheetwrap { border: 1px solid #e2e8f0; border-radius: 10px; overflow: auto; max-height: 62vh; }
        .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .tab { border: 1px solid #dbe3ee; background: #f8fafc; border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: #475569; }
        .tab[aria-selected="true"] { background: #2563eb; border-color: #2563eb; color: #fff; }

        table.grid { border-collapse: collapse; font-size: 12px; width: max-content; }
        table.grid th, table.grid td { border: 1px solid #e6ebf2; padding: 4px 8px; text-align: left; vertical-align: top; }
        table.grid thead th { position: sticky; top: 0; background: #f1f5f9; z-index: 1; font-weight: 700; }
        table.grid tbody th { position: sticky; left: 0; background: #f8fafc; font-weight: 600; color: #94a3b8; }
        table.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }

        .docpage { background: #fff; }

        .deck { display: flex; flex-direction: column; gap: 16px; }

        .slide {
            position: relative;
            width: 100%;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(15, 23, 42, .07);
            color: #1e293b;
        }

        .slide .sh { position: absolute; overflow: hidden; }
        .slide .sh p { margin: 0; line-height: 1.3; word-break: break-word; }
        .slide img { position: absolute; object-fit: fill; display: block; }
        .slide .no { position: absolute; right: 8px; bottom: 5px; font-size: 11px; color: #cbd5e1; }

        .tree { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        .tree th, .tree td { padding: 6px 8px; border-bottom: 1px solid #eef2f7; text-align: left; }
        .tree th { color: #64748b; font-size: 11.5px; background: #fbfcfe; }
        .tree tr.pick { cursor: pointer; }
        .tree tr.pick:hover { background: #f1f5f9; }
        .tree td.path { font-family: 'Cascadia Mono', Consolas, monospace; word-break: break-all; }
        .tree td.r { text-align: right; color: #64748b; font-variant-numeric: tabular-nums; }

        .spin { display: flex; align-items: center; gap: 10px; color: #64748b; font-size: 13px; padding: 30px 0; justify-content: center; }

        pre.raw .k { color: #7c3aed; }
        pre.raw .s { color: #15803d; }
        pre.raw .c { color: #94a3b8; font-style: italic; }
        pre.raw .n { color: #b45309; }
        pre.raw .t { color: #0369a1; }
        .spin i { width: 16px; height: 16px; border: 2px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: r 0.8s linear infinite; }
        @keyframes r { to { transform: rotate(360deg); } }

        @media print {
            body { background: #fff; padding: 0; }
            .drop, .side, .notice, .bar, .tabs, .tool-doc-link, .tool-home-link, .header p { display: none !important; }
            .container { max-width: none; }
            .layout { grid-template-columns: 1fr; }
            .stage { border: 0; box-shadow: none; }
            .view { max-height: none; overflow: visible; padding: 0; }
            .sheetwrap { max-height: none; overflow: visible; border: 0; }
            table.grid thead th, table.grid tbody th { position: static; }
            .slide { break-inside: avoid; box-shadow: none; }
        }

        .tool-doc-link, .tool-home-link {
            position: fixed; top: 16px; padding: 6px 12px; border-radius: 999px;
            font-size: 12px; font-weight: 600; color: #0f172a; background: rgba(255, 255, 255, .9);
            border: 1px solid rgba(15, 23, 42, .12); text-decoration: none; letter-spacing: .02em;
            z-index: 9999; box-shadow: 0 6px 16px rgba(15, 23, 42, .08);
            transition: background .2s ease, border-color .2s ease, transform .2s ease;
        }
        .tool-doc-link { right: 16px; }
        .tool-home-link { right: 74px; }
        .tool-doc-link:hover, .tool-home-link:hover { background: #fff; border-color: rgba(15, 23, 42, .2); transform: translateY(-1px); }

        @media (max-width: 880px) {
            .layout { grid-template-columns: 1fr; }
            .side { position: static; }
            .list { max-height: 30vh; }
            .bar .name { max-width: 100%; }
            .view { max-height: none; }
        }
    </style>
</head>
<body>
    <a class="tool-home-link" href="../../index.html">首页</a>
    <a class="tool-doc-link" href="index.html">说明</a>
    <div class="container">
        <div class="header">
            <h1>文件在线预览</h1>
            <p>拖入即读 · 不装软件 · 文件只在你本机解析，不会上传</p>
        </div>

        <div class="drop" id="drop" tabindex="0" role="button" aria-label="选择或拖入文件">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 6.5 9.5h3.2V16h4.6V9.5h3.2L12 3Zm-7 15.5v2.5h14v-2.5H5Z"/></svg>
            <strong>把文件拖到这里，或点击选择（可多选）</strong>
            <small>也可以直接 Ctrl+V 粘贴截图与文件</small>
            <input type="file" id="picker" multiple hidden>
        </div>

        <div class="layout">
            <aside class="side card">
                <div class="side-head"><span>文件列表</span><button class="mini" id="clearAll" type="button">清空</button></div>
                <ul class="list" id="list"></ul>
                <div class="fmt" id="fmt"></div>
            </aside>

            <main class="stage card">
                <div class="bar" id="bar" hidden>
                    <span class="name" id="mName"></span>
                    <span class="meta" id="mSize"></span>
                    <label id="encWrap" hidden>编码
                        <select id="enc">
                            <option value="utf-8">UTF-8</option>
                            <option value="gb18030">GBK / GB18030</option>
                            <option value="big5">Big5</option>
                            <option value="shift_jis">Shift-JIS</option>
                            <option value="euc-kr">EUC-KR</option>
                            <option value="windows-1251">Windows-1251</option>
                            <option value="utf-16le">UTF-16 LE</option>
                            <option value="utf-16be">UTF-16 BE</option>
                        </select>
                    </label>
                    <span class="spacer"></span>
                    <button class="mini" id="backZip" type="button" hidden>返回压缩包</button>
                    <button class="mini" id="printBtn" type="button" hidden>打印 / 存 PDF</button>
                    <a class="mini" id="openTab" hidden>新窗口打开</a>
                </div>
                <div class="notice" id="notice" hidden></div>
                <div class="view" id="view">
                    <div class="empty">
                        <h3>还没有选择文件</h3>
                        支持一次拖入多个，点左侧列表切换。<br>
                        解析在浏览器里完成，不会向服务器发送任何内容。
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        var VENDOR = '../../assets/vendor/';
        var MAX_FILE = 200 * 1024 * 1024;
        var TEXT_CAP = 400 * 1024;
        var ROW_CAP = 5000;
        var COL_CAP = 200;
        var ZIP_FILE_CAP = 50 * 1024 * 1024;
        var ZIP_ENTRY_CAP = 2000;
        var BORDER_W = { hair: '1px', thin: '1px', medium: '2px', mediumThick: '3px', thick: '4px', dashed: '1px', dashDot: '1px', dotted: '1px', double: '3px' };

        var IMG = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'ico', 'avif', 'svg'];
        var AUDIO = ['mp3', 'wav', 'flac', 'ogg', 'oga', 'm4a', 'aac', 'opus'];
        var VIDEO = ['mp4', 'm4v', 'webm', 'mov'];
        var TEXT = ['txt', 'log', 'csv', 'tsv', 'md', 'markdown', 'json', 'xml', 'yml', 'yaml', 'ini', 'conf', 'env',
            'js', 'mjs', 'ts', 'css', 'scss', 'less', 'html', 'htm', 'py', 'java', 'kt', 'c', 'h', 'cpp', 'hpp',
            'cs', 'go', 'rs', 'rb', 'php', 'sh', 'bat', 'ps1', 'sql', 'lua', 'swift', 'vue', 'jsx', 'tsx', 'toml', 'properties'];
        var DOCX = ['docx'];
        var SHEET = ['xlsx', 'xlsm'];
        var PPTX = ['pptx'];
        var ZIP = ['zip'];

        var drop = document.getElementById('drop');
        var picker = document.getElementById('picker');
        var listEl = document.getElementById('list');
        var view = document.getElementById('view');
        var bar = document.getElementById('bar');
        var mName = document.getElementById('mName');
        var mSize = document.getElementById('mSize');
        var encWrap = document.getElementById('encWrap');
        var encSel = document.getElementById('enc');
        var openTab = document.getElementById('openTab');
        var backZip = document.getElementById('backZip');
        var printBtn = document.getElementById('printBtn');
        var notice = document.getElementById('notice');

        var files = [];
        var seq = 0;
        var cur = null;
        var token = 0;
        var lastTemp = null;
        var zipReplay = null;

        function zsize(entry, which) {
            var d = entry._data || {};
            return (which === 'c' ? d.compressedSize : (d.uncompressedSize || entry.uncompressedSize)) || 0;
        }

        function extOf(name) {
            var i = name.lastIndexOf('.');
            return i < 0 ? '' : name.slice(i + 1).toLowerCase();
        }

        function kindOf(name) {
            var e = extOf(name);
            if (e === 'pdf') return 'pdf';
            if (IMG.indexOf(e) >= 0) return 'img';
            if (AUDIO.indexOf(e) >= 0) return 'audio';
            if (VIDEO.indexOf(e) >= 0) return 'video';
            if (e === 'json') return 'json';
            if (e === 'csv' || e === 'tsv') return 'csv';
            if (e === 'md' || e === 'markdown') return 'md';
            if (e === 'html' || e === 'htm') return 'html';
            if (TEXT.indexOf(e) >= 0) return 'text';
            if (DOCX.indexOf(e) >= 0) return 'docx';
            if (SHEET.indexOf(e) >= 0) return 'sheet';
            if (PPTX.indexOf(e) >= 0) return 'pptx';
            if (ZIP.indexOf(e) >= 0) return 'zip';
            return 'unknown';
        }

        function bytes(n) {
            if (n < 1024) return n + ' B';
            if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
            if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
            return (n / 1073741824).toFixed(2) + ' GB';
        }

        function el(tag, cls, text) {
            var n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text !== undefined && text !== null) n.textContent = text;
            return n;
        }

        function say(msg, info) {
            notice.hidden = false;
            notice.textContent = msg;
            notice.className = 'notice' + (info ? ' info' : '');
        }

        function hush() { notice.hidden = true; notice.textContent = ''; }

        var libs = {};
        function loadLib(path) {
            if (!libs[path]) {
                libs[path] = new Promise(function (ok, no) {
                    var s = document.createElement('script');
                    s.src = path;
                    s.onload = function () { ok(); };
                    s.onerror = function () { no(new Error('组件加载失败：' + path)); };
                    document.head.appendChild(s);
                });
            }
            return libs[path];
        }

        function needJszip() {
            return loadLib(VENDOR + 'jszip/jszip.min.js');
        }

        function urlOf(item) {
            if (!item.url) {
                item.url = URL.createObjectURL(item.file);
                if (item.id === -1) {
                    if (lastTemp && lastTemp.url) URL.revokeObjectURL(lastTemp.url);
                    lastTemp = item;
                }
            }
            return item.url;
        }

        function busy(text) {
            view.textContent = '';
            var s = el('div', 'spin');
            s.appendChild(el('i'));
            s.appendChild(el('span', null, text || '解析中…'));
            view.appendChild(s);
        }

        function add(fileList) {
            Array.prototype.forEach.call(fileList, function (f) {
                if (f.size > MAX_FILE) {
                    say('「' + f.name + '」有 ' + bytes(f.size) + '，超过 200 MB 上限，已跳过。');
                    return;
                }
                files.push({ id: ++seq, file: f, url: null });
            });
            renderList();
            if (files.length) select(files[files.length - 1].id);
        }

        function renderList() {
            listEl.textContent = '';
            files.forEach(function (it) {
                var li = el('li');
                li.appendChild(el('span', 'nm', it.file.name));
                li.appendChild(el('span', 'kd', extOf(it.file.name) || '文件'));
                li.appendChild(el('span', 'sz', bytes(it.file.size)));
                var rm = el('button', 'rm', '×');
                rm.type = 'button';
                rm.title = '移出列表';
                rm.addEventListener('click', function (e) {
                    e.stopPropagation();
                    remove(it);
                });
                li.appendChild(rm);
                if (cur === it) li.setAttribute('aria-current', 'true');
                li.addEventListener('click', function () { select(it.id); });
                listEl.appendChild(li);
            });
        }

        function remove(it) {
            if (it.url) { URL.revokeObjectURL(it.url); it.url = null; }
            files = files.filter(function (x) { return x !== it; });
            if (cur === it) { cur = files.length ? files[0] : null; if (cur) select(cur.id); else reset(); }
            renderList();
        }

        function reset() {
            view.textContent = '';
            view.appendChild(el('div', 'empty', '还没有选择文件'));
            bar.hidden = true;
            hush();
        }

        function select(id) {
            var it = files.filter(function (x) { return x.id === id; })[0];
            if (!it) return;
            cur = it;
            zipReplay = null;
            backZip.hidden = true;
            renderList();
            bar.hidden = false;
            mName.textContent = it.file.name;
            mSize.textContent = bytes(it.file.size);
            hush();
            dispatch(it, kindOf(it.file.name));
        }

        function dispatch(it, kind, name) {
            var my = ++token;
            var label = name || it.file.name;
            encWrap.hidden = true;
            openTab.hidden = true;
            printBtn.hidden = ['img', 'pdf', 'audio', 'video', 'unknown'].indexOf(kind) >= 0;

            function alive() { return my === token; }

            function done(node, openable) {
                if (!alive()) return;
                view.textContent = '';
                view.appendChild(node);
                openTab.hidden = !openable;
                if (openable) openTab.href = urlOf(it);
            }

            if (kind === 'pdf') {
                var em = el('embed');
                em.src = urlOf(it);
                em.type = 'application/pdf';
                em.style.height = 'calc(100vh - 260px)';
                if (navigator.pdfViewerEnabled === false) {
                    say('这个浏览器没有内置 PDF 查看器，点右上角「新窗口打开」试试，或先把文件转成图片。');
                }
                done(em, true);
                return;
            }

            if (kind === 'img') {
                var im = el('img', 'fit');
                im.src = urlOf(it);
                im.alt = label;
                im.referrerPolicy = 'no-referrer';
                im.addEventListener('error', function () {
                    if (alive()) say('这张图片浏览器解不了（HEIC、TIFF、PSD 等格式需要先转换，可在站内「图片格式转换」工具处理）。');
                });
                done(im, true);
                return;
            }

            if (kind === 'audio' || kind === 'video') {
                var m = el(kind);
                m.src = urlOf(it);
                m.controls = true;
                m.preload = 'metadata';
                done(m, true);
                return;
            }

            if (kind === 'unknown') {
                busy('嗅探文件类型…');
                sliceHead(it.file, 8).then(function (head) {
                    if (!alive()) return;
                    view.textContent = '';
                    view.appendChild(el('div', 'empty'));
                    view.firstChild.appendChild(el('h3', null, '这个格式浏览器看不了'));
                    view.firstChild.appendChild(el('div', null, '文件名：' + label));
                    view.firstChild.appendChild(el('div', null, '文件头：' + hex(head)));

        function tokenize(src, cfg) {

                }

                plain += ch; i++;

            flush();

        function parseCsv(text, tsv) {

                if (c === '\r') continue;
                if (c === '\n') { row.push(val); rows.push(row); row = []; val = ''; continue; }

            }
            if (val !== '' || row.length) { row.push(val); rows.push(row); }

        /* exceljs 的 cell.text 不套数字格式，这里按 numFmt 补一层常见格式（百分比 / 小数位 / 千分位 / 日期） */
        function fmtCell(cell) {

        function sheetTable(ws) {

        function tableEl(rows) {

            for (var c = 0; c < Math.min(head.length, COL_CAP); c++) hr.appendChild(el('th', null, colName(c)));

                var tr = document.createElement('tr');
                tr.appendChild(el('th', null, String(r + 1)));

        function colName(i) {

        function colorOf(node, theme) {

        function masterBg(zip, theme) {

        function readTx(node, theme) {

        function shapeBox(sp, geo, size, theme) {
            var d = el('div', 'sh');

            d.style.top = (geo.y / size.cy * 100) + '%';
            d.style.width = (geo.cx / size.cx * 100) + '%';
            d.style.height = (geo.cy / size.cy * 100) + '%';
            var spPr = nsOne(sp, PML, 'spPr');
            if (spPr) {
                var bg = colorOf(kid(spPr, DML, 'solidFill'), theme);

                var ln = kid(spPr, DML, 'ln');

            readTx(sp, theme).forEach(function (para) {
                var p = el('p');
                var base = para.runs.length && para.runs[0].sz ? para.runs[0].sz : 1800;
                p.style.fontSize = 'calc(var(--s) * ' + (base / 75).toFixed(1) + 'px)';

        function relsPathFor(name) {

        }

                }

            }) : Promise.resolve({});

        function layoutGeo(zip, rels, slideName) {

            });
        }

        function slideSize(zip) {

        function revokeDeck() {
            deckUrls.forEach(function (u) { URL.revokeObjectURL(u); });

        function renderDeck(zip, done) {
            var names = Object.keys(zip.files).filter(function (n) {
                return /^ppt\/slides\/slide\d+\.xml$/.test(n);
            }).sort(function (a, b) {
                return (parseInt((a.match(/\d+/) || ['0'])[0], 10)) - (parseInt((b.match(/\d+/) || ['0'])[0], 10));
            });

            revokeDeck();
            var box = el('div', 'deck');
            var themeP = themeColors(zip);
            var bgP = themeP.then(function (t) { return masterBg(zip, t); });
            slideSize(zip).then(function (size) {
                return Promise.all(names.map(function (name, idx) {

                        zip.file(name).async('string'),
                        relsOf(zip, name),

                            var lmap = x[0], dia = x[1], theme = x[2], mbg = x[3];
                            var slide = el('div', 'slide');
                            slide.style.aspectRatio = size.cx + ' / ' + size.cy;
                            slide.dataset.w = String(size.cx / EMU_PER_PX);
                            slide.style.background = colorOf(kid(nsOne(doc, PML, 'bg'), DML, 'solidFill'), theme) || mbg || '#fff';
                            var sps = nsAll(doc, PML, 'sp'), pics = nsAll(doc, PML, 'pic');

                                var rid = blip && (blip.getAttributeNS(RNS, 'embed') || blip.getAttribute('r:embed'));
                                var img = el('img');
                                img.style.left = (geo.x / size.cx * 100) + '%';
                                img.style.top = (geo.y / size.cy * 100) + '%';
                                img.style.width = (geo.cx / size.cx * 100) + '%';
                                img.style.height = (geo.cy / size.cy * 100) + '%';
                                slide.appendChild(img);
                                if (!rid || !rels[rid]) return;

                                dbox.style.top = (dg.y / size.cy * 100) + '%';
                                dbox.style.width = (dg.cx / size.cx * 100) + '%';

        function shapeRun(r) {

        function fitDeck() {

        function renderZip(zip, onPick, done) {

                if (!entry.dir) entries.push({ path: path, entry: entry });

            var box = el('div');
            var tip = el('div', null, '共 ' + entries.length + ' 个文件，点任意一行即可在右侧预览其中的文本 / 图片 / PDF 等。');
            tip.style.cssText = 'font-size:12.5px;color:#64748b;margin-bottom:10px';
            box.appendChild(tip);
            var tb = el('table', 'tree');
            var hr = document.createElement('tr');
            ['路径', '原始大小', '压缩后', '类型'].forEach(function (h) { hr.appendChild(el('th', null, h)); });
            tb.appendChild(hr);

                tr.appendChild(el('td', 'r', bytes(zsize(e.entry, 'c'))));

        function readText(it) {
            return it.file.arrayBuffer().then(function (buf) {

                    cut = 1;
                }
                var enc = encSel.value;

                    var text = decode(use, enc);
                    if (cut) text += '\n\n…（文件较大，只渲染前 400 KB）';

                    if (enc !== 'utf-8') throw e;

                        var t2 = decode(use, 'gb18030');
                        if (cut) t2 += '\n\n…（文件较大，只渲染前 400 KB）';

                        return { text: t2, enc: 'gb18030', auto: true, cut: cut };

        function decode(buf, enc) {

        function sniff(u8, name) {
            var h = hex(u8);
            var e = extOf(name);
            if (h.indexOf('D0 CF 11 E0') === 0) {
                return {
                    what: '这是 Office 97-2003 的复合文档（.doc / .xls / .ppt 老格式）。',
                    how: '纯前端无法还原这种二进制排版。用 WPS / Office / LibreOffice 打开后另存为 docx / xlsx / pptx 再拖进来，就能直接预览。'
                };
            }
            if (h.indexOf('52 61 72') === 0) {
                return { what: '这是 RAR 压缩包。', how: 'RAR 解码需要 GPL 授权的 wasm 组件，本站没有内置。请解压后再把里面的文件拖进来。' };
            }
            if (h.indexOf('37 7A BC AF') === 0) {
                return { what: '这是 7z 压缩包。', how: '本站只内置了 zip 解析。请解压后再拖入里面的文件。' };
            }
            if (h.indexOf('50 4B 03 04') === 0 || h.indexOf('50 4B 05 06') === 0) {
                return { what: '这是 zip 容器（docx / xlsx / pptx 本质也是 zip）。', how: '把扩展名改成 .docx / .xlsx / .pptx 再拖进来，或直接把 .zip 拖进来浏览目录。' };
            }
            if (h.indexOf('FF D8 FF') === 0) {
                return { what: '这是 JPEG 图片，但扩展名是 .' + (e || '无') + '。', how: '把文件改名为 .jpg 再拖进来即可。' };
            }
            if (h.indexOf('89 50 4E 47') === 0) {
                return { what: '这是 PNG 图片，但扩展名是 .' + (e || '无') + '。', how: '改名为 .png 再拖进来。' };
            }
            if (h.indexOf('66 74 79 70') === 4 || h.indexOf('1A 45 DF A3') === 0) {
                return { what: '这是视频容器（MP4 / Matroska）。', how: '改名为 .mp4 或 .webm 再拖进来；能否播放取决于编码格式是否被浏览器支持。' };
            }
            return {
                what: '识别不出这个格式（扩展名 .' + (e || '无') + '）。',
                how: '本站能看：PDF、常见图片、音频视频、文本与代码、Markdown、JSON、CSV、xlsx、docx、pptx 文字、zip。老式 doc / ppt、HEIC、7z / rar、CAD 与 3D 模型需要专业软件或在线转换。'
            };
        }

        function renderFmt() {
            var groups = [
                ['文档', ['pdf'].concat(DOCX, PPTX)],
                ['表格', SHEET.concat(['csv', 'tsv'])],
                ['文本 / 代码', ['md', 'json'].concat(TEXT)],
                ['图片', IMG],
                ['音频 / 视频', AUDIO.concat(VIDEO)],
                ['压缩包', ZIP]
            ];
            var seen = {};
            var box = document.getElementById('fmt');
            box.textContent = '';
            groups.forEach(function (g) {
                var list = g[1].filter(function (e) {
                    if (e === 'markdown' || seen[e]) return false;
                    seen[e] = 1;
                    return true;
                });
                if (!list.length) return;
                box.appendChild(el('b', null, g[0]));
                box.appendChild(el('span', 'e', list.join(' · ')));
                box.appendChild(document.createElement('br'));
            });
        }

        renderFmt();

        drop.addEventListener('click', function () { picker.click(); });
        drop.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); picker.click(); }
        });
        picker.addEventListener('change', function () {
            add(picker.files);
            picker.value = '';
        });

        var depth = 0;
        ['dragenter', 'dragover'].forEach(function (t) {
            drop.addEventListener(t, function (e) { e.preventDefault(); if (t === 'dragenter') depth++; drop.classList.add('dragover'); });
        });
        document.addEventListener('dragover', function (e) { e.preventDefault(); });
        document.addEventListener('drop', function (e) { e.preventDefault(); });
        ['dragleave', 'drop'].forEach(function (t) {
            drop.addEventListener(t, function (e) {
                e.preventDefault();
                if (t === 'dragleave') depth = Math.max(0, depth - 1); else depth = 0;
                if (!depth) drop.classList.remove('dragover');
            });
        });
        drop.addEventListener('drop', function (e) {
            if (e.dataTransfer && e.dataTransfer.files.length) add(e.dataTransfer.files);
        });

        document.addEventListener('paste', function (e) {
            var items = e.clipboardData && e.clipboardData.files;
            if (items && items.length) { add(items); e.preventDefault(); }
        });

        document.getElementById('clearAll').addEventListener('click', function () {
            files.forEach(function (it) { if (it.url) URL.revokeObjectURL(it.url); });
            files = [];
            cur = null;
            token++;
            revokeDeck();
            renderList();
            reset();
        });

        window.addEventListener('resize', fitDeck);

        backZip.addEventListener('click', function () {
            if (zipReplay) { hush(); zipReplay(); }
        });

        printBtn.addEventListener('click', function () { window.print(); });

        encSel.addEventListener('change', function () {
            if (cur && ['text', 'json', 'csv', 'md', 'html'].indexOf(kindOf(cur.file.name)) >= 0) {
                dispatch(cur, kindOf(cur.file.name));
            }
        });

        window.addEventListener('beforeunload', function () {
            files.forEach(function (it) { if (it.url) URL.revokeObjectURL(it.url); });
        });
    })();
    </script>
</body>
</html>
