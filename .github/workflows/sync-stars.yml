name: 同步 GitHub Stars

on:
  schedule:
    - cron: '10 21 * * *' # 每日 UTC 21:10（北京时间凌晨 5:10）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取 GitHub Stars 并更新 stars.json
        run: python scripts/sync_stars.py

      - name: 有变化时提交
        run: |
          if [[ -n $(git status --porcelain data/stars.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/stars.json
            git commit -m "chore: 定时同步 GitHub Stars"
            git push
          else
            echo "Stars 无变化，跳过提交"
          fi
