name: 同步 GitHub Stars

on:
  schedule:
    - cron: '30 18 * * *' # 每日 UTC 18:30（北京时间 02:30，深夜低峰）
  workflow_dispatch:

permissions:
  contents: write

# 写数据的定时任务共用一条队列，谁在跑后面的等，避免相邻任务同时 push 互相顶掉
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取 GitHub Stars 并更新 stars.json
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # 带认证避开共享 IP 的匿名限额
        run: python scripts/sync_stars.py

      - name: 有变化时提交
        run: |
          if [[ -n $(git status --porcelain data/stars.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/stars.json
            git commit -m "chore: 定时同步 GitHub Stars"
            git push
          else
            echo "Stars 无变化，跳过提交"
          fi
