name: 同步 TMDB 评分

on:
  schedule:
    - cron: '15 18 * * *' # 每日 UTC 18:15（北京时间 02:15，深夜低峰）
  workflow_dispatch:

permissions:
  contents: write

# 写数据的定时任务共用一条队列，谁在跑后面的等，避免相邻任务同时 push 互相顶掉
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 拉取 TMDB 评分并更新 media.json
        run: python scripts/sync_tmdb.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }} # TMDB 网页 403 后改走官方 API，key 免费申请

      - name: 有变化时提交
        run: |
          if [[ -n $(git status --porcelain data/media.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/media.json
            git commit -m "chore: 定时同步 TMDB 评分"
            ok=0
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              if [[ $i -lt 3 ]]; then
                echo "push 失败（第 $i 次，多为服务端瞬时故障），拉取远端重放后重试"
                git pull --rebase --autostash || true
                sleep 10
              fi
            done
            if [[ $ok != 1 ]]; then
              echo "push 连续 3 次失败"
              exit 1
            fi
          else
            echo "评分无变化，跳过提交"
          fi
