name: 汇率同步

on:
  schedule:
    - cron: '40 15 * * *' # 每日 UTC 15:40（北京 23:40），欧洲央行当日参考价发布后
  workflow_dispatch:

permissions:
  contents: write

# 写数据的定时任务共用一条队列，谁在跑后面的等，避免相邻任务同时 push 互相顶掉
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 同步人民币汇率（ECB 参考价）
        run: python scripts/sync_fx.py

      - name: 有变化时提交
        run: |
          if [[ -n $(git status --porcelain data/fx.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fx.json
            git commit -m "chore: 定时同步人民币汇率（ECB 参考价）"
            git push
          else
            echo "汇率无新数据，跳过提交"
          fi
