name: 汇率同步

on:
  schedule:
    - cron: '7 18 * * *' # 每日 UTC 18:07（北京时间 02:07，深夜低峰；ECB 参考价北京 23 点前后已发布）
  workflow_dispatch:

permissions:
  contents: write

# 写数据的定时任务共用一条队列，谁在跑后面的等，避免相邻任务同时 push 互相顶掉
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 同步人民币汇率（ECB 参考价）
        run: python scripts/sync_fx.py

      - name: 有变化时提交
        run: |
          if [[ -n $(git status --porcelain data/fx.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fx.json
            git commit -m "chore: 定时同步人民币汇率（ECB 参考价）"
            ok=0
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              if [[ $i -lt 3 ]]; then
                echo "push 失败（第 $i 次，多为服务端瞬时故障），拉取远端重放后重试"
                git pull --rebase --autostash || true
                sleep 10
              fi
            done
            if [[ $ok != 1 ]]; then
              echo "push 连续 3 次失败"
              exit 1
            fi
          else
            echo "汇率无新数据，跳过提交"
          fi
