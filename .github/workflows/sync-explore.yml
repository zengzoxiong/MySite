name: 同步探索歌单与歌词

on:
  schedule:
    - cron: '45 18 * * *' # 每日 UTC 18:45（北京时间 02:45，深夜低峰）
  workflow_dispatch:

permissions:
  contents: write

# 写数据的定时任务共用一条队列，谁在跑后面的等，避免相邻任务同时 push 互相顶掉
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取网易云飙升榜并更新 explore.json
        run: python scripts/sync_explore.py

      - name: 同步播放器歌词 lyrics.json
        run: python scripts/sync_lyrics.py

      - name: 有变化时提交
        run: |
          if [[ -n $(git status --porcelain data/explore.json data/lyrics.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/explore.json data/lyrics.json
            git commit -m "chore: 定时同步探索歌单与歌词"
            git push
          else
            echo "榜单与歌词无变化，跳过提交"
          fi
