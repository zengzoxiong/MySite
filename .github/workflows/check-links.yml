name: 死链体检

on:
  schedule:
    - cron: '30 21 * * 1' # 每周一 UTC 21:30（北京时间周二凌晨 5:30）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 体检 links.json 并更新 link-health.json
        run: python scripts/check_links.py

      - name: 有变化时提交
        run: |
          if [[ -n $(git status --porcelain data/link-health.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/link-health.json
            git commit -m "chore: 定时体检网站收藏死链"
            git push
          else
            echo "体检结果无变化，跳过提交"
          fi
