name: 死链体检

on:
  schedule:
    - cron: '45 19 * * 1' # 每周一 UTC 19:45（北京时间周二 03:45，深夜低峰）
  workflow_dispatch:

permissions:
  contents: write

# 写数据的定时任务共用一条队列，谁在跑后面的等，避免相邻任务同时 push 互相顶掉
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 体检 links.json 并更新 link-health.json
        run: python scripts/check_links.py

      - name: 有变化时提交
        run: |
          if [[ -n $(git status --porcelain data/link-health.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/link-health.json
            git commit -m "chore: 定时体检网站收藏死链"
            git push
          else
            echo "体检结果无变化，跳过提交"
          fi
