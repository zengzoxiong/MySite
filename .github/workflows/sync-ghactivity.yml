name: 同步 GitHub 贡献热力图

on:
  schedule:
    - cron: '50 21 * * *' # 每日 UTC 21:50（北京时间凌晨 5:50）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取贡献数据并更新 gh-activity.json
        run: python scripts/sync_ghactivity.py

      - name: 有变化时提交
        run: |
          if [[ -n $(git status --porcelain data/gh-activity.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/gh-activity.json
            git commit -m "chore: 定时同步 GitHub 贡献热力图"
            git push
          else
            echo "贡献数据无变化，跳过提交"
          fi
