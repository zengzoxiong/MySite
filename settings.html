<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置</title>
    <link rel="stylesheet" href="styles.css">
    <!-- 外观偏好清单（与主站共用一份），必须先于下面内联脚本 -->
    <script src="assets/appearance.js"></script>
    <style>
        /* 设置页自身布局（复用全站变量与开关组件样式） */
        body {
            min-height: 100vh;
            display: flex;
            align-items: stretch;
            padding: 0;
            background: transparent; /* 在父页玻璃弹层内保持透明 */
        }

        .settings-page {
            width: 100%;
            max-height: 100vh; /* 选项变多后靠本页自己滚，别撑破弹层 */
            overflow-y: auto;
            background-color: var(--card-bg);
            padding: 26px 28px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .settings-page::-webkit-scrollbar {
            width: 4px;
        }

        .settings-page::-webkit-scrollbar-track {
            background: transparent;
        }

        .settings-page::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .settings-page .settings-title {
            font-size: 1rem;
            margin-bottom: 16px;
        }

        .settings-page .settings-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-page .settings-label {
            font-size: 0.86rem;
        }



        .accent-dots {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .accent-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            padding: 0;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .accent-dot:hover { transform: scale(1.15); }

        .accent-dot.active {
            box-shadow: 0 0 0 2px var(--card-bg), 0 0 0 4px var(--text-primary);
        }

        .settings-hint {
            margin-top: 12px;
            font-size: 0.7rem;
            color: var(--text-tertiary);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="settings-page">
        <div class="settings-title">设置</div>
        <div class="settings-item settings-col">
            <span class="settings-label">主题色</span>
            <div class="accent-dots" id="accentDots" role="radiogroup" aria-label="主题色"></div>
        </div>
        <div class="settings-item">
            <span class="settings-label">外观模式</span>
            <select class="settings-select" id="settingThemeMode" aria-label="外观模式"></select>
        </div>
        <div class="settings-item">
            <span class="settings-label">动画效果</span>
            <label class="settings-switch">
                <input type="checkbox" id="settingAnim" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="settings-item">
            <span class="settings-label">搜索回车后聚焦首条</span>
            <label class="settings-switch">
                <input type="checkbox" id="settingFocusFirst" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="settings-item settings-col">
            <div class="settings-line">
                <span class="settings-label">界面字体</span>
                <select class="settings-select" id="settingFont" aria-label="界面字体"></select>
            </div>
            <div class="settings-preview">拾光集 · <b>The quick brown fox</b> · 0123456789</div>
        </div>
        <div class="settings-item">
            <span class="settings-label">首页时钟风格</span>
            <select class="settings-select" id="settingClock" aria-label="首页时钟风格"></select>
        </div>
        <div class="settings-item settings-col">
            <div class="settings-line">
                <span class="settings-label">天气城市</span>
                <span class="settings-city-current" id="settingCityCurrent">自动定位</span>
            </div>
            <div class="settings-city-picker">
                <input type="text" class="settings-city-input" id="settingCitySearch"
                       placeholder="搜索城市，如：杭州 / Tokyo" autocomplete="off" aria-label="搜索天气城市">
                <div class="settings-city-list" id="settingCityList" hidden></div>
            </div>
            <button type="button" class="settings-clear settings-city-auto" id="settingCityAuto">恢复自动定位</button>
        </div>
        <div class="settings-item">
            <span class="settings-label">清除本地数据</span>
            <button class="settings-clear" id="settingClearCache">清除</button>
        </div>
        <div class="settings-item">
            <span class="settings-label">请求最新页面</span>
            <button class="settings-clear" id="settingForceRefresh">刷新</button>
        </div>
    </div>

    <script>
        (function () {
        const KEY_ANIM = 'animEnabled', KEY_FOCUS = 'focusFirst';
        // 隐私模式/站点数据被禁时读写会抛异常，统一走安全通道
        const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
        const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 忽略 */ } };
        const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) { /* 忽略 */ } };
        const notify = (type) => {
            try { parent.postMessage({ type }, location.origin); } catch (e) { /* 独立打开时无父页 */ }
        };
        const AP = window.SiteAppearance;
        if (!AP) {
            // appearance.js 加载失败：外观设置全部依赖它，早退保住刷新/Esc 两个不依赖它的能力
            document.getElementById('settingForceRefresh').addEventListener('click', () => notify('force-refresh'));
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') notify('close-settings'); });
            return;
        }

        // 外观模式：浅色 / 深色 / 跟随系统
        const themeSelect = document.getElementById('settingThemeMode');
        AP.THEME_MODES.forEach((m) => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.textContent = m.name;
            themeSelect.appendChild(opt);
        });
        const applyTheme = () => { themeSelect.value = AP.applyThemeMode(); };
        applyTheme();
        themeSelect.addEventListener('change', () => {
            lsSet(AP.KEY_THEME, themeSelect.value);
            applyTheme();
            notify('settings-changed');
        });
        AP.watchSystemTheme(applyTheme); // 跟随系统时，系统明暗变化实时跟上

        // 动画效果
        const animBox = document.getElementById('settingAnim');
        const applyAnim = () => {
            const on = lsGet(KEY_ANIM) !== 'off';
            document.body.classList.toggle('no-anim', !on);
            animBox.checked = on;
        };
        applyAnim();
        animBox.addEventListener('change', () => {
            lsSet(KEY_ANIM, animBox.checked ? 'on' : 'off');
            document.body.classList.toggle('no-anim', !animBox.checked);
            notify('settings-changed');
        });

        // 搜索聚焦首条
        const focusBox = document.getElementById('settingFocusFirst');
        focusBox.checked = lsGet(KEY_FOCUS) !== 'off';
        focusBox.addEventListener('change', () => {
            lsSet(KEY_FOCUS, focusBox.checked ? 'on' : 'off');
        });

        // ===== 主题色（预设清单来自 assets/appearance.js） =====
        const accentDots = document.getElementById('accentDots');
        const KEY_ACCENT = AP.KEY_ACCENT;

        function readAccentSaved() {
            try { return JSON.parse(lsGet(KEY_ACCENT) || 'null'); }
            catch (e) { return null; }
        }

        function renderAccentDots() {
            const saved = readAccentSaved();
            accentDots.innerHTML = '';
            AP.ACCENTS.forEach((a) => {
                const dot = document.createElement('button');
                dot.type = 'button';
                dot.className = 'accent-dot' + ((saved ? saved.id : '') === a.id ? ' active' : '');
                dot.style.background = 'linear-gradient(135deg, ' + a.p + ', ' + a.s + ')';
                dot.title = a.name;
                dot.setAttribute('aria-label', '主题色：' + a.name);
                dot.addEventListener('click', () => {
                    lsSet(KEY_ACCENT, JSON.stringify({ id: a.id, p: a.p, s: a.s }));
                    AP.applyAccent(a.id);
                    notify('accent-changed');
                    renderAccentDots();
                });
                accentDots.appendChild(dot);
            });
        }
        renderAccentDots();
        // ===== 外观：界面字体 + 首页时钟风格（清单来自 assets/appearance.js） =====
        const fontSelect = document.getElementById('settingFont');
        const clockSelect = document.getElementById('settingClock');

        function fillSelect(sel, list) {
            list.forEach((item) => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.textContent = item.name;
                sel.appendChild(opt);
            });
        }
        fillSelect(fontSelect, AP.SITE_FONTS);
        fillSelect(clockSelect, AP.CLOCK_STYLES);

        fontSelect.addEventListener('change', () => {
            lsSet(AP.KEY_FONT, fontSelect.value);
            notify('settings-changed'); // 先让父页并行去加载，别等本页字体就绪
            AP.applySiteFont(fontSelect.value); // 本页（iframe）也跟着换字体
        });

        clockSelect.addEventListener('change', () => {
            lsSet(AP.KEY_CLOCK, clockSelect.value);
            notify('settings-changed');
        });

        // ===== 天气城市：搜索 Open-Meteo 地理编码，可选任意城市；默认自动定位 =====
        const cityCurrent = document.getElementById('settingCityCurrent');
        const citySearch = document.getElementById('settingCitySearch');
        const cityList = document.getElementById('settingCityList');
        const cityAutoBtn = document.getElementById('settingCityAuto');
        let citySearchTimer = 0;

        const citySub = (it) => {
            // 从细到粗拼行政区（市·省·国家），去掉空值/与城市名互为前缀的层级（杭州↔杭州市），
            // 用来区分同名城市（如湖北两个「峰口」分属荆州/黄冈，只到省会看着完全一样）
            const sameAsName = (v) => v === it.name || v.startsWith(it.name) || it.name.startsWith(v);
            const parts = [];
            [it.admin2, it.admin1, it.country].forEach((v) => {
                if (v && !sameAsName(v) && !parts.includes(v)) parts.push(v);
            });
            return parts.join(' · ');
        };

        function hideCityList() {
            cityList.hidden = true;
            cityList.innerHTML = '';
        }

        function cityRow(item, plainText) {
            const row = document.createElement('button');
            row.type = 'button';
            row.className = 'settings-city-row' + (item ? '' : ' is-plain');
            if (!item) {
                row.textContent = plainText;
                return row;
            }
            const n = document.createElement('span');
            n.className = 'n';
            n.textContent = item.name;
            row.appendChild(n);
            const sub = citySub(item);
            if (sub) {
                const s = document.createElement('span');
                s.className = 's';
                s.textContent = sub;
                row.appendChild(s);
            }
            // mousedown 先于 input 的 blur 触发，保证点得中
            row.addEventListener('mousedown', (e) => { e.preventDefault(); pickCity(item); });
            return row;
        }

        function renderCityList(items, loading, failText) {
            cityList.innerHTML = '';
            if (failText) {
                cityList.appendChild(cityRow(null, failText));
                cityList.hidden = false;
                return;
            }
            if (loading) {
                cityList.appendChild(cityRow(null, '搜索中…'));
                cityList.hidden = false;
                return;
            }
            // 名称+副标题完全相同的行只留一条（接口偶会重复返回同一地方）
            const seen = new Set();
            const uniq = [];
            (items || []).forEach((it) => {
                const key = it.name + '|' + citySub(it);
                if (!seen.has(key)) { seen.add(key); uniq.push(it); }
            });
            if (!uniq.length) cityList.appendChild(cityRow(null, '没有匹配的城市'));
            else uniq.forEach((it) => cityList.appendChild(cityRow(it)));
            cityList.hidden = false;
        }

        function searchCity(q) {
            const url = 'https://geocoding-api.open-meteo.com/v1/search?count=8&language=zh&format=json&name=' + encodeURIComponent(q);
            return fetch(url).then((res) => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            }).then((data) => data.results || []);
        }

        function pickCity(item) {
            AP.setWeatherCity({ name: item.name, lat: item.latitude, lon: item.longitude, sub: citySub(item) });
            hideCityList();
            syncCityFromStorage();
            notify('settings-changed'); // 父页检测到城市变了会重拉天气
        }

        function syncCityFromStorage() {
            cityCurrent.textContent = AP.weatherCityLabel();
            cityAutoBtn.hidden = AP.getWeatherCity().auto; // 已是自动定位就没必要再「恢复」
            citySearch.value = '';
            hideCityList();
        }

        let citySearchSeq = 0;
        citySearch.addEventListener('input', () => {
            clearTimeout(citySearchTimer);
            const seq = ++citySearchSeq;
            const q = citySearch.value.trim();
            if (!q) { hideCityList(); return; }
            renderCityList(null, true);
            citySearchTimer = setTimeout(() => {
                searchCity(q)
                    .then((items) => { if (seq === citySearchSeq) renderCityList(items); })
                    .catch(() => { if (seq === citySearchSeq) renderCityList(null, false, '搜索失败，请稍后再试'); });
            }, 300);
        });
        citySearch.addEventListener('keydown', (e) => {
            // 列表开着时 Esc 只关列表，别顺带把整个设置弹层关了
            if (e.key === 'Escape' && !cityList.hidden) { e.stopPropagation(); hideCityList(); }
        });
        citySearch.addEventListener('blur', () => setTimeout(hideCityList, 120));
        cityAutoBtn.addEventListener('click', () => {
            AP.setWeatherCity('auto');
            syncCityFromStorage();
            notify('settings-changed');
        });

        function syncFontFromStorage() {
            const id = AP.fontById(lsGet(AP.KEY_FONT)).id;
            fontSelect.value = id;
            return AP.applySiteFont(id); // 本页（iframe）也跟着换字体
        }

        function syncClockFromStorage() {
            clockSelect.value = AP.clockStyleById(lsGet(AP.KEY_CLOCK)).id;
        }

        syncFontFromStorage();
        syncClockFromStorage();
        syncCityFromStorage();

        // 清除本地数据
        const clearBtn = document.getElementById('settingClearCache');
        clearBtn.addEventListener('click', () => {
            // 本站全部自写键：外观/行为/布局/签到/播放器/批量安装勾选/快照/反向地名缓存
            const prefixes = ['checkin:', 'sidebarSection_', 'reverseGeo:'];
            const exact = ['theme', 'accentColor', 'fontFamily', 'clockStyle', 'weatherCity',
                'animEnabled', 'focusFirst', 'dashboardTodos', 'sidebarCollapsed',
                'checkinLast', 'checkinStreak', 'mpMode', 'mpVolume', 'mpMuted',
                'wingetSel', 'weatherSnap', 'airSnap'];
            try {
                Object.keys(localStorage).forEach((k) => {
                    if (exact.includes(k) || prefixes.some((p) => k.startsWith(p))) lsDel(k);
                });
            } catch (e) { /* 隐私模式无键可清 */ }
            notify('clear-cache');
            clearBtn.textContent = '✓';
            setTimeout(() => { clearBtn.textContent = '清除'; }, 1600);
        });

        // 其他窗口修改主题时同步本页（KEY_ACCENT 也在内，勿另开监听器重复渲染）
        window.addEventListener('storage', (e) => {
            if (e.key === AP.KEY_THEME) applyTheme();
            if (e.key === KEY_ANIM) applyAnim();
            if (e.key === AP.KEY_FONT) syncFontFromStorage();
            if (e.key === AP.KEY_CLOCK) syncClockFromStorage();
            if (e.key === AP.KEY_WEATHER) syncCityFromStorage();
            if (e.key === KEY_ACCENT) renderAccentDots();
        });

        // 强制刷新：通知父页清除缓存后整页重载
        document.getElementById('settingForceRefresh').addEventListener('click', () => {
            notify('force-refresh');
        });

        // ESC 通知父页关闭弹层（焦点在本页时键盘事件不会传给父页）
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') notify('close-settings');
        });
        })(); // 顶层 IIFE：让 AP 缺失时的早退 return 合法
    </script>
</body>
</html>
