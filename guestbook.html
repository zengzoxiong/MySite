<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
        }

        .guestbook {
            width: 100%;
            max-width: 760px;
        }

        .guestbook h1 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .guestbook .sub {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .back {
            margin-top: 32px;
            font-size: 0.85rem;
            color: var(--accent-color);
            text-decoration: none;
        }

        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="guestbook">
        <h1>💬 留言板</h1>
        <p class="sub">基于 GitHub Comments——留言需要 GitHub 账号登录，内容公开保存在本仓库的 Issues 中。</p>
        <div id="utterances-container"></div>
        <a class="back" href="./">← 返回工具箱</a>
    </div>

    <script>
        // 深浅色跟随本站主题（localStorage 共享）
        const dark = localStorage.getItem('theme')
            ? localStorage.getItem('theme') === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;

        const script = document.createElement('script');
        script.src = 'https://utteranc.es/client.js';
        script.setAttribute('repo', 'zengzoxiong/MySite');
        script.setAttribute('issue-term', 'guestbook');
        script.setAttribute('theme', dark ? 'github-dark' : 'github-light');
        script.setAttribute('crossorigin', 'anonymous');
        script.async = true;
        document.getElementById('utterances-container').appendChild(script);
    </script>
</body>
</html>
